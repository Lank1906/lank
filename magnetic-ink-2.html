<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Magnetic Ink</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #050505;
  display: flex;
  justify-content: center;
  align-items: center;
}

canvas {
  width: min(90vw, 700px);
  height: min(90vw, 700px);
  display: block;
  cursor: crosshair;
}
</style>
</head>

<body>

<canvas width="700" height="700"></canvas>

<script>

const canvas = document.querySelector("canvas");
const ctx = canvas.getContext("2d");

const width = canvas.width;
const height = canvas.height;

const cx = width * 0.5;
const cy = height * 0.5;


/* =========================
   BASIC
========================= */

const randomRange = (min, max) =>
  Math.random() * (max - min) + min;

const mapRange = (value, inMin, inMax, outMin, outMax) => {
  return outMin +
    ((value - inMin) * (outMax - outMin)) /
    (inMax - inMin);
};


/* =========================
   NOISE
========================= */

function noise2D(x, y, frequency = 1, amplitude = 1) {

  function hash(ix, iy) {

    let h =
      ix * 374761393 +
      iy * 668265263 +
      1337 * 1446649;

    h = (h ^ (h >> 13)) * 1274126177;

    return ((h ^ (h >> 16)) >>> 0) / 4294967295;
  }

  function fade(t) {
    return t * t * t *
      (t * (t * 6 - 15) + 10);
  }

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  x *= frequency;
  y *= frequency;

  const x0 = Math.floor(x);
  const y0 = Math.floor(y);

  const x1 = x0 + 1;
  const y1 = y0 + 1;

  const sx = fade(x - x0);
  const sy = fade(y - y0);

  const n00 = hash(x0, y0);
  const n10 = hash(x1, y0);
  const n01 = hash(x0, y1);
  const n11 = hash(x1, y1);

  const ix0 = lerp(n00, n10, sx);
  const ix1 = lerp(n01, n11, sx);

  const value = lerp(ix0, ix1, sy);

  return (value * 2 - 1) * amplitude;
}


/* =========================
   VECTOR
========================= */

class Vector {

  constructor(x, y) {
    this.x = x;
    this.y = y;
  }

  getDistance(v) {

    const dx = this.x - v.x;
    const dy = this.y - v.y;

    return Math.sqrt(dx * dx + dy * dy);
  }
}


/* =========================
   PARTICLE
========================= */

class Particle {

  constructor() {

    this.reset();
  }

  reset() {

    const angle =
      randomRange(0, Math.PI * 2);

    const radius =
      randomRange(180, 340);

    this.pos = new Vector(
      cx + Math.cos(angle) * radius,
      cy + Math.sin(angle) * radius
    );

    this.vel = new Vector(
      randomRange(-0.5, 0.5),
      randomRange(-0.5, 0.5)
    );

    this.size =
      randomRange(1.2, 3.2);

    this.life =
      randomRange(0, 1);

    this.angle =
      randomRange(0, Math.PI * 2);

    this.speed =
      randomRange(0.4, 1.2);
  }


  update(time) {

    const dx = cx - this.pos.x;
    const dy = cy - this.pos.y;

    const distance =
      Math.sqrt(dx * dx + dy * dy);

    const nx = dx / (distance || 1);
    const ny = dy / (distance || 1);


    /* =====================
       MAGNETIC FORCE
    ===================== */

    let force =
      mapRange(
        Math.min(distance, 350),
        350,
        0,
        0.01,
        0.75
      );


    /* =====================
       TANGENTIAL FORCE
       tạo chuyển động xoắn
    ===================== */

    const tx = -ny;
    const ty = nx;

    const swirl =
      mapRange(
        Math.min(distance, 300),
        300,
        0,
        0.15,
        1.8
      );


    this.vel.x +=
      nx * force +
      tx * swirl * 0.025;

    this.vel.y +=
      ny * force +
      ty * swirl * 0.025;


    /* =====================
       NOISE
    ===================== */

    const n =
      noise2D(
        this.pos.x,
        this.pos.y,
        0.008,
        1
      );

    this.vel.x +=
      Math.cos(n * Math.PI * 2) * 0.015;

    this.vel.y +=
      Math.sin(n * Math.PI * 2) * 0.015;


    /* =====================
       DAMPING
    ===================== */

    this.vel.x *= 0.985;
    this.vel.y *= 0.985;


    this.pos.x += this.vel.x;
    this.pos.y += this.vel.y;


    /* =====================
       CENTER EXPLOSION
    ===================== */

    if (distance < 18) {

      const angle =
        Math.atan2(
          this.pos.y - cy,
          this.pos.x - cx
        );

      const burst =
        randomRange(3, 7);

      this.vel.x =
        Math.cos(angle) * burst;

      this.vel.y =
        Math.sin(angle) * burst;
    }


    /* =====================
       LIFE
    ===================== */

    this.life += 0.005;

    if (
      this.life > 1 ||
      this.pos.x < -50 ||
      this.pos.x > width + 50 ||
      this.pos.y < -50 ||
      this.pos.y > height + 50
    ) {

      this.reset();
    }
  }


  draw() {

    const speed =
      Math.sqrt(
        this.vel.x * this.vel.x +
        this.vel.y * this.vel.y
      );

    const alpha =
      Math.min(
        1,
        0.25 + speed * 0.18
      );

    ctx.save();

    ctx.translate(
      this.pos.x,
      this.pos.y
    );

    ctx.rotate(
      Math.atan2(
        this.vel.y,
        this.vel.x
      )
    );


    /*
      Hạt không chỉ là chấm.
      Vẽ thành một đoạn nhỏ
      để có cảm giác chuyển động.
    */

    ctx.beginPath();

    ctx.moveTo(
      -this.size * 2,
      0
    );

    ctx.lineTo(
      this.size * 2 + speed * 2,
      0
    );

    ctx.lineWidth =
      this.size;

    ctx.strokeStyle =
      `rgba(255,255,255,${alpha})`;

    ctx.stroke();

    ctx.restore();
  }
}


/* =========================
   CREATE PARTICLES
========================= */

const particles = [];

const PARTICLE_COUNT = 650;

for (let i = 0; i < PARTICLE_COUNT; i++) {

  particles.push(
    new Particle()
  );
}


/* =========================
   SHOCKWAVES
========================= */

const waves = [];

function createWave() {

  waves.push({
    radius: 10,
    alpha: 1
  });
}


function drawWaves() {

  for (
    let i = waves.length - 1;
    i >= 0;
    i--
  ) {

    const wave = waves[i];

    wave.radius += 5;
    wave.alpha *= 0.94;

    ctx.beginPath();

    ctx.arc(
      cx,
      cy,
      wave.radius,
      0,
      Math.PI * 2
    );

    ctx.lineWidth = 2;

    ctx.strokeStyle =
      `rgba(255,255,255,${wave.alpha})`;

    ctx.stroke();


    if (wave.alpha < 0.02) {
      waves.splice(i, 1);
    }
  }
}


/* =========================
   CENTER
========================= */

function drawCenter(time) {

  const pulse =
    Math.sin(time * 0.004) * 2;

  ctx.beginPath();

  ctx.arc(
    cx,
    cy,
    5 + pulse,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "white";

  ctx.fill();


  /* subtle glow */

  const gradient =
    ctx.createRadialGradient(
      cx,
      cy,
      0,
      cx,
      cy,
      60
    );

  gradient.addColorStop(
    0,
    "rgba(255,255,255,0.18)"
  );

  gradient.addColorStop(
    1,
    "rgba(255,255,255,0)"
  );

  ctx.fillStyle =
    gradient;

  ctx.beginPath();

  ctx.arc(
    cx,
    cy,
    60,
    0,
    Math.PI * 2
  );

  ctx.fill();
}


/* =========================
   CLICK IMPULSE
========================= */

canvas.addEventListener(
  "click",
  () => {

    createWave();

    for (const p of particles) {

      const dx =
        p.pos.x - cx;

      const dy =
        p.pos.y - cy;

      const distance =
        Math.sqrt(dx * dx + dy * dy);

      if (distance < 250) {

        const nx =
          dx / (distance || 1);

        const ny =
          dy / (distance || 1);

        const power =
          mapRange(
            distance,
            250,
            0,
            1,
            8
          );

        p.vel.x +=
          nx * power;

        p.vel.y +=
          ny * power;
      }
    }
  }
);


/* =========================
   ANIMATION
========================= */

let lastWave = 0;

function animate(time) {

  /*
    Trail effect.
    Không clear hoàn toàn canvas.
  */

  ctx.fillStyle =
    "rgba(5,5,5,0.16)";

  ctx.fillRect(
    0,
    0,
    width,
    height
  );


  /*
    Tự tạo shockwave
    mỗi vài giây
  */

  if (time - lastWave > 1800) {

    createWave();

    lastWave = time;
  }


  drawWaves();


  for (const particle of particles) {

    particle.update(time);
    particle.draw();
  }


  drawCenter(time);


  requestAnimationFrame(animate);
}


ctx.fillStyle = "#050505";

ctx.fillRect(
  0,
  0,
  width,
  height
);

requestAnimationFrame(animate);

</script>

</body>
</html>
