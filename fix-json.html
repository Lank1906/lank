function fixBrokenJSON(input) {
  let output = "";

  let inString = false;
  let escaped = false;

  // "key" hoặc "value"
  let stringType = null;

  // Theo dõi cấu trúc JSON
  const stack = [];
  let expect = "value";

  const skipWhitespace = (index) => {
    while (index < input.length && /\s/.test(input[index])) {
      index++;
    }
    return index;
  };

  for (let i = 0; i < input.length; i++) {
    const ch = input[i];

    // =========================
    // Đang ở ngoài string
    // =========================
    if (!inString) {
      if (ch === '"') {
        const parent = stack[stack.length - 1];

        // Nếu đang ở object và đang chờ key => đây là key
        stringType =
          parent === "object" && expect === "key"
            ? "key"
            : "value";

        inString = true;
        output += ch;
        continue;
      }

      if (ch === "{") {
        stack.push("object");
        expect = "key";
        output += ch;
        continue;
      }

      if (ch === "[") {
        stack.push("array");
        expect = "value";
        output += ch;
        continue;
      }

      if (ch === "}") {
        stack.pop();
        expect = "value";
        output += ch;
        continue;
      }

      if (ch === "]") {
        stack.pop();
        expect = "value";
        output += ch;
        continue;
      }

      if (ch === ":") {
        expect = "value";
        output += ch;
        continue;
      }

      if (ch === ",") {
        if (stack[stack.length - 1] === "object") {
          expect = "key";
        } else {
          expect = "value";
        }

        output += ch;
        continue;
      }

      output += ch;
      continue;
    }

    // =========================
    // Đang ở trong string
    // =========================

    // Đã escape ký tự trước đó
    if (escaped) {
      output += ch;
      escaped = false;
      continue;
    }

    // Escape hợp lệ
    if (ch === "\\") {
      output += ch;
      escaped = true;
      continue;
    }

    // =========================
    // Gặp "
    // =========================
    if (ch === '"') {
      const next = skipWhitespace(i + 1);

      let isClosingQuote = false;

      if (stringType === "key") {
        // Key phải kết thúc trước :
        isClosingQuote = input[next] === ":";
      } else {
        const nextChar = input[next];

        // String value thường kết thúc bởi:
        // , ] }
        if (
          nextChar === "]" ||
          nextChar === "}" ||
          nextChar === ""
        ) {
          isClosingQuote = true;
        }

        // Trường hợp:
        // "abc", "def"
        if (nextChar === ",") {
          const afterComma = skipWhitespace(next + 1);
          const c = input[afterComma];

          // Chỉ coi là closing nếu sau comma
          // thực sự bắt đầu một JSON element mới.
          if (
            c === '"' ||
            c === "{" ||
            c === "[" ||
            c === "]" ||
            c === "}" ||
            c === ""
          ) {
            isClosingQuote = true;
          }
        }
      }

      if (isClosingQuote) {
        inString = false;
        stringType = null;
        output += ch;
      } else {
        // Đây là " nằm bên trong nội dung string
        output += '\\"';
      }

      continue;
    }

    // JSON không cho phép newline/tab raw trong string
    if (ch === "\n") {
      output += "\\n";
    } else if (ch === "\r") {
      output += "\\r";
    } else if (ch === "\t") {
      output += "\\t";
    } else {
      output += ch;
    }
  }

  if (inString) {
    throw new Error("JSON vẫn còn một string chưa đóng.");
  }

  // Kiểm tra lần cuối
  try {
    JSON.parse(output);
  } catch (error) {
    throw new Error(
      "Đã repair nhưng JSON vẫn không hợp lệ: " + error.message
    );
  }

  return output;
}

"emotion_tag":"","characters_in_scene":["Trần Minh","Thần Chết Thực Tập"],"image_prompt":"[Thần Chết Thực Tập] delivering a slapstick kick to the backside of [Trần Minh], who is launched forward with arms flailing and eyes wide; the white void swirls to black at the edges. Cartoonish motion, comedic.","video_prompt":"Sudden kick, [Trần Minh] shoots away from camera with flailing arms while the white void collapses into darkness."},{"scene_id":7,"original_text":"Khi tôi tỉnh lại lần nữa, cảm giác đầu tiên là THỐI.\nThối kinh khủng. Mùi ẩm mốc, mùi mồ hôi, mùi phân gà, mùi gì đó như mùi thuốc bắc bị thiu trộn lẫn vào nhau.\nCảm giác thứ hai là ĐAU. Đau ê ẩm ở mông. Chính xác là ở... giữa hai chân và mông.\nTôi bật dậy.\n"Aaaaaa! Đau quá!"\nTiếng hét của tôi không phải là giọng trầm ấm 26 năm của tôi, mà là một giọng the thé, non choẹt như vịt đực mới vỡ giọng.","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử"],"image_prompt":"Inside a squalid ancient-Chinese servants' room with damp walls and straw: [Tiểu Minh Tử] bolting upright from a hard plank bed, mouth wide open mid-scream, hands clutching his backside, eyes squeezed shut. Dusty shafts of light, comedic distress.","video_prompt":"Sharp jolt upward from lying position, hands grab backside, mouth opens in a cracked squeal; dust motes swirl in the light shafts."},{"scene_id":8,"original_text":"Tôi nhìn xuống.\nTôi đang mặc một bộ đồ vải thô màu xám xịt, vá chằng vá đụp. Tay tôi... tay tôi nhỏ xíu, gầy guộc, đen nhẻm. Chân tôi cũng nhỏ.\nTôi hoảng hốt chạy tới cái chậu nước đồng cáu bẩn ở góc phòng để soi.\nTrong chậu nước, là mặt của một thằng nhóc chừng 15, 16 tuổi, mặt mũi lấm lem, tóc cắt nham nhở như chó gặm, đang há hốc mồm nhìn tôi với vẻ mặt ngu không thể tả.","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử"],"image_prompt":"Close-up of [Tiểu Minh Tử] leaning over a grimy bronze basin of water in a dim corner, his dirty startled reflection staring back with gaping mouth; .\n"RẦM!"\nCánh cửa gỗ mục nát bị đá văng ra. Một tên thái giám mặt trắng bệch, môi đỏ chót, tay cầm cây phất trần bước vào. Trông hắn giống hệt mấy tên thái giám gian xảo trong phim.\n"Tiểu Minh Tử! Mày chết dí ở đâu rồi! Đến giờ đi tịnh thân rồi mà còn nằm ườn ra đó hả? Lý công đang đợi ở phòng Tịnh Sự, chậm một khắc là cả lũ chúng ta bị vạ lây đấy!"","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Tên Thái Giám"],"image_prompt":"A rotting wooden door kicked open with splinters flying: [Tên Thái Giám] with a chalk-white face and crimson lips strides in brandishing a horsehair whisk, sneering; [Tiểu Minh Tử] startled on the floor. Harsh backlight from the doorway.","video_prompt":"Door bursts open with splinters; [Tên Thái Giám] strides forward pointing the whisk at [Tiểu Minh Tử], who flinches; light flares in from the doorway."},{"scene_id":12,"original_text":"Tịnh thân?! Không phải vừa mới nói là chuẩn bị thôi sao? Sao lại đến nhanh thế!\n"Công... công công ơi, con... con đau bụng quá! Hay là để ngày mai được không ạ?" Tôi ôm bụng giả vờ.\nTên thái giám kia cười khẩy: "Đau bụng? Lát nữa cắt xong thì mày hết đau bụng luôn. Đi mau!"\nHắn túm cổ áo tôi lôi xệch ra ngoài.\nTôi tuyệt vọng. Không lẽ vừa xuyên không được 5 phút đã phải tạm biệt thằng em trai gắn bó 26 năm sao? Không thể! Tôi phải nghĩ cách!","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Tên Thái Giám"],"image_prompt":"[Tên Thái Giám] dragging [Tiểu Minh Tử] by the scruff of his tunic across a dirt floor; [Tiểu Minh Tử] clutching his belly with an overly fake pained face, legs dragging, eyes darting for an escape. Comedic desperation.","video_prompt":"Tracking shot: [Tên Thái Giám] hauls [Tiểu Minh Tử] backward by the collar, his heels scraping the dirt as he clutches his belly and squirms."},{"scene_id":13,"original_text":"Trên đường bị lôi đi, tôi đảo mắt nhìn quanh. Đây là một dãy nhà cấp 4 lụp xụp, gọi là nơi ở của thái giám cấp thấp. Xa xa là những cung điện nguy nga tráng lệ, mái ngói vàng rực rỡ. Đúng là hoàng cung rồi.\nBỗng nhiên, một tiếng chiêng trống vang lên inh ỏi.\n"Hoàng Thượng giá lâm! Hoàng Thượng giá lâm! Tất cả quỳ xuống!"\nCả đám thái giám, cung nữ đang đi lại đều quỳ rạp xuống. Tên thái giám đang túm tôi cũng vội quỳ xuống, tiện tay ấn đầu tôi xuống đất.\nTôi úp mặt xuống nền đất bẩn, nhưng vẫn lén lén ngẩng lên nhìn.","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Tên Thái Giám"],"image_prompt":"Wide view of a palace courtyard: rows of eunuchs and maids kneeling; shabby low huts in the foreground and golden-tiled palaces glowing in the distance; [Tên Thái Giám] kneeling while pushing [Tiểu Minh Tử]'s head to the dirt, the boy sneaking a peek upward. Bright daylight.","video_prompt":"Gong sounds; crowd drops to their knees in a wave across the courtyard; [Tiểu Minh Tử]'s face is pressed down, then his eyes slowly lift to peek."},{"scene_id":14,"original_text":"Từ xa, một đoàn người đang đi tới. Đi đầu là một thanh niên mặc long bào màu vàng sáng, dáng người cao ráo, mặt mũi... khoan đã.\nCái mặt đó... sao quen thế nhỉ?\nMày kiếm mắt sáng, sống mũi cao, nhưng cái nốt ruồi to tổ bố ở cạnh mép thì không lẫn đi đâu được. Và cái dáng đi hai hàng, chân vòng kiềng như vừa cưỡi ngựa xong...\nTôi dụi mắt. Dụi thêm lần nữa.\nĐệt mợ!\nĐây chẳng phải là thằng chó Trần Long - bạn thân nối khố, cùng xóm, cùng lớp, cùng nhau tắm mưa, cùng nhau copy bài tập từ cấp 1 đến cấp 3 của tôi hay sao?","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Trần Long"],"image_prompt":"A procession in the distance led by [Trần Minh Long] walking bow-legged in a bright yellow dragon robe with a large mole at the corner of his mouth; in the foreground [Tiểu Minh Tử], face pressed low, rubbing his eyes in disbelief. Golden palace backdrop, sunny.","video_prompt":"Slow zoom toward [Trần Long] as he approaches with his bow-legged gait; cut-in of [Tiểu Minh Tử] rubbing his eyes twice and blinking wildly."},{"scene_id":15,"original_text":"Thằng Long! Thằng Long béo ngày xưa chuyên ăn cắp bánh mì của tôi! Nó đã chuyển đi nơi khác từ năm lớp 9, mất liên lạc luôn!\nNó... nó làm Hoàng Thượng á?\nVì quá sốc, tôi quên mất mình đang phải quỳ, bật thẳng dậy, chỉ tay vào mặt Hoàng Thượng và hét lên bằng cái giọng vịt đực của mình:\n"TRẦN LONG! MÀY LÀ THẰNG LONG CHÓ ĐÚNG KHÔNG? TAO MINH ĐÂY! MINH ỐM ĐÂY!"","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Trần Long"],"image_prompt":"[Tiểu Minh Tử] springing to his feet amid a sea of kneeling servants, pointing an accusing finger straight at [Trần Long] and shouting, veins in neck; [Trần Long] in yellow dragon robe far ahead, mid-step. Dramatic low angle, comedic.","video_prompt":"[Tiểu Minh Tử] bolts upright and thrusts his pointing finger forward; heads in the background whip around; camera pushes in on his shouting face."},{"scene_id":16,"original_text":"Cả sân im phăng phắc.\nTất cả mọi ánh mắt đổ dồn về phía tôi. Tên thái giám bên cạnh mặt cắt không còn giọt máu, run như cầy sấy.\nHoàng Thượng - à không, Trần Long - đang đi cũng khựng lại. Hắn nheo mắt nhìn tôi, từ đầu đến chân, rồi nhìn chằm chằm vào mặt tôi.\nKhông khí căng thẳng đến mức tôi có thể nghe thấy tiếng tim mình đập thình thịch. Xong rồi, phen này là tru di cửu tộc chứ chẳng chơi. Dám chỉ mặt gọi tên húy của Hoàng Thượng, tội này chém đầu 10 lần không hết.","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Trần Long","Tên Thái Giám"],"image_prompt":"Tense standoff in the silent courtyard: hundreds of kneeling servants staring; [Tên Thái Giám] trembling and pale on the ground; [Trần Long] halted mid-stride squinting at [Tiểu Minh Tử], who stands frozen and sweating. Heavy still atmosphere, shafts of sun.","video_prompt":"Total stillness; slow push-in on [Trần Long] squinting, then cut to a sweat bead rolling down [Tiểu Minh Tử]'s temple as [Tên Thái Giám] shakes."},{"scene_id":17,"original_text":"Nhưng rồi, một điều không ai ngờ tới đã xảy ra.\nHoàng Thượng Trần Long sau một hồi nhìn tôi, bỗng nhiên... trợn mắt, há hốc mồm, rồi cũng chỉ tay vào tôi hét lên, giọng cũng không còn chút uy nghiêm nào:\n"ĐỊT MẸ! THẰNG MINH ỐM! SAO MÀY Ở ĐÂY? MÀY CHƯA CHẾT À?"\nLần này thì đến lượt cả hoàng cung sốc tập 2.\nThái giám tổng quản đứng bên cạnh Hoàng Thượng suýt nữa thì rớt luôn cái phất trần xuống đất.","emotion":"","emotion_tag":"","characters_in_scene":["Trần Long","Tiểu Minh Tử"],"image_prompt":"[Trần Long], mouth agape and eyes bulging, pointing right back at [Tiểu Minh Tử], all imperial dignity gone; behind him a chief eunuch fumbles and nearly drops his whisk; courtiers stare in shock. Bright courtyard, comedic double-take.","video_prompt":"Quick double-take: [Trần Long]'s eyes widen and his jaw drops, then he jabs a finger forward; the chief eunuch behind him juggles his whisk."},{"scene_id":18,"original_text":"Tôi mừng như bắt được vàng, nước mắt nước mũi giàn giụa: "Long chó! Đúng là mày rồi! Tao chết rồi! Tao té cống chết rồi mới xuyên không tới đây nè! Mày làm Hoàng Thượng hồi nào vậy?"\nTrần Long lập tức bỏ luôn đoàn tùy tùng, chạy như bay tới chỗ tôi, nắm lấy vai tôi lắc lắc:\n"Tao cũng chết mà! Tao bị xe tông! Tao xuyên qua đây được 3 năm rồi! Má nó, tao tưởng không bao giờ gặp lại người quen!"\nHai thằng bạn thân, một thằng hoàng đế, một thằng thái giám dỏm sắp bị cắt, ôm nhau khóc rống giữa sân cung điện, trước mặt hàng trăm thái giám cung nữ đang quỳ.\nTên thái giám định lôi tôi đi tịnh thân lúc nãy giờ đã quỳ mọp xuống đất, lẩm bẩm: "Xong rồi... xong rồi... mình sắp bị chém đầu rồi..."","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Trần Long","Tên Thái Giám"],"image_prompt":"[Trần Long] in imperial yellow and [Tiểu Minh Tử] in a patched grey tunic hugging each other and sobbing loudly in the middle of the courtyard; hundreds of servants kneeling around; [Tên Thái Giám] prostrate on the ground muttering in terror. Warm daylight, comedic tearful reunion.","video_prompt":"Orbiting shot around the two crying friends hugging and shaking each other; in the background [Tên Thái Giám] trembles with his forehead pressed to the ground."},{"scene_id":19,"original_text":"Hoàng Thượng Long sau khi khóc xong, lau nước mũi bằng tay áo long bào, đứng dậy, ho khan một tiếng để lấy lại uy nghiêm, rồi dõng dạc tuyên bố:\n"Người đâu! Truyền khẩu dụ của trẫm! Tiểu Minh Tử này là... là... là anh em kết nghĩa thất lạc nhiều năm của trẫm! Từ nay nó là thái giám thân cận, ngự tiền thái giám! Ai dám động đến một cọng lông của nó, trẫm chém!"\nRồi hắn quay sang tôi, ghé tai nói nhỏ, giọng gian xảo:\n"Yên tâm, mày không phải cắt nữa. Tao bảo kê. Lát vào phòng tao kể chuyện trái đất cho tao nghe. Ở cái chỗ này 3 năm tao chán muốn chết rồi, không có wifi, không có Liên Quân!"","emotion":"","emotion_tag":"","characters_in_scene":["Trần Long","Tiểu Minh Tử"],"image_prompt":"[Trần Long] wiping his nose on his dragon-robe sleeve, then standing tall and making a grand decree with a raised hand before the kneeling crowd; next, whispering slyly into [Tiểu Minh Tử]'s ear. Sunny courtyard, comedic majesty.","video_prompt":"[Trần Long] coughs, straightens, and raises one hand in decree; then leans in to whisper into [Tiểu Minh Tử]'s ear, who grins."},{"scene_id":20,"original_text":"Tôi ôm chầm lấy nó: "Đội ơn Hoàng Thượng! Hoàng Thượng vạn tuế!"\nTrong lòng tôi thầm nghĩ: Haha, xuyên không thế này mới đã chứ! Có thằng bạn thân làm Hoàng Thượng chống lưng, từ nay trong cái cung này, tôi chính là trùm!\nNhưng tôi đã lầm. Lầm to.\nVì ngay lúc đó, một giọng nói lanh lảnh, đanh đá vang lên từ phía sau đoàn người:\n"Hoàng Thượng! Người lại ham chơi rồi! Thái Hậu nương nương đang đợi người ở Từ Ninh Cung để bàn chuyện tuyển tú nữ đấy ạ!"\nMột bà cô già, mặt đầy phấn, trông như tú bà, đang chống nhả đứng nhìn chúng tôi.\nTrần Long nghe thấy hai chữ "Thái Hậu" thì mặt tái mét, run rẩy nói nhỏ với tôi:\n"Chết mẹ rồi Minh ơi... con mụ la sát đó tới rồi. Mày phải cứu tao..."","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Trần Long","Quế Ma Ma"],"image_prompt":"[Tiểu Minh Tử] hugging [Trần Long] with a smug triumphant grin; behind the procession [Quế Ma Ma], heavily powdered with rouge, stands with hands on hips glaring; [Trần Long]'s face turning pale green as he whispers in fear. Comedic mood shift.","video_prompt":"Smug hug shifts as a sharp shout arrives; [Quế Ma Ma] appears in the background, hands on hips; [Trần Long]'s smile fades and he trembles."},{"scene_id":21,"original_text":"Tôi chưa bao giờ thấy thằng bạn thân chí cốt Trần Long của mình sợ một ai đến mức mặt xanh như đít nhái như vậy.\nỞ xóm tôi ngày xưa, nó là trùm. Đánh nhau với chó, chửi nhau với bà bán cá, cúp học đi bắn bi, không ngán bố con thằng nào. Vậy mà bây giờ, chỉ nghe hai chữ "Thái Hậu" thôi, vị Hoàng Thượng cửu ngũ chí tôn, người vừa hô một tiếng chém cả nhà tôi, đã run như cầy sấy, túm chặt tay áo rách của tôi như đứa trẻ sắp bị mẹ đánh đòn.","emotion":"","emotion_tag":"","characters_in_scene":["Trần Long","Tiểu Minh Tử"],"image_prompt":"[Trần Long], face green with fear, clinging tightly to the ragged sleeve of [Tiểu Minh Tử] like a child about to be spanked; [Tiểu Minh Tử] looking at him in astonishment. Courtyard, comedic contrast of yellow dragon robe and grey rags.","video_prompt":"[Trần Long] trembles and grabs harder at [Tiểu Minh Tử]'s sleeve; [Tiểu Minh Tử] looks down at his hand, then up at his friend's green face."},{"scene_id":22,"original_text":""Thái Hậu là ai mà mày sợ như sợ chó dại vậy Long?" Tôi thì thầm.\n"Mẹ tao! À không, mẹ của cái thân xác này! Là mẹ ruột của Hoàng Thượng thật! Bà ấy là trùm cuối! Là final boss!" Long mếu máo. "Mày không biết đâu Minh ơi, 3 năm qua tao sống không bằng con chó trong cung này cũng vì bả!"","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Trần Long"],"image_prompt":"Two-shot whispering: [Tiểu Minh Tử] leaning in with a puzzled look, [Trần Long] on the verge of tears, lower lip trembling, eyes darting fearfully around. Palace courtyard, shallow depth of field.","video_prompt":"Close two-shot; [Trần Long] whispers frantically with a quivering lip while [Tiểu Minh Tử] listens, eyebrows rising."},{"scene_id":23,"original_text":"Chưa kịp để tôi hỏi thêm, bà cô già phấn son lòe loẹt kia đã lướt tới. Tôi nói lướt là vì bà ta đi rất nhanh, dù chân bó gót sen mà tốc độ bàn thờ.\nBà ta chính là Quế Ma Ma, tổng quản ma ma thân cận của Thái Hậu. Nghe nói võ công thâm hậu, một tay bóp nát 10 quả trứng cút.\nQuế Ma Ma liếc tôi từ đầu đến chân bằng ánh mắt khinh bỉ như nhìn một con gián, rồi quay sang Hoàng Thượng, lập tức đổi giọng ngọt xớt:","emotion":"","emotion_tag":"","characters_in_scene":["Quế Ma Ma","Tiểu Minh Tử","Trần Long"],"image_prompt":"[Quế Ma Ma] gliding rapidly across the flagstones with tiny bound-foot steps, whisk in hand, looking down on [Tiểu Minh Tử] with contempt as if he were a cockroach, then turning a sugary smile toward [Trần Long]. Comedic exaggerated speed lines.","video_prompt":"[Quế Ma Ma] glides in unnaturally fast, halts, sweeps a disdainful gaze over [Tiểu Minh Tử], then swivels to [Trần Long] with a sweet smile."},{"scene_id":24,"original_text":""Ôi Hoàng Thượng của lão nô, người làm lão nô tìm muốn chết. Thái Hậu nương nương đang nổi trận lôi đình ở Từ Ninh Cung rồi ạ. Người đã 23 tuổi rồi mà hậu cung không có nổi một mụn con, long thể của người thì ngày càng..."\nBà ta liếc Long một cái đầy ẩn ý.\n"...ngày càng gầy gò vì chơi bời với mấy đứa thái giám mới vào cung không rõ lai lịch."\nBà ta cố tình nhấn mạnh chữ "không rõ lai lịch" và lườm tôi.","emotion":"","emotion_tag":"","characters_in_scene":["Quế Ma Ma","Trần Long","Tiểu Minh Tử"],"image_prompt":"[Quế Ma Ma] fawning at [Trần Long] with a saccharine smile, then shooting a pointed sidelong glare at [Tiểu Minh Tử]; [Trần Long] shrinking. Bright courtyard, tense-comic.","video_prompt":"[Quế Ma Ma] speaks in a sugary manner, her eyes slide slowly to [Tiểu Minh Tử] and narrow; [Trần Long] gulps."},{"scene_id":25,"original_text":"Long lập tức ưỡn ngực, ho khan: "Khụ! Ma Ma nói gì vậy! Đây là Tiểu Minh Tử, là... là đệ đệ kết nghĩa cùng cha khác ông nội của trẫm! Trẫm vừa nhận lại! Tình huynh đệ cảm động trời đất!"\nTôi đứng bên cạnh gật đầu lia lịa như gà mổ thóc: "Dạ đúng ạ! Cùng cha khác ông nội ạ!"\nQuế Ma Ma nhíu mày: "Cùng cha khác ông nội là sao?"\nTôi và Long nhìn nhau. Chết mẹ, hớ rồi.\nLong chữa cháy cực nhanh: "Ý trẫm là... tình cảm như ruột thịt! Thôi được rồi, trẫm sẽ qua Từ Ninh Cung ngay! Tiểu Minh Tử, đi theo hầu hạ trẫm!"","emotion":"","emotion_tag":"","characters_in_scene":["Trần Long","Tiểu Minh Tử","Quế Ma Ma"],"image_prompt":"[Trần Long] puffing out his chest making a grand declaration; [Tiểu Minh Tử] nodding rapidly like a pecking chicken; [Quế Ma Ma] frowning in confusion; then the two friends exchanging a panicked glance. Comedic beat.","video_prompt":"[Tiểu Minh Tử] nods like a pecking chicken; [Quế Ma Ma]'s brow furrows; the two friends freeze and swap a panicked look, then [Trần Long] waves his hand to recover."},{"scene_id":26,"original_text":"Và thế là tôi, một thái giám dỏm chưa qua đào tạo, chưa biết quỳ lạy, chưa biết pha trà rót nước, được đặc cách đi theo Hoàng Thượng đến gặp trùm cuối.\nTừ Ninh Cung.\nĐúng như tên gọi, cung này trông rất "từ" và rất "ninh", nhưng người ở trong thì không hề từ và không hề ninh chút nào.","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Trần Long"],"image_prompt":"[Tiểu Minh Tử] trotting nervously behind [Trần Long] toward the grand red-and-gold facade of Từ Ninh Cung with a plaque above its gate; palace guards and lanterns flanking. Majestic architecture, ominous-comic tone.","video_prompt":"Tracking shot from behind the two walking up the palace steps; the doors loom ahead and a gust of wind rustles the lanterns."},{"scene_id":27,"original_text":"Vừa bước vào cửa, tôi đã thấy một người phụ nữ trung niên, trông chỉ tầm 40 tuổi, da trắng, mắt phượng, mặc phượng bào đỏ rực đang ngồi trên sập, tay cầm tách trà, mặt lạnh như tiền. Đẹp thì có đẹp, nhưng đẹp kiểu "tôi sẽ cho anh ra bã nếu anh làm tôi phật ý".\nĐây chắc chắn là Thái Hậu.\nBên dưới, có khoảng hai chục cô gái trẻ, ai nấy đều xinh như hoa, mặc váy áo thướt tha đủ màu sắc, đang quỳ thành hai hàng. Ai cũng cúi gằm mặt, run rẩy.\nÀ, tôi hiểu rồi. Đây là buổi tuyển tú nữ trong truyền thuyết!","emotion":"","emotion_tag":"","characters_in_scene":["Thái Hậu","Tiểu Minh Tử"],"image_prompt":"Opulent throne hall: [Thái Hậu] in a blazing crimson phoenix robe seated on a couch holding a teacup, icy expression, phoenix eyes; two rows of about twenty young women in colorful gowns kneeling with lowered heads; [Tiểu Minh Tử] at the doorway gaping. Rich red-gold palette.","video_prompt":"Slow reveal from the doorway pushing into [Thái Hậu] sipping tea with an icy stare; kneeling girls tremble slightly; [Tiểu Minh Tử] swallows."},{"scene_id":28,"original_text":""Hoàng nhi đến rồi đấy à?" Thái Hậu cất giọng, không lớn nhưng đủ khiến cả phòng im re. "Con xem,哀家 đã đích thân lựa cho con 20 tú nữ đẹp nhất Đại Ngụy. Đứa nào cũng mông to, hông nở, dễ sinh đẻ. Con chọn lấy 5-6 đứa về mà... mà cày cuốc cho哀家 có cháu bế."\nLong vừa nghe đến đây đã suýt sặc nước bọt.","emotion":"","emotion_tag":"","characters_in_scene":["Thái Hậu","Trần Long"],"image_prompt":"[Thái Hậu] seated regally sweeping an arm toward the line of kneeling maidens; [Trần Long] choking on his own saliva, eyes bulging and hand at his throat. Throne hall, comedic reaction.","video_prompt":"[Thái Hậu] gestures across the row of maidens; [Trần Long] jerks and coughs, clutching his chest."},{"scene_id":29,"original_text":""Mẫu... mẫu hậu, nhi thần... nhi thần dạo này long thể bất an, thận hơi yếu..."\n"Yếu?" Thái Hậu đập bàn cái RẦM. "Yếu là vì con ngày nào cũng thức khuya chơi cờ với thái giám!哀家 đã nói bao nhiêu lần rồi, phải điều độ! Bây giờ chọn ngay cho哀家!"\nLong quay sang nhìn tôi cầu cứu, ánh mắt như muốn nói: "Cứu tao, Minh ơi, tao FA 3 năm trong cung rồi nhưng tao không muốn lấy 20 đứa một lúc!"","emotion":"","emotion_tag":"","characters_in_scene":["Trần Long","Thái Hậu","Tiểu Minh Tử"],"image_prompt":"[Thái Hậu] slamming her palm on a low table with teacups jumping, glaring; [Trần Long] cowering and turning imploring puppy eyes toward [Tiểu Minh Tử]. Comedic tension.","video_prompt":"Table slam makes teacups jump; [Trần Long] flinches and slowly turns pleading eyes toward [Tiểu Minh Tử]."},{"scene_id":30,"original_text":"Tôi với tư cách là ngự tiền thái giám thân cận, kiêm quân sư quạt mo, lập tức hiểu ý. Đây là lúc để thể hiện tài năng IT, à nhầm, tài năng tấu hài của mình.\nTôi bước lên một bước, ưỡn cái ngực lép xẹp của thân xác 16 tuổi ra, giọng the thé hô to:\n"Khởi bẩm Thái Hậu nương nương! Nô tài có một sáng kiến!"\nThái Hậu nheo mắt nhìn tôi: "Ngươi là cái đứa... cùng cha khác ông nội đó hả?"\n"Dạ chính là nô tài!" Tôi tự hào đáp.","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Thái Hậu"],"image_prompt":"[Tiểu Minh Tử] stepping forward with a puffed-out scrawny chest and a self-important expression, one hand raised; [Thái Hậu] squinting at him from her seat with skeptical curiosity. Throne hall, comedic bravado.","video_prompt":"[Tiểu Minh Tử] takes a confident step forward puffing his chest; [Thái Hậu] narrows her eyes; slight push-in on his proud face."},{"scene_id":31,"original_text":""Nô tài thấy, việc tuyển tú không thể qua loa đại khái được ạ! Phải có quy trình! Phải có KPI! Phải có vòng loại!"\n"Cái gì mà quy pi?" Thái Hậu ngơ ngác.\n"Dạ là quy trình tuyển chọn ạ!" Tôi bắt đầu chém gió, nghề của dân IT mà. "Đầu tiên, chúng ta phải kiểm tra sức khỏe! Lỡ Hoàng Thượng yếu thận mà tú nữ cũng yếu thì sao sinh được quý tử ạ? Thứ hai, phải kiểm tra trí thông minh! Con của Hoàng Thượng sau này phải thông minh, không thể chọn người... ờm... não phẳng được! Thứ ba, quan trọng nhất, phải kiểm tra xem có hợp tuổi, hợp mệnh với Hoàng Thượng không!"","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Thái Hậu"],"image_prompt":"[Tiểu Minh Tử] gesticulating energetically while presenting an imaginary flowchart in the air with three fingers up; [Thái Hậu] leaning forward with a bewildered face. Stylized floating KPI-like chart doodles. Comedic pitch.","video_prompt":"[Tiểu Minh Tử] counts off three fingers rapidly while speaking; [Thái Hậu] tilts her head in confusion, then slowly nods."},{"scene_id":32,"original_text":"Tôi càng nói càng hăng, nước bọt văng tung tóe.\nThái Hậu có vẻ bị thuyết phục: "Nghe cũng có lý. Vậy theo ngươi thì phải làm sao?"\n"Dạ, nô tài đề xuất tổ chức cuộc thi 'Đường Lên Đỉnh Hậu Cung' ạ! Gồm 3 vòng!"\nLong đứng bên cạnh nghe mà mắt sáng rực lên như đèn pha ô tô, gật đầu lia lịa.","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Thái Hậu","Trần Long"],"image_prompt":"[Tiểu Minh Tử] mid-speech with spittle flying, arms spread wide as if announcing a grand contest; [Thái Hậu] half-convinced; [Trần Long] beside them with glowing headlight-bright eyes nodding hard. Comedic.","video_prompt":"Spit droplets glisten in the light as [Tiểu Minh Tử] speaks animatedly; [Trần Long] nods repeatedly, eyes shining."},{"scene_id":33,"original_text":"Tôi tiếp tục: "Vòng 1: Thi thể lực! Ai làm được 20 cái squat thì qua vòng!"\n20 cô tú nữ ngơ ngác nhìn nhau. Squat là cái gì?\n"Vòng 2: Thi trí tuệ! Giải câu đố! Ví dụ như: Con gì đập thì sống, không đập thì chết?"\nThái Hậu suy nghĩ: "Con... con tim?"\n"Dạ sai rồi ạ! Là con tim của Hoàng Thượng khi gặp Thái Hậu ạ!" Tôi nịnh nọt.\nThái Hậu được nịnh thì bật cười khúc khích, che miệng.","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Thái Hậu"],"image_prompt":"Twenty puzzled young maidens exchanging blank looks in two rows; [Tiểu Minh Tử] bowing with an oily flattering smile; [Thái Hậu] giggling coyly behind her sleeve. Throne hall, cheerful-comic.","video_prompt":"Maidens glance at each other in confusion; [Tiểu Minh Tử] bows with a fawning grin; [Thái Hậu] lifts a sleeve to hide her giggle."},{"scene_id":34,"original_text":""Vòng 3: Vòng chung kết! Hoàng Thượng sẽ... sẽ ngửi mùi!"\n"Ngửi mùi?" Cả cung điện đồng thanh hét lên.\n"Dạ đúng ạ!" Tôi nghiêm túc giải thích. "Theo khoa học hiện đại, à nhầm, theo y thuật cổ truyền, mùi hương cơ thể hợp nhau thì mới dễ sinh con! Hoàng Thượng phải chọn người có mùi mà người thích nhất!"\nThực ra tôi bịa đại để câu giờ cho thằng Long thôi. Chứ tuyển tú kiểu này thì đến mai cũng chưa xong.\nThái Hậu gật gù: "Thằng nhóc này tuy nhìn ngu nhưng nói cũng có chút đạo lý. Được, 哀家 chuẩn y! Quế Ma Ma, cho bắt đầu vòng 1!"","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Thái Hậu","Quế Ma Ma"],"image_prompt":"The whole court reacting in a shocked chorus with open mouths; [Tiểu Minh Tử] with a straight serious face and secret nervous sweat drop; [Thái Hậu] nodding approvingly and waving a hand toward [Quế Ma Ma], who bows. Comedic.","video_prompt":"Court members gasp in unison; [Tiểu Minh Tử] keeps a serious face with a sweat drop sliding; [Thái Hậu] nods and flicks a hand to [Quế Ma Ma]."},{"scene_id":35,"original_text":"Quế Ma Ma hô to: "Tất cả tú nữ, đứng dậy, chuẩn bị... ngồi xổm!"\n20 cô gái lúng túng đứng dậy, bắt đầu ngồi xổm lên ngồi xổm xuống. Cảnh tượng trông vừa buồn cười vừa... hơi gợi cảm.\nTrần Long đứng bên cạnh tôi, hai mắt dán chặt vào các tú nữ, nước dãi suýt chảy ra, lẩm bẩm: "Vòng 1 này... chất lượng đấy..."\nTôi huých nó một cái: "Ê, mày là Hoàng Thượng đấy, giữ giá tí đi! Nước dãi chảy ướt cả long bào rồi kìa!"\nLong vội lau miệng.","emotion":"","emotion_tag":"","characters_in_scene":["Quế Ma Ma","Trần Long","Tiểu Minh Tử"],"image_prompt":"Twenty maidens in colorful gowns awkwardly doing squats in the throne hall; [Quế Ma Ma] directing with a whisk; [Trần Long] staring dreamy-eyed with drool at the corner of his mouth while [Tiểu Minh Tử] nudges him with an elbow. Family-friendly comedic tone.","video_prompt":"Maidens bob up and down in awkward squats; [Trần Long] drools and stares until [Tiểu Minh Tử] elbows him and he hurriedly wipes his mouth."},{"scene_id":36,"original_text":"Sau khi 20 cô tú nữ squat xong, ai nấy đều thở hồng hộc, mặt đỏ bừng, mồ hôi nhễ nhại.\nTôi bước ra, đóng vai giám khảo khó tính:\n"Tốt! Rất tốt! Tất cả đều qua vòng 1! Bây giờ là vòng 2! Câu hỏi: Trên đời này, cái gì của Thái Hậu nương nương là to nhất?"\nCả phòng lại im lặng. Câu này mà trả lời sai là mất đầu như chơi.\nMột cô tú nữ bạo dạn nhất run rẩy giơ tay: "Dạ... dạ là... là tấm lòng ạ? Tấm lòng của Thái Hậu là to nhất ạ?"\nTôi lắc đầu: "Sai!"\nMột cô khác: "Dạ là... là cung điện ạ? Từ Ninh Cung to nhất ạ?"\n"Sai luôn!"","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử"],"image_prompt":"Panting sweaty maidens with flushed faces; [Tiểu Minh Tử] playing a stern judge with crossed arms and a pursed mouth, shaking his head at a trembling maiden who has her hand raised timidly. Throne hall, comedic quiz-show vibe.","video_prompt":"[Tiểu Minh Tử] paces like a strict judge; a maiden trembles raising her hand; he shakes his head sharply; another hand goes up."},{"scene_id":37,"original_text":"Thái Hậu bắt đầu mất kiên nhẫn: "Rốt cuộc là cái gì? Ngươi nói luôn đi!"\nTôi cười nịnh nọt, chỉ vào Thái Hậu: "Dạ là quyền lực của Thái Hậu nương nương là to nhất ạ! Thái Hậu nói một là một, hai là hai, Hoàng Thượng cũng phải nghe lời! Quyền lực của người bao trùm cả Đại Ngụy này ạ!"\nMột cú nịnh thần sầu!\nThái Hậu nghe xong thì cười ha hả, vỗ đùi đen đét:\n"Ha ha ha! Thằng nhóc này được! Mồm mép dẻo quẹo! Rất hợp ý哀家! Thưởng! Thưởng cho nó 10 lượng bạc!"\nTôi mừng húm. 10 lượng bạc! Giàu to rồi!","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Thái Hậu"],"image_prompt":"[Tiểu Minh Tử] pointing with an obsequious grin at [Thái Hậu], who roars with laughter slapping her thigh; a pile of silver ingots glinting in his imagination bubble. Throne hall, warm comic light.","video_prompt":"[Tiểu Minh Tử] points and bows; [Thái Hậu] throws her head back laughing and slaps her thigh; sparkle effect on his excited face."},{"scene_id":38,"original_text":"Nhưng chưa kịp mừng xong, thì bi kịch xảy ra.\nCó lẽ vì squat quá hăng, lại thêm cúi người nịnh nọt quá sâu, cái quần vải thô rách nát của nguyên chủ Tiểu Minh Tử - cái quần đã được vá đi vá lại 3 đời - đã không chịu nổi nữa.\n"ROẸT!"\nMột tiếng rách vải vang lên rõ to, khô khốc, vang vọng khắp Từ Ninh Cung vốn đang yên tĩnh.\nTôi cảm thấy phía sau mông mình... mát lạnh.\nGió lùa vào.\nTôi từ từ quay đầu lại nhìn. Toàn bộ phần mông quần của tôi đã rách toạc ra, để lộ ra cái quần sịp...\nCái quần sịp hình Doraemon màu xanh mà tôi mặc từ lúc còn ở thế giới hiện đại!\nVì lúc xuyên không, linh hồn tôi mang theo cả cái sịp!","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử"],"image_prompt":"[Tiểu Minh Tử] bent forward mid-bow, glancing back over his shoulder in horror as his patched trousers have split open at the seat, exposing bright blue Doraemon-print underwear; a comic 'RIP' burst effect. Throne hall.","video_prompt":"Sharp tearing sound effect; [Tiểu Minh Tử] freezes, slowly turns his head over his shoulder with widening eyes as a breeze flutters the torn cloth."},{"scene_id":39,"original_text":"Cả Từ Ninh Cung chết lặng.\n20 tú nữ lấy tay che miệng, mắt trợn tròn.\nQuế Ma Ma chỉ tay vào mông tôi, lắp bắp: "Yêu... yêu quái! Quần lót yêu quái!"\nThái Hậu cũng sững sờ, nhìn chằm chằm vào hình Doraemon đang cười toe toét trên mông tôi.\nTrần Long - Hoàng Thượng - sau 3 giây im lặng, bỗng nhiên ôm bụng cười như điên dại, cười đến mức ngã lăn ra sập, long bào xộc xệch:\n"HA HA HA HA! DORAEMON! MÀY VẪN MẶC CÁI SỊP RÁCH ĐÓ HẢ MINH! HA HA HA! CÁI SỊP MÀY MUA Ở CHỢ SINH VIÊN 20 NGHÌN 3 CÁI!"","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Quế Ma Ma","Thái Hậu","Trần Long"],"image_prompt":"Frozen throne hall: maidens covering mouths with wide eyes; [Quế Ma Ma] pointing with a trembling finger; [Thái Hậu] staring stunned; [Trần Long] rolling off the couch in hysterical laughter, robe disheveled; [Tiểu Minh Tử] centered in the panic. Comedic chaos.","video_prompt":"Silence, then [Trần Long] collapses in explosive laughter rolling on the couch; [Quế Ma Ma]'s finger shakes; [Thái Hậu] stays stunned."},{"scene_id":40,"original_text":"Tiếng cười của Hoàng Thượng đã phá vỡ bầu không khí. 20 tú nữ không nhịn được cũng cười khúc khích.\nChỉ có tôi là muốn độn thổ xuống đất.\nTôi vội lấy hai tay che mông, mặt đỏ như gấc, hét lên:\n"Nhìn cái gì mà nhìn! Chưa thấy Doraemon bao giờ à! Đây là hàng limited edition đấy!"","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Trần Long"],"image_prompt":"[Tiểu Minh Tử] with a beet-red face covering his backside with both hands, yelling defensively; giggling maidens behind him and [Trần Long] still wheezing with laughter. Comedic embarrassment, warm light.","video_prompt":"[Tiểu Minh Tử] spins and clamps his hands over his backside, face flushing red; the maidens' giggles ripple behind him."},{"scene_id":41,"original_text":"Thái Hậu sau khi hết sốc, bỗng nhiên phán một câu xanh rờn:\n"Im lặng! Tất cả im lặng! Tiểu Minh Tử,哀家 hỏi ngươi, cái hình con mèo xanh ú ú trên mông ngươi là thần thú phương nào? Sao哀家 chưa thấy bao giờ? Có phải là linh vật giúp sinh con trai không?"\nTôi và Long nhìn nhau.\nLong nhanh trí, lập tức bật dậy, nghiêm mặt nói:\n"Mẫu hậu anh minh! Đúng vậy ạ! Đây chính là Thần Thú Doraemon! Là thần thú may mắn từ quê hương của trẫm và Tiểu Minh Tử! Ai nhìn thấy nó sẽ... sẽ sinh được 8 đứa con trai!"","emotion":"","emotion_tag":"","characters_in_scene":["Thái Hậu","Tiểu Minh Tử","Trần Long"],"image_prompt":"[Thái Hậu] leaning forward with intense curiosity, pointing at the blue cat print; [Tiểu Minh Tử] and [Trần Long] exchanging a quick scheming glance, then [Trần Long] jumping up with a solemn straight face. Throne hall.","video_prompt":"[Thái Hậu] leans in, eyes gleaming; the two friends swap a glance; [Trần Long] leaps up and delivers his solemn lie with a raised finger."},{"scene_id":42,"original_text":"Thái Hậu nghe thấy "8 đứa con trai" thì hai mắt sáng rực lên như đèn ô tô.\n"Thật sao? Thần kỳ vậy sao? Vậy... vậy mau cho哀家 mượn cái quần đó... à không, cho 哀家 mượn thần thú đó để thờ!"\nTôi ôm chặt mông: "Không được ạ! Thần thú này... thần thú này chỉ nhận một chủ thôi ạ! Ai giật ra là nó cắn đứt tay đấy ạ!"\nTừ Ninh Cung hôm đó náo loạn vì một cái sịp Doraemon.\nCuối cùng, buổi tuyển tú bị hoãn lại vô thời hạn vì Thái Hậu bận cho người đi vẽ lại hình Doraemon để thêu lên gối cho Hoàng Thượng.\nCòn tôi, được Hoàng Thượng ban cho một cái quần mới, bằng lụa hẳn hoi, và một chức danh mới toanh: "Ngự Tiền Tấu Hài Thái Giám" - chuyên phụ trách làm cho Thái Hậu và Hoàng Thượng vui.","emotion":"","emotion_tag":"","characters_in_scene":["Thái Hậu","Tiểu Minh Tử","Trần Long"],"image_prompt":"[Thái Hậu] with eyes glowing like headlights reaching eagerly toward [Tiểu Minh Tử], who clutches his backside and backs away in panic; a court painter in the background sketching a blue cat; [Trần Long] smirking. Comedic chaos.","video_prompt":"[Thái Hậu] lunges with shining eyes; [Tiểu Minh Tử] backpedals shielding his rear; a painter scribbles in the background."},{"scene_id":43,"original_text":"Đêm đó, trong tẩm cung của Hoàng Thượng, hai thằng bạn thân ngồi ăn gà quay do Ngự Thiện Phòng lén mang lên, vừa ăn vừa tâm sự.\n"Mày sướng rồi Minh ơi, mày có sịp Doraemon bảo kê." Long vừa gặm đùi gà vừa nói.\n"Còn mày thì sao? 20 em tú nữ xinh như mộng, sao mày không chọn đại một em đi?"\nLong thở dài thườn thượt, nhìn ra ánh trăng:\n"Chọn thế chó nào được. Mày không biết đâu, trong số 20 đứa đó, có 3 đứa là gián điệp của Thái Hậu, 5 đứa là con gái của các đại thần, lấy về là bị các phe phái lôi kéo. Còn lại 12 đứa thì... thì đứa nào cũng hôi nách!"","emotion":"","emotion_tag":"","characters_in_scene":["Trần Long","Tiểu Minh Tử"],"image_prompt":"Night in the emperor's bedchamber: [Trần Long] and [Tiểu Minh Tử] sitting cross-legged sharing a roast chicken on a low table, candlelight; [Trần Long] gnawing a drumstick and gazing wistfully at the moonlit window. Warm cozy comedic mood; [Tiểu Minh Tử] in a new silk garment (temporary: new silk trousers).","video_prompt":"Candle flicker; [Trần Long] sighs and turns toward the moon with a drumstick in hand; [Tiểu Minh Tử] leans in listening."},{"scene_id":44,"original_text":"Tôi phun luôn miếng gà ra ngoài.\n"Hôi... hôi nách á?"\n"Ừ! Ở đây người ta không có lăn khử mùi! Mùa hè nóng 40 độ, 20 đứa quỳ trong phòng kín... mày tự hiểu đi!"\nHai thằng nhìn nhau, rồi cùng thở dài.\nXuyên không, làm Hoàng Thượng hay làm thái giám dỏm, thì ra cũng không sung sướng như trong truyện.\nNhưng ít nhất, chúng tôi có nhau. Và có một cái sịp Doraemon rách.","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Trần Long"],"image_prompt":"[Tiểu Minh Tử] spitting out a mouthful of chicken in shock; [Trần Long] shrugging with a helpless expression; then both sighing side by side, framed by moonlit window and torn Doraemon underwear pinned as a trophy. Cozy comedic night.","video_prompt":"Chicken bits fly from [Tiểu Minh Tử]'s mouth; [Trần Long] shrugs; both sigh in sync and slump; moonlight drifts slowly."},{"scene_id":45,"original_text":""Ê Minh," Long đột nhiên hỏi, "cái phòng Tịnh Sự... mày chưa đi đúng không?"\nTôi gật đầu.\n"Tốt. Từ mai, mày chính thức là thái giám duy nhất trong lịch sử Đại Ngụy còn... còn nguyên tem. Nhớ giữ gìn cho cẩn thận, đừng để Quế Ma Ma phát hiện, bả mà biết là bả cắt thật đấy!"\nTôi rùng mình, vội kéo quần lại.","emotion":"","emotion_tag":"","characters_in_scene":["Trần Long","Tiểu Minh Tử","Quế Ma Ma"],"image_prompt":"[Trần Long] leaning in with a serious warning finger, [Tiểu Minh Tử] shivering and tugging up his silk trousers with a nervous gulp. Candlelit bedchamber, comedic.","video_prompt":"[Trần Long] wags a finger in warning; [Tiểu Minh Tử] shivers all over and hastily hitches up his trousers."},{"scene_id":46,"original_text":"Đêm đó, tôi ngủ trong tẩm cung của Hoàng Thượng, trên một chiếc ghế trường kỷ. Giấc ngủ đầu tiên ở thế giới mới.\nVà tôi mơ thấy con mèo Mỡ. Nó đang mặc long bào, ngồi trên ngai vàng, chỉ tay vào tôi và nói: "Sen kia! Mau gãi bụng cho trẫm!"\nMẹ kiếp, ám ảnh thật sự.","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Mỡ"],"image_prompt":"Dream sequence: [Tiểu Minh Tử] asleep on a long couch with a furrowed brow, beside a swirling dream bubble showing [Mỡ] in a tiny yellow dragon robe sitting on a golden throne, imperiously pointing at him. Soft moonlight, surreal comedy.","video_prompt":"[Tiểu Minh Tử] tosses in his sleep; the dream bubble pulses as [Mỡ] on the throne jabs a paw and commands; he twitches."},{"scene_id":47,"original_text":"Sáng sớm ngày thứ 4 làm thái giám, tôi đã hiểu thế nào là câu nói "đời không như là mơ".\nTôi đang ngủ ngon lành trên cái ghế trường kỷ trong tẩm cung của Hoàng Thượng, mơ thấy mình đang ngồi net đánh Liên Minh, thì bị một gáo nước lạnh dội thẳng vào mặt.\n"Á Á Á! LỤT! LỤT RỒI!"","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử"],"image_prompt":"[Tiểu Minh Tử] jolted awake on the couch as a splash of cold water hits his face, arms flailing, water droplets frozen mid-air, dawn light through window. Comedic slapstick.","video_prompt":"Water splash hits [Tiểu Minh Tử]'s face; he bolts up with flailing arms, droplets flying."},{"scene_id":48,"original_text":"Tôi bật dậy, ướt như chuột lột. Trước mặt tôi là Quế Ma Ma, tay cầm cái gáo dừa, mặt lạnh như tiền.\n"Dậy! Dậy mau! Mặt trời lên tới mông rồi mà còn ngủ! Ngươi tưởng ngươi là Hoàng Thượng thật đấy à? Hoàng Thượng còn phải dậy từ canh 5 để thiết triều, ngươi là cái thá gì mà ngủ đến giờ Thìn!"\nTôi vuốt nước trên mặt, ngơ ngác: "Ma Ma... mới sáng sớm..."\n"Sáng sớm cái gì! Hôm nay là ngày 15! Ngày tổng kiểm tra!"\n"Tổng kiểm tra cái gì ạ?"","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Quế Ma Ma"],"image_prompt":"[Tiểu Minh Tử] drenched like a wet rat wiping water from his face; [Quế Ma Ma] standing over him holding an empty coconut ladle with an icy expression. Bedchamber, morning light.","video_prompt":"Water drips from [Tiểu Minh Tử]'s hair as he wipes his face; [Quế Ma Ma] leans in scolding, ladle in hand."},{"scene_id":49,"original_text":"Quế Ma Ma cười nham hiểm, nụ cười khiến tôi rợn tóc gáy:\n"Kiểm tra thái giám! Mỗi tháng một lần! Để xem có đứa nào... mọc lại cái không nên mọc không!"\nTôi điếng người. Mọc lại? Mọc lại cái gì? À... tôi hiểu rồi!\nLà kiểm tra xem thái giám đã tịnh thân sạch sẽ chưa!\nMẹ ơi! Cái thân xác Tiểu Minh Tử này thì chưa cắt, còn tôi thì... còn nguyên đai nguyên kiện! Lộ ra là chết chắc!","emotion":"","emotion_tag":"","characters_in_scene":["Quế Ma Ma","Tiểu Minh Tử"],"image_prompt":"[Quế Ma Ma] with a sinister smirk looming close; [Tiểu Minh Tử] petrified, hair standing on end, eyes huge, cold sweat drops. Dramatic close-up lighting, comedic dread.","video_prompt":"Slow push-in on [Quế Ma Ma]'s wicked smile; [Tiểu Minh Tử]'s hair stands on end and his pupils shrink."},{"scene_id":50,"original_text":"Tôi quay ngoắt sang nhìn Long. Long - Hoàng Thượng - đang ngồi trên giường, tóc tai bù xù, vừa ngáp vừa gãi bụng, trông chẳng có tí uy nghiêm nào. Thấy ánh mắt cầu cứu của tôi, nó cũng giật mình.\n"Ma Ma! Khoan đã!" Long hét lên. "Tiểu Minh Tử là người của trẫm! Là ngự tiền thái giám! Không cần kiểm tra!"\nQuế Ma Ma liếc Long: "Hoàng Thượng, đây là quy củ tổ tông để lại mấy trăm năm nay rồi ạ. Ngay cả thái giám thân cận của Thái Hậu cũng phải kiểm tra. Không thể vì một chút tư tình mà phá lệ được. Lỡ có đứa nào giả mạo thái giám trà trộn vào hậu cung, làm ô uế long mạch thì sao ạ?"","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Trần Long","Quế Ma Ma"],"image_prompt":"[Trần Long] sitting on a big bed with messy hair mid-yawn and scratching his belly, startled into protest; [Tiểu Minh Tử] turning a pleading look toward him; [Quế Ma Ma] firmly responding with a whisk in hand. Morning bedchamber.","video_prompt":"[Trần Long] freezes mid-yawn and shouts; [Quế Ma Ma] replies coolly with a lifted chin; [Tiểu Minh Tử] looks between them."},{"scene_id":51,"original_text":"Bà ta nhấn mạnh chữ "ô uế long mạch" và nhìn thẳng vào đũng quần tôi.\nLong cứng họng. Quy củ tổ tông thì ngay cả Hoàng Thượng cũng không dám cãi, nhất là khi tổ tông đó lại chính là mẹ mình.\n"Nhưng... nhưng mà..." Long lắp bắp.\n"Không nhưng nhị gì hết! Giờ Tỵ, tất cả thái giám tập trung ở sân Tịnh Sự Phòng! Ai vắng mặt, cắt... à nhầm, đánh 50 trượng!" Quế Ma Ma tuyên bố rồi quay gót bỏ đi, để lại một mùi phấn thơm nồng nặc.","emotion":"","emotion_tag":"","characters_in_scene":["Quế Ma Ma","Trần Long","Tiểu Minh Tử"],"image_prompt":"[Quế Ma Ma] making a decree, then turning on her heel to leave with a cloud of pink perfumed powder trailing behind; [Trần Long] tongue-tied with a stuttering face; [Tiểu Minh Tử] stiffened. Bedchamber doorway, comedic.","video_prompt":"[Quế Ma Ma] snaps around and strides out, powder cloud billowing; [Trần Long] stammers with a raised finger; door swings."},{"scene_id":52,"original_text":"Cánh cửa vừa đóng lại, tôi đã quỳ sụp xuống ôm chân Long:\n"Long ơi cứu tao! Lần này tao chết thật rồi! Bả mà kiểm tra tao là tao lộ ngay! Tao còn zin nguyên tem nguyên kiện!"\nLong cũng hoảng không kém, chạy vòng vòng trong phòng:\n"Để tao nghĩ! Để tao nghĩ! Hay là mày giả vờ đau bụng? Tiêu chảy?"\n"Tiêu chảy thì người ta cũng bắt vạch ra kiểm tra thôi! Bả có tha đâu!"\n"Hay là... mày chặt một con chuột, bỏ vào quần giả làm..."\n"Mày điên à! Chuột thì liên quan gì!"","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Trần Long"],"image_prompt":"[Tiểu Minh Tử] kneeling and hugging [Trần Long]'s leg begging; [Trần Long] panicking, running circles around the room with hands in his hair. Bedchamber, exaggerated panic.","video_prompt":"[Tiểu Minh Tử] clings to [Trần Long]'s leg as [Trần Long] drags him around in frantic circles; both flail with arms."},{"scene_id":53,"original_text":"Hai thằng vò đầu bứt tai. Đúng lúc đó, cánh cửa tẩm cung hé mở, một cái đầu ló vào. Là một cô bé cung nữ chừng 14, 15 tuổi, mặt tròn như cái bánh bao, hai má đỏ hây hây.\n"Hoàng... Hoàng Thượng... nô tỳ mang điểm tâm sáng tới ạ..." Cô bé lí nhí nói, mắt không dám nhìn thẳng.\nĐây là Tiểu Thúy, cung nữ quét dọn cấp thấp nhất trong cung của Long. Nghe nói con bé này hơi ngốc ngốc, nhưng được cái thật thà và trung thành.","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Thúy","Tiểu Minh Tử","Trần Long"],"image_prompt":"The bedchamber door ajar with [Tiểu Thúy]'s round bun-like face peeking in shyly, rosy cheeks; inside, [Tiểu Minh Tử] and [Trần Long] pulling their own hair in despair. Soft morning light.","video_prompt":"Door creaks open slowly; [Tiểu Thúy]'s round face peeks in with a timid smile; the two friends stop mid-hair-pull and turn."},{"scene_id":54,"original_text":"Long như vớ được cọc: "Tiểu Thúy! Vào đây! Có chuyện đại sự cần bàn!"\nTiểu Thúy bưng khay cháo loạng choạng bước vào, đặt lên bàn rồi quỳ xuống.\nLong kéo tôi lại, thì thầm: "Con bé này là người duy nhất trong cái cung này không phải gián điệp của Thái Hậu hay của phe nào cả. Nó ngốc thật, nên không ai thèm mua chuộc nó."\nTôi nhìn Tiểu Thúy. Con bé đang nhìn chằm chằm vào cái quần lụa mới của tôi - cái quần mà Thái Hậu ban hôm qua.\n"Nô... nô tài thấy quần của Minh công công... đẹp quá ạ..." Tiểu Thúy nói.","emotion":"","emotion_tag":"","characters_in_scene":["Trần Long","Tiểu Thúy","Tiểu Minh Tử"],"image_prompt":"[Tiểu Thúy] wobbling in with a tray of porridge, setting it on the table and kneeling, eyes fixed on [Tiểu Minh Tử]'s new silk trousers; [Trần Long] whispering into [Tiểu Minh Tử]'s ear. Morning light.","video_prompt":"[Tiểu Thúy] wobbles with the tray and kneels; [Trần Long] pulls [Tiểu Minh Tử] aside to whisper; [Tiểu Thúy] gazes at the silk trousers."},{"scene_id":55,"original_text":"Tôi lập tức nảy ra một ý tưởng thiên tài!\n"Tiểu Thúy! Em có biết may vá không?"\n"Dạ biết ạ! Nô tỳ may vá giỏi nhất xóm nô tỳ đấy ạ! Áo rách của Hoàng Thượng toàn là nô tỳ vá lại ạ!"\nLong đỏ mặt: "Ai bảo mày nói!"\nTôi kéo Tiểu Thúy ra một góc, nói nhỏ kế hoạch của mình. Nghe xong, Tiểu Thúy tròn mắt:\n"Làm... làm vậy có được không ạ? Lỡ bị phát hiện thì..."\n"Không phát hiện được đâu! Tin anh! Anh là IT mà! Chuyên môn của anh là fake!"","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Tiểu Thúy","Trần Long"],"image_prompt":"[Tiểu Minh Tử] with a lightbulb-idea glint whispering his plan into [Tiểu Thúy]'s ear in a corner; [Tiểu Thúy] wide-eyed; [Trần Long] embarrassed in the background with red cheeks. Cozy bedchamber comedic.","video_prompt":"Lightbulb pop above [Tiểu Minh Tử]'s head; he whispers to [Tiểu Thúy], whose eyes grow round; [Trần Long] blushes behind them."},{"scene_id":56,"original_text":"Kế hoạch của tôi có tên là: "Kế Hoạch Quần Sịp 2 Lớp".\nRất đơn giản. Tôi sẽ mặc 2 cái quần. Bên trong là cái sịp Doraemon thần thánh. Bên ngoài, Tiểu Thúy sẽ may cho tôi một cái quần lót giả, trông thật nhăn nheo, phẳng lì như của thái giám thật, bằng vải độn và... hai quả vải thiều khô.\nKhi kiểm tra, tôi chỉ cần tụt quần ngoài ra, để lộ cái quần giả bên trong. Nhìn thoáng qua thì sẽ giống như đã tịnh thân rồi!\n"Nhưng mà... vải thiều khô... nó có... có giống không ạ?" Tiểu Thúy đỏ mặt hỏi.\n"Giống! Rất giống! Mày cứ tin anh!" Tôi quả quyết, dù thực ra tôi cũng chưa bao giờ nhìn thấy hàng thật của thái giám nó trông như thế nào.","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Tiểu Thúy"],"image_prompt":"Sketch-diagram style comedic scene: [Tiểu Minh Tử] confidently pointing at a chalk plan on a scroll labeled with a two-layer garment diagram; [Tiểu Thúy] blushing and holding a bowl of dried lychees. Family-friendly, no explicit content.","video_prompt":"[Tiểu Minh Tử] taps the diagram scroll confidently; [Tiểu Thúy] blushes and looks at the dried lychees in her bowl."},{"scene_id":57,"original_text":"Tiểu Thúy lập tức chạy về phòng lấy kim chỉ. 30 phút sau, một kiệt tác ra đời.\nMột cái quần lót màu trắng, ở giữa được độn một lớp bông dày, trông phẳng lì, và ở phía trước có khâu 2 quả vải thiều khô đã bóc vỏ, trông nhăn nheo, thâm sì.\nTôi mặc thử vào. Nhìn trong gương, trông... trông cũng hơi giống thật! Nếu không nhìn kỹ!\n"Tốt! Quá tốt! Tiểu Thúy em đúng là thiên tài may vá!" Tôi khen.\nTiểu Thúy được khen thì cười tít mắt: "Dạ, nô tỳ còn may thêm một cái túi nhỏ để đựng... đựng bùa may mắn nữa ạ!"\n"Bùa gì?"\nCon bé móc từ trong túi ra một củ tỏi to tướng, nhét vào bên cạnh 2 quả vải.\n"Ma Ma nói đeo tỏi thì trừ tà ạ!"\nTôi suýt ngất. Đeo tỏi vào chỗ đó thì trừ được tà nào? Chỉ có trừ được người yêu thôi!","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Thúy","Tiểu Minh Tử"],"image_prompt":"[Tiểu Thúy] proudly holding up a homemade white padded cloth garment with two dried lychees stitched on, then pulling a giant garlic bulb from her pocket with a beaming smile; [Tiểu Minh Tử] about to faint. Sewing basket, needles, bright room, comedic, family-friendly framing.","video_prompt":"[Tiểu Thúy] presents the handmade piece with a beaming grin and pulls out a huge garlic bulb; [Tiểu Minh Tử]'s knees buckle."},{"scene_id":58,"original_text":"Nhưng không còn thời gian nữa. Tiếng trống tập hợp đã vang lên.\nSân Tịnh Sự Phòng.\nKhoảng 100 thái giám đủ mọi lứa tuổi đang xếp thành 5 hàng, mặt ai cũng tái mét như sắp ra pháp trường. Ở giữa sân kê một cái ghế, Quế Ma Ma ngồi chễm chệ, bên cạnh là hai tên thái giám lực lưỡng cầm gậy.\n"Được rồi! Bắt đầu kiểm tra! Từng đứa một! Cởi ra!"\nTôi đứng cuối hàng, chân run như cầy sấy. Long đứng ở cửa cung điện xa xa, ló đầu ra nhìn, tay chắp lại cầu nguyện cho tôi.","emotion":"","emotion_tag":"","characters_in_scene":["Quế Ma Ma","Tiểu Minh Tử","Trần Long"],"image_prompt":"Stark inspection courtyard: about a hundred eunuchs in five pale-faced rows; [Quế Ma Ma] enthroned on a chair in the middle flanked by two burly eunuchs with cudgels; [Tiểu Minh Tử] at the end of the last row with knees knocking; [Trần Long] peeking far away from a palace doorway with hands clasped in prayer.","video_prompt":"Wide shot of the rows; [Quế Ma Ma] barks the order; [Tiểu Minh Tử]'s knees tremble; in the distance [Trần Long] presses his hands in prayer."},{"scene_id":59,"original_text":"Từng người một bước lên. "Cởi ra! Qua! Cởi ra! Qua!" Tiếng Quế Ma Ma vang lên đều đều.\nChẳng mấy chốc đã đến lượt tôi.\n"Tiểu Minh Tử! Lên!"\nTôi lê từng bước nặng nề như đeo chì lên. Mồ hôi túa ra như tắm.\n"Nhanh lên! Cởi ra cho哀家 xem!"\nTôi nhắm mắt, hít một hơi thật sâu, rồi tụt quần.\nCả sân im lặng 3 giây.\nSau đó...\n"PHỤT! HA HA HA HA!"\nKhông biết ai là người cười đầu tiên, nhưng sau đó cả trăm thái giám đều ôm bụng cười lăn lộn.","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Quế Ma Ma"],"image_prompt":"[Tiểu Minh Tử] walking heavy-footed to the center with a sweat-drenched face and closed eyes, while [Quế Ma Ma] waits; behind them the hundred eunuchs bursting into helpless laughter, clutching bellies and rolling on the ground. Comedic, modesty preserved by framing from behind and from the waist up.","video_prompt":"[Tiểu Minh Tử] inhales deeply and squeezes his eyes shut; a beat of silence; then the crowd behind erupts in laughter, doubling over."},{"scene_id":60,"original_text":"Quế Ma Ma nhìn chằm chằm vào "hàng họ" vải thiều + tỏi của tôi, mặt từ trắng chuyển sang đỏ, rồi từ đỏ chuyển sang tím.\n"Ngươi... ngươi... cái gì thế này? Sao lại có mùi tỏi? Và sao lại có 2 quả vải thiều ở đây?"\nTôi vội bịa chuyện, giọng run run nhưng cố tỏ ra đáng thương:\n"Dạ bẩm Ma Ma! Nô tài... nô tài từ nhỏ đã có dị tật ạ! Bẩm sinh nó đã... nó đã teo lại thành 2 quả vải khô ạ! Còn củ tỏi là... là mẹ nô tài dặn mang theo để khử mùi ạ! Vì chỗ đó... chỗ đó hay bị ngứa ạ!"\nLý do khử mùi bằng tỏi ở chỗ đó nghe vô lý hết sức, nhưng trong lúc hoảng loạn tôi chỉ nghĩ ra được có vậy.","emotion":"","emotion_tag":"","characters_in_scene":["Quế Ma Ma","Tiểu Minh Tử"],"image_prompt":"[Quế Ma Ma]'s face shifting from white to red to purple in three stacked color-tinted portraits, nostrils flaring at a garlic smell; [Tiểu Minh Tử] in front with pleading watery eyes and clasped hands, spinning an excuse. Comedic, kept non-explicit.","video_prompt":"[Quế Ma Ma]'s face color shifts to purple as she recoils from the smell; [Tiểu Minh Tử] bows repeatedly with a wobbling voice and pitiful eyes."},{"scene_id":61,"original_text":"Quế Ma Ma dí sát mặt vào nhìn. Bà ta nheo mắt, lấy đầu cây phất trần khều khều 2 quả vải thiều.\nTôi nín thở. Chỉ cần bà ta khều mạnh một cái là rớt ra ngay!\nMay sao, bà ta có vẻ sợ mùi tỏi, nên chỉ khều nhẹ một cái rồi vội rụt lại.\n"Hừ! Đúng là đồ dị hợm! Bẩm sinh đã xấu xí! Thảo nào cha mẹ mày bán mày vào cung! Được rồi! Coi như ngươi qua! Biến xuống!"\nTôi như được đại xá, vội kéo quần lên, chạy như bay xuống cuối hàng.","emotion":"","emotion_tag":"","characters_in_scene":["Quế Ma Ma","Tiểu Minh Tử"],"image_prompt":"Close on [Quế Ma Ma] squinting suspiciously and poking with the tip of her whisk before recoiling with a wrinkled nose; [Tiểu Minh Tử]'s face holding his breath, cheeks puffed, sweat beading. Comedic tension, non-explicit framing at chest level.","video_prompt":"[Quế Ma Ma] pokes gingerly then jerks back with a scrunched nose; [Tiểu Minh Tử] exhales in relief, hitches up his clothes and sprints away."},{"scene_id":62,"original_text":"Thoát rồi! Thoát rồi! Kế hoạch quần sịp 2 lớp thành công mỹ mãn!\nTôi chạy về phía Long, hai thằng ôm nhau mừng rỡ.\n"Thấy chưa! Tao bảo là được mà! Trí thông minh của dân IT!"\n"Mày đỉnh quá Minh ơi! 2 quả vải thiều mà qua được ải!"","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Trần Long"],"image_prompt":"[Tiểu Minh Tử] running with arms wide toward [Trần Long] and the two hugging jubilantly, jumping in place; courtyard edge, sunny. Triumphant comedic.","video_prompt":"[Tiểu Minh Tử] sprints into [Trần Long]'s arms; the two hop in a circle cheering."},{"scene_id":63,"original_text":"Nhưng niềm vui chưa được bao lâu.\nQuế Ma Ma sau khi kiểm tra xong, bỗng nhiên đứng dậy, tuyên bố một câu khiến tôi chết lặng lần thứ hai trong ngày:\n"Được rồi! Kiểm tra thái giám xong! Bây giờ đến phần hai! Theo lệnh của Thái Hậu nương nương, vì lo lắng cho sức khỏe của các tú nữ sau khi thi squat hôm qua bị... bị hôi nách tập thể, nên hôm nay sẽ tổ chức đại hội... tắm rửa và kiểm tra mùi hương toàn cung! Tất cả cung nữ, thái giám đều phải tham gia! Đặc biệt là 20 tú nữ và... Tiểu Minh Tử!"\n"CÁI GÌ?"\nTôi và Long đồng thanh hét lên.","emotion":"","emotion_tag":"","characters_in_scene":["Quế Ma Ma","Tiểu Minh Tử","Trần Long"],"image_prompt":"[Quế Ma Ma] rising from her chair with a triumphant proclamation, arm outstretched; [Tiểu Minh Tử] and [Trần Long] mid-embrace turning to scream in unison with jaws dropped. Courtyard, comedic shock.","video_prompt":"[Quế Ma Ma] stands and announces; the friends' hug freezes and they scream in sync with jaws dropping."},{"scene_id":64,"original_text":"Tắm rửa tập thể? Kiểm tra mùi hương? Vậy thì cái quần vải thiều + tỏi của tôi...\nVà cái sịp Doraemon bên trong...\nToang thật rồi ông giáo ạ!\nQuế Ma Ma nhìn tôi cười nham hiểm:\n"Tiểu Minh Tử, ngươi có cái quần Doraemon thần thú may mắn, ai ngửi thấy cũng sinh 8 con trai. Thái Hậu nói, hôm nay ngươi phải cởi ra cho mọi người cùng... cùng hít hà lấy may!"\nTôi ôm chặt mông, lùi lại:\n"Không! Không bao giờ! Thần thú của tôi chỉ cho Hoàng Thượng hít thôi!"","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Quế Ma Ma"],"image_prompt":"[Tiểu Minh Tử] backing away clutching his backside with a horrified expression as [Quế Ma Ma] advances with a sly grin; a thought bubble showing a blue cat print with sweat drops. Comedic dread.","video_prompt":"[Quế Ma Ma] advances with a sly smile; [Tiểu Minh Tử] retreats step by step shielding his backside, shaking his head."},{"scene_id":65,"original_text":"Long đứng bên cạnh, mặt tái mét, ghé tai tôi nói nhỏ:\n"Minh ơi... lần này... tao cũng không cứu được mày rồi... Hay là... mày cho cả cung hít chung một lần cho xong... coi như làm phước..."\nTôi nhìn Long, nhìn Quế Ma Ma, nhìn 20 cô tú nữ đang hớn hở chuẩn bị đi tắm, và nhìn xuống cái quần lót vải thiều đang bốc mùi tỏi nồng nặc của mình.\nThôi xong. Sự nghiệp thái giám dỏm của tôi, có lẽ sẽ kết thúc ngay trong chiều nay, tại nhà tắm tập thể của hoàng cung.\nTôi ngửa mặt lên trời, thầm chửi con mèo Mỡ:\n"Mỡ ơi là Mỡ! Tất cả là tại mày! Đợi tao về, tao cạo lông mày!"","emotion":"","emotion_tag":"","characters_in_scene":["Trần Long","Tiểu Minh Tử","Quế Ma Ma"],"image_prompt":"[Tiểu Minh Tử] looking up at the sky with clenched fists and a woeful face, dark clouds gathering; beside him [Trần Long] pale and whispering; in the background [Quế Ma Ma] and giggling maidens heading toward a bathhouse. Dusk light, comedic doom.","video_prompt":"Slow tilt up as [Tiểu Minh Tử] raises his face to the sky shaking a fist; [Trần Long] pats his shoulder helplessly; clouds roll in."},{"scene_id":66,"original_text":"Nếu có ai hỏi tôi, Trần Minh, điều kinh hoàng nhất khi xuyên không là gì?\nKhông phải là bị chém đầu.\nKhông phải là phải tịnh thân.\nMà là bị một trăm người, cả nam lẫn nữ, cả già lẫn trẻ, đòi ngửi cái quần sịp Doraemon của mình.\nĐó là tình cảnh hiện tại của tôi.","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử"],"image_prompt":"Title-card-style shot: [Tiểu Minh Tử] standing alone in a big palace courtyard with a hundred faceless silhouettes of men and women crowding in and staring toward his backside; he looks straight into the camera, deadpan and doomed. Comedic.","video_prompt":"Slow zoom on [Tiểu Minh Tử]'s deadpan face as silhouettes of the crowd close in from the edges of the frame."},{"scene_id":67,"original_text":"Sau lời tuyên bố "cho mọi người hít hà lấy may" của Quế Ma Ma, tôi đã bị hai tên thái giám lực lưỡng vác như vác một con heo quay, lôi thẳng về phía được gọi là "Ngọc Tuyền Trì" - nhà tắm tập thể hoàng gia.\nTôi gào thét: "Buông tao ra! Bọn bây có biết đây là xâm phạm quyền riêng tư cá nhân không hả! Tao sẽ kiện lên Liên Hợp Quốc!"\nQuế Ma Ma đi đằng trước, phẩy phẩy cái phất trần: "Kêu đi! Càng kêu to thì thần thú Doraemon càng thiêng! Lát nữa ai cũng được hít một cái thì Đại Ngụy ta mỗi nhà 8 đứa con trai!"","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Quế Ma Ma"],"image_prompt":"Two burly eunuchs carrying [Tiểu Minh Tử] horizontally like a roast pig, his limbs thrashing and mouth screaming; [Quế Ma Ma] leading with a flicking whisk; palace corridor with vermilion pillars. Comedic.","video_prompt":"Tracking shot along the corridor: [Tiểu Minh Tử] thrashes and shouts while carried; [Quế Ma Ma] flicks her whisk ahead, unfazed."},{"scene_id":68,"original_text":"Trần Long - Hoàng Thượng - thì chạy theo sau, mặt mày méo xệch, vừa chạy vừa la: "Ma Ma! Ma Ma từ từ! Tiểu Minh Tử nó... nó dị ứng với nước! Nó tắm là nó nổi mề đay!"\n"Hoàng Thượng yên tâm, lão nô đã chuẩn bị sẵn lá ngải cứu cho nó rồi ạ!"\nTôi tuyệt vọng nhìn Long. Long nhìn tôi với ánh mắt "tao hết cứu được mày rồi, mày tự bơi đi".","emotion":"","emotion_tag":"","characters_in_scene":["Trần Long","Quế Ma Ma","Tiểu Minh Tử"],"image_prompt":"[Trần Long] running behind with a twisted anxious face and flailing arms; [Quế Ma Ma] not even looking back; [Tiểu Minh Tử] being carried, looking back at [Trần Long] with despair as [Trần Long] gives a helpless 'you're on your own' shrug. Corridor, comedic.","video_prompt":"[Trần Long] jogs after the group waving his arms; [Quế Ma Ma] dismisses him; [Tiểu Minh Tử]'s despairing eyes meet [Trần Long]'s helpless shrug."},{"scene_id":69,"original_text":"Nhà tắm Ngọc Tuyền Trì hiện ra trước mắt tôi. Nó to như một cái bể bơi mini, hơi nước bốc lên nghi ngút, mùi xà phòng bồ kết thơm lừng. Xung quanh đã có sẵn 20 cô tú nữ hôm qua đang đứng túm tụm, mặt ai cũng đỏ bừng vì ngượng, trên người quấn một cái khăn tắm mỏng.\nVà ở giữa hồ, Thái Hậu đang ngồi chễm chệ trên một cái ghế cao, tay cầm quạt, mặt háo hức như đang xem đá gà.\n"Đâu? Đâu? Đưa thần thú Doraemon ra đây cho哀家 xem!" Thái Hậu hét lên.","emotion":"","emotion_tag":"","characters_in_scene":["Thái Hậu"],"image_prompt":"Grand steamy imperial bathhouse Ngọc Tuyền Trì: a huge mini-pool with rising mist, soap-scented; twenty flushed maidens huddled together wrapped modestly in light robes; [Thái Hậu] seated high on a tall chair with a fan, eyes eager like watching a cockfight. Family-friendly, modest coverage.","video_prompt":"Slow reveal through drifting steam of the pool and huddled maidens; [Thái Hậu] leans forward with fan in hand and shouts eagerly."},{"scene_id":70,"original_text":"Tôi bị đặt xuống đất. Hai tay vẫn ôm chặt mông.\n"Thái Hậu nương nương! Nô tài... nô tài có thể không tắm được không ạ? Nô tài... nô tài tới tháng rồi ạ!"\nTôi buột miệng nói bừa.\nCả nhà tắm im lặng.\nQuế Ma Ma trợn mắt: "Tới tháng? Ngươi là thái giám mà tới tháng cái gì?"\n"Dạ... ý nô tài là... là tới tháng... phải giữ gìn vệ sinh cá nhân, không được để thần thú bị ướt ạ! Thần thú này kỵ nước! Gặp nước là nó... nó biến thành Hello Kitty ạ!"\nTôi chém gió không kịp suy nghĩ.","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Quế Ma Ma","Thái Hậu"],"image_prompt":"[Tiểu Minh Tử] set down on the tiles, both hands clamped on his backside, blurting out a nonsense excuse with a panicked smile; [Quế Ma Ma] with bulging eyes; [Thái Hậu] watching from her high chair. Steam-filled bathhouse, comedic.","video_prompt":"[Tiểu Minh Tử] blurts wildly with flailing excuses; [Quế Ma Ma]'s eyes bulge; steam swirls across the frame."},{"scene_id":71,"original_text":"Thái Hậu nghe vậy thì càng tò mò: "Hello Kitty lại là thần thú gì nữa? Có sinh được con trai không?"\n"Dạ sinh được 8 đứa con gái ạ!"\n"Không cần! 哀家 chỉ cần con trai! Vậy thì đừng để nó ướt! Nhưng mà... không tắm thì làm sao kiểm tra mùi hương được?"\nĐúng lúc đó, một mùi hương nồng nặc, chua chua, ngai ngái, xộc thẳng vào mũi tất cả mọi người.\nMọi người quay lại. Một cô tú nữ mập mạp nhất trong nhóm, có lẽ do hồi hộp quá, đã... toát mồ hôi.\nMùi hôi nách.\nMùi này lan tỏa trong không gian ẩm ướt của nhà tắm, nó được khuếch đại lên gấp 10 lần.\nTất cả mọi người đều lấy tay bịt mũi.","emotion":"","emotion_tag":"","characters_in_scene":["Thái Hậu"],"image_prompt":"Everyone in the steamy bathhouse pinching their noses with disgusted faces, green wavy stink lines rising from a chubby, nervous, sweating maiden in a bath wrap; [Thái Hậu] fanning her face. Comedic, exaggerated smell effect.","video_prompt":"Green stink waves rise and spread through the steam; everyone's hands fly to their noses in sequence; [Thái Hậu] fans frantically."},{"scene_id":72,"original_text":"Thái Hậu cũng bịt mũi, giọng oang oang: "Trời ơi! Cái mùi gì thế này! Còn kinh hơn cả mùi chân của Hoàng Thượng sau khi đi cày ruộng với trâu!"\nLong bị nói xấu thì gãi đầu cười hề hề: "Mẫu hậu, đó là mùi... mùi pheromone ạ! Mùi quyến rũ tự nhiên!"\n"Quyến rũ cái đầu con! Mau! Mau tìm cách khử mùi cho哀家! Nếu không, 20 đứa này làm sao mà thị tẩm được!"","emotion":"","emotion_tag":"","characters_in_scene":["Thái Hậu","Trần Long"],"image_prompt":"[Thái Hậu] pinching her nose and shouting, waving her other hand; [Trần Long] scratching his head with a sheepish grin, standing at the pool edge. Steamy bathhouse, comedic.","video_prompt":"[Thái Hậu] shouts through a pinched nose; [Trần Long] scratches his head and grins sheepishly, then flinches at her glare."},{"scene_id":73,"original_text":"Cơ hội của tôi đã đến!\nĐây chính là lúc để một nhân viên IT, à không, một chuyên gia hóa học, à không, một thằng từng xem 1001 mẹo vặt trên TikTok tỏa sáng!\nTôi lập tức bật dậy, không ôm mông nữa, ưỡn ngực ra, chỉ tay lên trời và hét:\n"Thái Hậu nương nương! Nô tài có cách! Nô tài có bí kíp gia truyền khử mùi hôi nách đảm bảo hết 100%!"\nTất cả ánh mắt lại đổ dồn về phía tôi.\n"Nói mau!" Thái Hậu nói.","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Thái Hậu"],"image_prompt":"[Tiểu Minh Tử] leaping up heroically with chest out and one finger pointing to the sky, a spotlight beam from above; all faces turning toward him; [Thái Hậu] impatiently commanding. Steamy bathhouse, mock-epic.","video_prompt":"[Tiểu Minh Tử] springs upright with a heroic pose as a light beam falls on him; every head turns; [Thái Hậu] flicks her hand to command."},{"scene_id":74,"original_text":""Dạ, theo bí kíp gia truyền 18 đời nhà nô tài để lại, muốn khử mùi hôi nách, chúng ta cần 3 thứ: Phèn chua, lá ngải cứu, và... tỏi!"\nTôi chỉ vào củ tỏi vẫn còn đang nằm trong cái quần vải thiều của mình.\nQuế Ma Ma nhíu mày: "Tỏi? Tỏi thì hôi thêm chứ khử mùi gì?"\n"Dạ Ma Ma không biết rồi! Lấy độc trị độc ạ! Mùi hôi nách gặp mùi tỏi thì hai mùi sẽ đánh nhau, triệt tiêu lẫn nhau, cuối cùng chỉ còn lại mùi thơm thoang thoảng như... như mùi bún đậu mắm tôm ạ!"\nTôi càng nói càng thấy mình ngu, nhưng lỡ phóng lao rồi phải theo lao.","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Quế Ma Ma"],"image_prompt":"[Tiểu Minh Tử] holding up three fingers and gesturing to a table with alum stone, mugwort leaves and a garlic bulb; [Quế Ma Ma] frowning skeptically; comedic cartoon 'smell battle' clouds fighting overhead. Bathhouse.","video_prompt":"[Tiểu Minh Tử] counts three fingers, presents the garlic; [Quế Ma Ma] frowns; cartoon smell clouds clash and puff away above them."},{"scene_id":75,"original_text":"Thái Hậu gật gù: "Nghe có vẻ có lý! Người đâu, mang phèn chua và ngải cứu tới đây!"\nRất nhanh, một đống phèn chua to như cục gạch và một rổ lá ngải cứu được mang tới.\nTôi bắt đầu màn biểu diễn của mình. Tôi lấy phèn chua giã nát ra, trộn với lá ngải cứu vò nát, rồi... bóc củ tỏi của mình ra, giã luôn vào đó.\nMột hỗn hợp sền sệt, màu xanh đen, bốc mùi tỏi nồng nặc ra đời.\nTôi bưng cái bát hỗn hợp đó lên, trông như một lão phù thủy đang luyện đan.","emotion":"","emotion_tag":"","characters_in_scene":["Thái Hậu","Tiểu Minh Tử"],"image_prompt":"[Tiểu Minh Tử] pounding alum, mugwort and garlic in a stone mortar like a wizard brewing an elixir, green-black sludge bubbling; a basket of leaves beside; [Thái Hậu] nodding from her chair. Steam and dramatic side light.","video_prompt":"[Tiểu Minh Tử] pounds vigorously in the mortar with a pestle, sludge splattering; he lifts the bowl aloft like a wizard as green fumes curl."},{"scene_id":76,"original_text":""Đây! Đây chính là 'Thần Dược Khử Mùi Doraemon' do chính tay nô tài bào chế! Bây giờ, mời một vị tú nữ dũng cảm nhất lên đây thử nghiệm!"\n20 cô tú nữ nhìn nhau, không ai dám lên. Mùi tỏi quá kinh khủng.\nCuối cùng, cô tú nữ mập mập hồi nãy, người gây ra thảm họa mùi hương, rụt rè bước lên. Chắc cô ấy cũng xấu hổ lắm rồi.\n"Tốt! Cô nương, xin hãy giơ nách lên!"\nCô tú nữ đỏ mặt, từ từ giơ tay lên.\nTôi lấy tay quệt một ít hỗn hợp tỏi + phèn chua + ngải cứu, rồi... bôi thẳng vào nách cô ấy.\n"Á! Lạnh quá!"\n"Không sao! Lạnh một chút thôi! Bây giờ cô hãy vận động mạnh cho ra mồ hôi đi! Hãy squat 20 cái như hôm qua!"","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử"],"image_prompt":"[Tiểu Minh Tử] holding up a bowl of dark green paste while twenty maidens exchange fearful glances and none steps forward; the plump shy maiden raising an arm timidly as he dabs paste at her underarm and she squeals. Steamy bathhouse, family-friendly comedic.","video_prompt":"Maidens shrink back; the plump maiden steps forward shyly and lifts an arm; [Tiểu Minh Tử] dabs paste, she squeals and shivers."},{"scene_id":77,"original_text":"Cô tú nữ bắt đầu squat. 1... 2... 3...\nCả nhà tắm nín thở theo dõi.\nĐến cái thứ 15, mồ hôi cô ấy bắt đầu túa ra.\nVà điều kỳ diệu đã xảy ra.\nKhông còn mùi chua chua ngai ngái nữa!\nChỉ còn mùi... mùi tỏi ngải cứu nồng nặc!\nNhưng ít ra, mùi tỏi vẫn dễ chịu hơn mùi hôi nách gấp trăm lần! Nó giống như mùi quán bún đậu hơn là mùi... nách.","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Thái Hậu"],"image_prompt":"The plump maiden mid-squat with sweat on her brow, everyone around holding their breath; green cartoon smell cloud turning into a cozy bún-đậu-stall-shaped scent puff; [Tiểu Minh Tử] and [Thái Hậu] watching tensely. Bathhouse.","video_prompt":"Count-in squats rising and falling; the crowd holds its breath; the smell cloud morphs from sour green to garlicky warm; eyebrows lift."},{"scene_id":78,"original_text":"Thái Hậu hít hít, rồi gật gù: "Ồ! Đỡ hơn thật! Không còn mùi chua nữa! Chỉ còn mùi... mùi đồ ăn! Thơm! Thơm đấy!"\nQuế Ma Ma cũng hít thử: "Đúng là đỡ hơn thật ạ! Thần kỳ quá!"\nCả 20 cô tú nữ thấy vậy thì nhao nhao lên:\n"Tôi cũng muốn! Tôi cũng muốn bôi!"\n"Cho tôi nữa! Nách tôi cũng hôi!"","emotion":"","emotion_tag":"","characters_in_scene":["Thái Hậu","Quế Ma Ma"],"image_prompt":"[Thái Hậu] sniffing the air with a pleased nod; [Quế Ma Ma] sniffing beside her, amazed; the twenty maidens rushing forward with hands raised, clamoring. Steamy bathhouse, cheerful chaos.","video_prompt":"[Thái Hậu] sniffs and nods approvingly; [Quế Ma Ma] sniffs and marvels; the maidens surge forward clamoring with raised arms."},{"scene_id":79,"original_text":"Trong chốc lát, nhà tắm Ngọc Tuyền Trì biến thành một xưởng sản xuất bún đậu. Ai cũng bôi nách bằng tỏi, mùi tỏi bay khắp hoàng cung, khiến cho Ngự Thiện Phòng tưởng là Hoàng Thượng muốn ăn bún đậu, vội chiên thêm một mẻ đậu phụ.\nCòn tôi, từ tội nhân sắp bị lột sịp, bỗng nhiên trở thành anh hùng, thành "Tiến Sĩ Khử Mùi" của Đại Ngụy.","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử"],"image_prompt":"Bathhouse turned into an assembly line: maidens dabbing green paste under raised arms, garlic scent trails drifting out of windows across palace roofs; in the imperial kitchen cooks frying tofu in bewilderment; [Tiểu Minh Tử] standing at center with hands on hips like a proud doctor. Family-friendly, comedic montage.","video_prompt":"Pan across the assembly line of maidens dabbing paste; scent trails drift out over palace roofs; cut to kitchen cooks frantically frying tofu."},{"scene_id":80,"original_text":"Thái Hậu vui vẻ phán:\n"Tốt! Tiểu Minh Tử có công lớn! Thưởng! Thưởng cho nó 20 lượng bạc nữa! Và từ nay, nó sẽ là người phụ trách khử mùi cho toàn bộ hậu cung! Tất cả thái giám, cung nữ, tú nữ, ai hôi nách đều phải qua tay nó!"\nTôi đang cười toe toét vì được thưởng thì nghe đến câu cuối, mặt cứng đờ.\nPhụ trách khử mùi cho toàn bộ hậu cung? Tức là ngày nào tôi cũng phải đi... ngửi nách và bôi tỏi cho mấy trăm người á?\nTrời ơi, đây là phần thưởng hay là hình phạt vậy?","emotion":"","emotion_tag":"","characters_in_scene":["Thái Hậu","Tiểu Minh Tử"],"image_prompt":"[Thái Hậu] proclaiming happily with a raised hand; [Tiểu Minh Tử] with a beaming grin frozen into a stiff, horrified mask; a pile of silver taels beside him. Bathhouse, comedic reversal.","video_prompt":"[Thái Hậu] announces cheerfully; [Tiểu Minh Tử]'s toothy grin slowly stiffens and collapses into horror."},{"scene_id":81,"original_text":"Long đi tới, vỗ vai tôi, cười gian xảo:\n"Chúc mừng chú em! Chức quan to đấy! Ngửi Nách Đại Tổng Quản! Từ mai mày tha hồ mà hít!"\nTôi lườm nó: "Mày im đi! Tất cả là tại mày! Mày là Hoàng Thượng mà không dẹp được cái vụ tắm chung này à?"\n"Tao làm sao mà dẹp được! Mẹ tao là Thái Hậu mà! Với lại... tao cũng muốn xem... à không, tao cũng muốn kiểm tra tình hình hậu cung chứ bộ!"\nThằng chó này, lộ bản chất dê xồm rồi!","emotion":"","emotion_tag":"","characters_in_scene":["Trần Long","Tiểu Minh Tử"],"image_prompt":"[Trần Long] clapping [Tiểu Minh Tử] on the shoulder with a sly grin; [Tiểu Minh Tử] glaring sideways with irritated eyes. Bathhouse edge, steam, comedic bickering.","video_prompt":"[Trần Long] slaps his friend's shoulder with a sly smirk; [Tiểu Minh Tử] glowers, then points an accusing finger."},{"scene_id":82,"original_text":"Buổi tắm rửa tập thể cuối cùng cũng kết thúc trong mùi tỏi nồng nặc. Ai cũng được khử mùi, ai cũng vui vẻ, chỉ có tôi là mệt bở hơi tai vì phải giã tỏi liên tục.\nTối hôm đó, tôi và Long lại ngồi trong tẩm cung, đếm bạc.\n"30 lượng rồi Minh ơi! Mày giàu nhất cái đám thái giám rồi đấy!" Long nói.\n"Giàu cái gì mà giàu! Mai tao phải đi bôi nách cho 300 người! Tay tao sẽ thúi mùi tỏi mãi mãi! Sau này làm sao mà có người yêu!"\nLong cười ha hả: "Lo gì! Mày có Doraemon bảo kê rồi! Gái nào ngửi thấy mùi Doraemon của mày mà chẳng đổ!"\nTôi ném cái gối vào mặt nó.","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Trần Long"],"image_prompt":"Night in the bedchamber: [Tiểu Minh Tử] exhausted, sniffing his garlic-stinking hands with a sour face; [Trần Long] counting silver ingots on the table with a laugh; a pillow mid-air flying toward [Trần Long]'s face. Candlelight, comedic.","video_prompt":"[Trần Long] stacks silver and laughs; [Tiểu Minh Tử] sniffs his hands and grimaces, then hurls a pillow that smacks [Trần Long] in the face."},{"scene_id":83,"original_text":"Đúng lúc đó, Tiểu Thúy hớt hải chạy vào, mặt tái mét:\n"Hoàng Thượng! Minh công công! Không xong rồi! Thái Hậu... Thái Hậu vừa ra một đạo懿 chỉ mới!"\n"懿 chỉ gì?" Hai thằng đồng thanh.\nTiểu Thúy run rẩy đọc tờ giấy trên tay:\n"Vì Thần Dược Khử Mùi Doraemon quá hiệu nghiệm, Thái Hậu quyết định... 3 ngày sau sẽ tổ chức 'Đại Hội Ngửi Nách Toàn Quốc'! Mời tất cả các tiểu thư con nhà quan lại trong kinh thành vào cung để... để cho Minh công công kiểm tra và khử mùi! Ai được Minh công công chứng nhận 'nách thơm' thì mới được vào vòng trong tuyển tú!"","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Thúy","Trần Long","Tiểu Minh Tử"],"image_prompt":"[Tiểu Thúy] bursting in pale and trembling, reading from an imperial scroll held in shaking hands; [Trần Long] and [Tiểu Minh Tử] frozen mid-argument staring at her. Candlelit bedchamber, dramatic comedic.","video_prompt":"[Tiểu Thúy] bursts in, unrolls the scroll with trembling hands and reads; the two friends slowly turn their heads toward her."},{"scene_id":84,"original_text":"Tôi và Long nhìn nhau, hóa đá.\nĐại Hội Ngửi Nách Toàn Quốc?\n300 cô gái? 300 cái nách?\nTôi, Trần Minh, 26 tuổi, FA 26 năm, chưa từng được nắm tay gái, bây giờ sắp phải ngửi nách của 300 cô gái?\nĐây là thiên đường hay là địa ngục vậy?\nTôi ngửa mặt lên trời, không biết nên khóc hay nên cười.\n"Mỡ ơi... hình như tao sắp... sắp hết FA rồi... bằng đường mũi..."","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Trần Long"],"image_prompt":"[Tiểu Minh Tử] and [Trần Long] turned literally to grey stone statues with cracks, mouths agape; a thought bubble showing rows of countless anonymous silhouettes; [Tiểu Minh Tử] looking up, half-crying half-laughing. Bedchamber, comedic.","video_prompt":"Both figures freeze and stone-grey spreads across them; [Tiểu Minh Tử]'s face cracks into a half-laugh, half-sob as he looks up."},{"scene_id":85,"original_text":"Tôi đã từng nghĩ, đỉnh cao của sự nghiệp một thằng FA 26 năm như tôi là có người yêu.\nTôi đã lầm.\nĐỉnh cao của sự nghiệp FA chính là được phong làm Ban Giám Khảo của cuộc thi "Ngửi Nách Toàn Quốc" với 300 thí sinh là tiểu thư con nhà quan.","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử"],"image_prompt":"Mock-heroic poster style: [Tiểu Minh Tử] standing on a judge's dais with a ridiculous ceremonial banner behind him reading a fictional contest title in stylized calligraphy; rows of gowned maidens below; his expression is smug and dazed. Comedic.","video_prompt":"Slow heroic push-in on [Tiểu Minh Tử] on the dais as banners flutter behind him; his smug smile wobbles."},{"scene_id":86,"original_text":"Sáng sớm ngày diễn ra đại hội, tôi thức dậy với hai quầng thâm mắt to như gấu trúc.\nKhông phải vì hồi hộp, mà vì cả đêm qua tôi phải ngồi giã tỏi.\nQuế Ma Ma đã lôi cả một bao tải tỏi to như bao tải gạo đến phòng tôi, bắt tôi giã cho đủ 300 phần "Thần Dược Khử Mùi Doraemon" để dùng cho đại hội. Tay tôi phồng rộp hết cả lên, người tôi bốc mùi tỏi từ đầu đến chân, đến mức Tiểu Thúy vừa bước vào phòng đã tưởng tôi là một củ tỏi thành tinh.\n"Minh công công, người... người thơm quá ạ!" Tiểu Thúy vừa bịt mũi vừa khen.\n"Thơm cái đầu em! Anh sắp biến thành bún đậu mắm tôm đến nơi rồi!" Tôi mếu máo.","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Quế Ma Ma","Tiểu Thúy"],"image_prompt":"[Tiểu Minh Tử] with panda-dark eye circles sitting amid mountains of garlic beside a giant sack, blistered hands; [Tiểu Thúy] at the door pinching her nose with a polite smile; green stink lines around him. Morning light, comedic.","video_prompt":"[Tiểu Minh Tử] slumps with dark eye circles as green fumes swirl; [Tiểu Thúy] enters and pinches her nose; he whines with a quivering lip."},{"scene_id":87,"original_text":"Bên ngoài, tiếng trống chiêng đã vang lên inh ỏi. Đại Hội Ngửi Nách Toàn Quốc chính thức khai mạc.\nĐịa điểm tổ chức là Ngự Hoa Viên, vườn hoa đẹp nhất hoàng cung. Nhưng hôm nay, hoa không còn thơm nữa, vì cả vườn hoa đã bị át bởi mùi tỏi.\nThái Hậu ngồi trên cao, mặc áo bào đỏ chói, tay cầm quạt, mặt mày hớn hở như đang xem hội. Bên cạnh là Trần Long - Hoàng Thượng - mặt mày bí xị như vừa bị mất sổ gạo.","emotion":"","emotion_tag":"","characters_in_scene":["Thái Hậu","Trần Long"],"image_prompt":"Imperial garden Ngự Hoa Viên in full bloom under festive banners and drums; [Thái Hậu] in blazing red on a high platform with fan, cheerful as at a fair; [Trần Long] beside her with a glum sulking face. Bright daylight, garlic scent lines drifting over the flowers.","video_prompt":"Drums and gongs; wide pan across the flowering garden and banners; [Thái Hậu] fans he
