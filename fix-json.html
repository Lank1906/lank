rself gleefully while [Trần Long] slumps with a pout."},{"scene_id":88,"original_text":"Dưới sân, 300 cô gái được chia thành 10 hàng, mỗi hàng 30 người. Ai cũng xinh xắn, váy áo lụa là, nhưng mặt ai cũng hoang mang tột độ. Chắc cả đời họ cũng không nghĩ có ngày mình phải tham gia một cuộc thi kỳ quặc như thế này.\nTôi, với chức danh "Ngửi Nách Đại Tổng Quản", được mặc một bộ quan phục mới toanh do Thái Hậu ban. Trông cũng ra dáng lắm, nếu không tính đến việc trên tay tôi đang bưng một cái bát đựng hỗn hợp tỏi giã nát sền sệt.\nQuế Ma Ma đứng lên, gõ chiêng một cái "KENG!":\n"Yên lặng! Đại Hội Ngửi Nách Toàn Quốc lần thứ nhất, do Thái Hậu nương nương và Minh công công đồng tổ chức, chính thức bắt đầu! Sau đây, mời Minh công công lên phát biểu!"","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Quế Ma Ma"],"image_prompt":"Wide aerial of the garden: 300 beautiful girls in silk gowns in ten neat rows, all looking bewildered; [Tiểu Minh Tử] in a brand-new official robe holding a bowl of garlic paste; [Quế Ma Ma] standing hitting a gong. Festive bright colors.","video_prompt":"Gong 'KENG' resonates; ripple of startled girls across the rows; [Tiểu Minh Tử] straightens in his new robe holding the bowl."},{"scene_id":89,"original_text":"Tôi run rẩy bước lên bục cao. 300 đôi mắt nhìn tôi chằm chằm. Tôi cảm thấy mình như một con khỉ trong sở thú.\n"E hèm!" Tôi ho khan một tiếng cho có uy. "Kính thưa Thái Hậu nương nương, kính thưa Hoàng Thượng đẹp trai, kính thưa toàn thể 300 chị em xinh đẹp có mặt ở đây!"\nTôi bắt đầu chém gió, nghề tủ của tôi.\n"Hôm nay, chúng ta tụ họp ở đây, không phải để thi sắc đẹp, không phải để thi tài năng, mà là để thi... mùi hương! Vì sao? Vì sắc đẹp rồi cũng sẽ tàn phai, tài năng rồi cũng sẽ lỗi thời, chỉ có mùi hương là còn mãi! Một người phụ nữ có thể xấu, nhưng nách nhất định phải thơm! Đó là tôn chỉ của Đại Ngụy ta!"","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử"],"image_prompt":"[Tiểu Minh Tử] on a high podium delivering a grand speech with one arm raised, the crowd of 300 girls staring like zoo visitors at a monkey; his hand holding the bowl aloft. Bright garden, mock-oratory.","video_prompt":"[Tiểu Minh Tử] coughs, steps up on the podium, and spreads his arms grandly; camera arcs around him with the crowd staring below."},{"scene_id":90,"original_text":"Thái Hậu gật gù: "Nói hay lắm! Rất có đạo lý! Không hổ là người sở hữu thần thú Doraemon!"\nTrần Long ngồi bên cạnh lẩm bẩm: "Đạo lý cái con khỉ, nó đang nói nhảm đấy mẫu hậu ơi..."\nTôi tiếp tục: "Thể lệ cuộc thi rất đơn giản! Ta sẽ đi qua từng người, kiểm tra mùi hương! Ai thơm tho tự nhiên, không cần bôi thuốc, sẽ được vào thẳng vòng trong, được phong là 'Thơm Tho Tự Nhiên'! Ai hơi có mùi, ta sẽ ban cho Thần Dược Doraemon để khử mùi, và được phong là 'Thơm Tho Nhân Tạo'! Còn ai mà... mà thúi quá thì..."\nTôi nhìn Quế Ma Ma.\nQuế Ma Ma hét lên: "Thúi quá thì loại! Đuổi về quê lấy chồng chăn trâu!"\n300 cô gái rùng mình.\n"Được rồi! Bắt đầu! Người đầu tiên!"","emotion":"","emotion_tag":"","characters_in_scene":["Thái Hậu","Trần Long","Tiểu Minh Tử","Quế Ma Ma"],"image_prompt":"[Thái Hậu] nodding approvingly; [Trần Long] muttering with a deadpan side-eye; [Quế Ma Ma] yelling a verdict with a raised whisk while 300 girls shudder. [Tiểu Minh Tử] at the podium reading rules. Garden, comedic.","video_prompt":"[Thái Hậu] nods; [Trần Long] mutters sideways; [Quế Ma Ma] bellows and the whole crowd shudders in a wave."},{"scene_id":91,"original_text":"Cô gái đầu tiên bước lên. Cô ta là con gái của Thượng Thư Bộ Lễ, nghe nói cầm kỳ thi họa đều giỏi.\nCô ta e thẹn giơ tay lên.\nTôi hít một hơi thật sâu, lấy hết can đảm của một thằng FA 26 năm chưa từng được gần gái, rồi từ từ... ghé mũi vào.\nTôi thề, khoảnh khắc đó, thời gian như ngừng trôi.\nMùi gì nhỉ? Mùi phấn thơm, mùi hoa nhài, và thoang thoảng... mùi mồ hôi chua chua. Không quá thúi, nhưng cũng không thơm.\nTôi nghiêm mặt, phán như một chuyên gia:\n"Hơi chua! Chua như sữa chua hết hạn! Cần bôi thuốc! Loại B!"\nTôi quệt một ít tỏi vào nách cô ta.\nCô ta kêu "Á" một tiếng rồi chạy xuống, mặt đỏ bừng.","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử"],"image_prompt":"A shy young lady in a pale gown raising her arm demurely, [Tiểu Minh Tử] leaning in with closed eyes and a sniffing expression like a wine sommelier, time-frozen aura with petals hanging in the air; next beat: he dabs paste and she runs off blushing. Garden, family-friendly comedic.","video_prompt":"Time-slow effect: petals hang in the air as [Tiểu Minh Tử] leans in, sniffs, opens his eyes with a verdict; the lady squeals and hurries off."},{"scene_id":92,"original_text":"Người thứ hai... Người thứ ba... Người thứ mười...\nCứ thế, tôi đi dọc 10 hàng, ngửi hết 300 cái nách.\nĐến người thứ 50, mũi tôi đã tê liệt, không còn phân biệt được mùi gì nữa. Mùi nào cũng như mùi tỏi.\nĐến người thứ 100, tôi bắt đầu bị ảo giác. Tôi ngửi thấy mùi gà rán, mùi trà sữa, mùi lẩu Thái.\nĐến người thứ 200, tôi không còn ngửi bằng mũi nữa, tôi ngửi bằng niềm tin.\n"Thơm! Thơm lắm! Qua!"\n"Thúi! À nhầm, thơm! Qua luôn!"\nTôi phán bừa.","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử"],"image_prompt":"Montage of [Tiểu Minh Tử] walking down long rows of girls, his face progressively more glazed and dizzy; hallucination bubbles above his head of fried chicken, bubble tea and hotpot; a stamp-like 'approved' flourish. Garden, comedic time-lapse.","video_prompt":"Fast time-lapse along the rows; [Tiểu Minh Tử]'s eyes glaze over and his head sways; hallucination icons of food float around him; he waves girls through."},{"scene_id":93,"original_text":"Trần Long ngồi trên cao nhìn xuống, mặt càng lúc càng bí xị. Thấy thằng bạn thân của mình được ngửi nách 300 em gái xinh tươi, còn mình là Hoàng Thượng thì chỉ được ngồi nhìn, nó ghen tị ra mặt.\nĐến người thứ 250, một sự cố xảy ra.\nĐó là một cô gái cực kỳ xinh đẹp, da trắng như tuyết, môi đỏ như son, được mệnh danh là đệ nhất mỹ nhân kinh thành - con gái của Thừa Tướng.\nCô ta bước lên, kiêu sa giơ tay lên. Tôi vừa định ghé mũi vào ngửi, thì bỗng nhiên...\n"HẮT XÌ!"\nVì hít quá nhiều mùi tỏi, tôi bị dị ứng, hắt xì một cái thật to, văng hết cả nước bọt vào... nách cô ta.","emotion":"","emotion_tag":"","characters_in_scene":["Trần Long","Liễu Như Yên","Tiểu Minh Tử"],"image_prompt":"[Trần Long] on the high seat resting his chin on his fist in blatant jealousy; below, the stunning [Liễu Như Yên] gracefully lifting her arm; [Tiểu Minh Tử] leaning in and mid-sneeze with an explosive spray. Garden, comedic accident.","video_prompt":"[Trần Long] pouts jealously; [Liễu Như Yên] raises her arm haughtily; [Tiểu Minh Tử] scrunches his nose and sneezes explosively in slow motion."},{"scene_id":94,"original_text":"Cả Ngự Hoa Viên im phăng phắc.\nCô gái đệ nhất mỹ nhân nhìn xuống nách mình, nơi có một ít nước bọt của tôi, rồi hét lên một tiếng thất thanh:\n"Á! Bẩn quá! Ngươi dám bôi nước bọt vào người ta! Ta là đệ nhất mỹ nhân đấy!"\nThừa Tướng đứng ở hàng ghế khách mời cũng bật dậy: "To gan! Dám làm ô uế con gái ta! Người đâu, chém đầu nó!"\nThái Hậu cũng hoảng: "Tiểu Minh Tử! Ngươi làm cái gì vậy?"\nTôi đứng hình. Xong rồi, phen này là chết chắc rồi. Đụng vào con gái Thừa Tướng thì chỉ có đường chết.","emotion":"","emotion_tag":"","characters_in_scene":["Liễu Như Yên","Thừa Tướng","Thái Hậu","Tiểu Minh Tử"],"image_prompt":"[Liễu Như Yên] shrieking in disgust with a hand near her raised arm; [Thừa Tướng] leaping up from the guest seats in fury, pointing; [Thái Hậu] alarmed; [Tiểu Minh Tử] frozen white-faced. Silent garden turned uproar.","video_prompt":"Silence, then [Liễu Như Yên] screams; [Thừa Tướng] shoots up shouting with a pointing finger; [Thái Hậu] startles; [Tiểu Minh Tử] turns to stone."},{"scene_id":95,"original_text":"Đúng lúc ngàn cân treo sợi tóc, Trần Long bỗng nhiên đứng bật dậy, hét to:\n"IM LẶNG HẾT CHO TRẪM!"\nTiếng hét của Hoàng Thượng có uy lực thật, cả vườn hoa im re.\nLong bước xuống, đi tới chỗ tôi và cô gái kia, nhìn chằm chằm vào nách cô gái, rồi phán một câu xanh rờn:\n"Không! Đây không phải là nước bọt! Đây là... đây là nước thánh! Nước thánh Doraemon!"\n"Nước thánh?" Tất cả mọi người ngơ ngác.","emotion":"","emotion_tag":"","characters_in_scene":["Trần Long","Tiểu Minh Tử","Liễu Như Yên"],"image_prompt":"[Trần Long] standing up with a thunderous yell, dragon robe flaring, then striding down to [Tiểu Minh Tử] and [Liễu Như Yên] to declare with a solemn raised finger; the crowd of girls and officials staring in bafflement. Bright garden, mock-epic.","video_prompt":"[Trần Long] leaps up and roars; the garden goes still; he strides down the steps and declares with a raised finger; heads turn in confusion."},{"scene_id":96,"original_text":"Long bắt đầu chém gió còn kinh hơn cả tôi, đúng là bạn thân có khác:\n"Đúng vậy! Thần thú Doraemon sau khi khử mùi bằng tỏi, sẽ tiết ra nước thánh! Ai được nước thánh này ban cho, sẽ... sẽ thơm mãi mãi, nách sẽ tỏa ra mùi hoa sen, 7 ngày 7 đêm không hết!"\nTôi tròn mắt nhìn Long. Thằng này bịa chuyện không chớp mắt luôn!\nCô gái đệ nhất mỹ nhân nghe vậy, từ giận chuyển sang mừng: "Thật... thật sao ạ? Hoàng Thượng nói thật sao ạ?"\n"Trẫm là Hoàng Thượng, trẫm nói dối bao giờ!" Long nghiêm mặt. "Không tin, mọi người ngửi thử xem!"","emotion":"","emotion_tag":"","characters_in_scene":["Trần Long","Tiểu Minh Tử","Liễu Như Yên"],"image_prompt":"[Trần Long] spinning an absurd tale with sweeping gestures and lotus-flower sparkle effects around his hands; [Tiểu Minh Tử] staring at him in awe; [Liễu Như Yên] switching from anger to hopeful surprise. Garden, comedic.","video_prompt":"Lotus sparkles bloom around [Trần Long]'s gesturing hands; [Tiểu Minh Tử]'s eyes widen; [Liễu Như Yên]'s frown melts into hopeful surprise."},{"scene_id":97,"original_text":"Thế là, cả Thái Hậu, Quế Ma Ma, Thừa Tướng, và 299 cô gái còn lại, đều xúm lại, ghé mũi vào nách của cô gái đệ nhất mỹ nhân để ngửi.\nCảnh tượng 300 người chụm đầu vào ngửi một cái nách trông vừa buồn cười vừa kinh dị.\nSau khi ngửi xong, Quế Ma Ma hét lên: "Thơm! Thơm thật! Thơm mùi... mùi tỏi pha nước bọt! À nhầm, mùi hoa sen!"\nThái Hậu cũng gật gù: "Đúng là mùi hoa sen! Thần kỳ quá! Tiểu Minh Tử, ngươi mau hắt xì thêm vài cái nữa đi! Ban nước thánh cho tất cả các tú nữ!"\nTôi: "..."\nMẹ kiếp, coi tôi là bình xịt nước thánh à?","emotion":"","emotion_tag":"","characters_in_scene":["Thái Hậu","Quế Ma Ma","Thừa Tướng","Liễu Như Yên","Tiểu Minh Tử"],"image_prompt":"A huge cluster of heads (Thái Hậu, Quế Ma Ma, Thừa Tướng and hundreds of girls) all crowding around one raised arm of [Liễu Như Yên] sniffing with tilted noses; [Tiểu Minh Tử] at the edge with a flat, tired look. Comedic crowd shot, modest framing.","video_prompt":"The crowd leans in as one cluster of noses sniffing, then jerks up with awed faces; [Tiểu Minh Tử] stares deadpan into the camera."},{"scene_id":98,"original_text":"Cuối cùng, Đại Hội Ngửi Nách Toàn Quốc kết thúc trong một mớ hỗn độn mùi tỏi, mùi nước bọt, và mùi hoa sen tưởng tượng.\nKết quả: 299 cô gái được phong "Thơm Tho Nhân Tạo", 1 cô gái đệ nhất mỹ nhân được phong "Thơm Tho Thánh Thần" vì được ban nước thánh.\nTôi được Thái Hậu thưởng thêm 50 lượng bạc nữa, tổng cộng 80 lượng, và được đặc cách không phải đi bôi nách dạo nữa, vì mũi tôi đã... tạm thời bị điếc do ngửi quá nhiều.","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Thái Hậu","Liễu Như Yên"],"image_prompt":"Sunset over the disheveled garden: girls leaving in groups with rosy relief; [Liễu Như Yên] receiving a ribbon-like honor sash; [Thái Hậu] presenting a bag of silver to [Tiểu Minh Tử], who has cotton stuffed in both nostrils. Warm golden light, comedic.","video_prompt":"Golden hour pan across the departing girls; [Thái Hậu] hands over a silver bag; [Tiểu Minh Tử] wiggles cotton-stuffed nostrils and bows."},{"scene_id":99,"original_text":"Tối hôm đó, trong tẩm cung, tôi nằm vật ra giường, mũi không còn ngửi thấy gì nữa.\nLong ngồi bên cạnh, vừa gặm chân gà vừa cười:\n"Thấy chưa, tao cứu mày một mạng đấy! Không có tao là mày chết với con gái Thừa Tướng rồi!"\n"Cứu cái con khỉ! Mày biến tao thành cái bình xịt nước bọt di động!"\n"Thì cũng nhờ nước bọt của mày mà con bé đó thơm nhất hội còn gì! Biết đâu nó thích mày luôn thì sao?"\nTôi bật dậy: "Thích cái gì mà thích! Tao là thái giám! Thái giám dỏm!"\n"Thì dỏm mới thích chứ! Gái nó thích trai hư, trai dỏm mà!"","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Trần Long"],"image_prompt":"Night in the bedchamber: [Tiểu Minh Tử] sprawled flat on a bed with cotton in his nose; [Trần Long] sitting on the edge gnawing a chicken leg with a teasing grin; [Tiểu Minh Tử] sitting up to protest. Candlelight, comedic banter.","video_prompt":"[Tiểu Minh Tử] lies flat, then bolts upright to argue; [Trần Long] chews and waggles his eyebrows teasingly."},{"scene_id":100,"original_text":"Hai thằng đang cãi nhau thì Tiểu Thúy lại hớt hải chạy vào:\n"Hoàng Thượng! Minh công công! Không xong rồi! Cô gái đệ nhất mỹ nhân... cô ấy... cô ấy nói muốn... muốn lấy Minh công công ạ!"\n"CÁI GÌ?"\nTôi và Long đồng thanh hét lên, phun hết cả gà rán trong mồm ra ngoài.\nLấy tôi? Lấy một thái giám? Đệ nhất mỹ nhân kinh thành đòi lấy một thái giám dỏm?","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Thúy","Tiểu Minh Tử","Trần Long"],"image_prompt":"[Tiểu Thúy] bursting in flustered; [Tiểu Minh Tử] and [Trần Long] simultaneously spraying fried chicken bits from their mouths in shock, arms flung wide. Bedchamber, slapstick comedy.","video_prompt":"[Tiểu Thúy] blurts the news; both friends spit chicken in a synchronized spray, then freeze wide-eyed."},{"scene_id":101,"original_text":"Tôi nhìn xuống cái quần sịp Doraemon của mình, rồi nhìn sang Long.\nLong cũng nhìn tôi, mặt mày méo xệch:\n"Minh ơi... hình như... mày sắp có vợ rồi... mà vợ mày lại là đệ nhất mỹ nhân... còn tao... tao vẫn FA..."\nTôi ngửa mặt lên trời. Cuộc đời xuyên không này, nó càng ngày càng đi vào ngõ cụt một cách hài hước không thể tả được.\nLấy vợ khi đang làm thái giám? Chuyện này mà đồn ra ngoài, chắc cả Đại Ngụy cười cho thối mũi.\nNhưng mà... đệ nhất mỹ nhân đấy... cũng... cũng thơm mà nhỉ?","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Trần Long"],"image_prompt":"[Tiểu Minh Tử] looking down at the blue Doraemon underwear pinned in his hands then at [Trần Long], who wears a wry twisted face; [Tiểu Minh Tử] glancing up dreamily as a heart-shaped thought bubble with a lotus appears. Night bedchamber, comedic.","video_prompt":"Both friends exchange a long look; [Tiểu Minh Tử] tilts his face to the ceiling and a dreamy smile creeps in as a thought bubble blooms."},{"scene_id":102,"original_text":"Ba ngày chuẩn bị cho đại thọ của Thái Hậu, đối với người khác là ba ngày tập múa, tập đàn, tập làm thơ.\nĐối với tôi, Trần Minh, Ngửi Nách Đại Tổng Quản kiêm thái giám dỏm, đó là ba ngày địa ngục trần gian.\nVì đội văn nghệ của tôi gồm:","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử"],"image_prompt":"Palace rehearsal courtyards bustling with musicians, dancers and poets; [Tiểu Minh Tử] in the middle of the chaos with a hollow, haunted stare as flames of a cartoon hellscape flicker behind him. Comedic.","video_prompt":"Musicians and dancers whirl around; [Tiểu Minh Tử] stands still at center with a haunted stare as stylized flames flicker behind him."},{"scene_id":103,"original_text":"Tôi: Một thằng IT chưa bao giờ múa quá 2 phút ngoài đời, trừ lúc đi bão bóng đá.\nLiễu Như Yên: Đệ nhất mỹ nhân, múa thì đẹp như tiên nữ, nhưng cứ thấy tôi là lại đỏ mặt, quên bài, rồi giẫm luôn vào chân tôi.\nTrần Long: Hoàng Thượng, tự phong làm đạo diễn kiêm khán giả duy nhất, ngồi ăn gà rán chỉ đạo: "Chỗ này phải lắc mông mạnh lên! Chỗ kia phải nháy mắt đưa tình!"\nTiểu Thúy: Cung nữ bánh bao, được phân công làm đội hậu cần, phụ trách kéo rèm, bật nhạc... bằng mồm, vì thời này làm gì có loa bluetooth.","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Liễu Như Yên","Trần Long","Tiểu Thúy"],"image_prompt":"Four-panel cast lineup: [Tiểu Minh Tử] in a stiff awkward dance pose; [Liễu Như Yên] flushed stepping on his foot; [Trần Long] sprawled on a chair with fried chicken directing; [Tiểu Thúy] behind a curtain rope with her cheeks puffed like a human speaker. Garden rehearsal, comedic.","video_prompt":"Quick pans across the four: [Tiểu Minh Tử] stiff-dancing, [Liễu Như Yên] stomping his foot, [Trần Long] waving a drumstick, [Tiểu Thúy] puffing her cheeks."},{"scene_id":104,"original_text":"Tiết mục chúng tôi chuẩn bị có tên là: "Doraemon Và Nàng Tiên Nách Thơm" - một vở nhạc kịch kết hợp giữa múa cổ điển và... nhạc TikTok.\nKịch bản do tôi viết, lấy cảm hứng từ chính cuộc đời bi hài của mình.\nMở màn, Liễu Như Yên sẽ múa "Nghê Thường Vũ Y" uyển chuyển, tượng trưng cho nàng tiên bị dính lời nguyền hôi nách, không ai dám lại gần.\nSau đó, tôi - trong vai Thần Thú Doraemon - sẽ xuất hiện, mặc cái quần sịp Doraemon trùm ra ngoài quần lụa, tay cầm bát tỏi thần thánh, ban nước thánh cho nàng tiên.\nCuối cùng, cả hai sẽ cùng nhau nhảy bài "See Tình" phiên bản cung đình để ăn mừng nách đã thơm.\nNghe thì có vẻ điên rồ, nhưng tôi tin, với độ chịu chơi của Thái Hậu - người vừa tổ chức Đại Hội Ngửi Nách Toàn Quốc - thì tiết mục này chắc chắn sẽ gây sốt.","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Liễu Như Yên"],"image_prompt":"Storyboard-style triptych: elegant fairy dance by [Liễu Như Yên] in white; [Tiểu Minh Tử] in a homemade blue cat-print costume brandishing a garlic bowl; both dancing side by side in a playful pose. Hand-drawn look, comedic.","video_prompt":"Storyboard panels swipe in sequence: graceful dance, comic entrance with garlic bowl, then a goofy duet pose."},{"scene_id":105,"original_text":"Ngày tập đầu tiên.\nNgự Hoa Viên.\nLiễu Như Yên mặc váy trắng, bắt đầu múa. Cô ấy múa đẹp thật. Tay áo tung bay như mây, chân lướt như không chạm đất. Tôi đứng nhìn mà ngẩn ngơ, quên cả thở.","emotion":"","emotion_tag":"","characters_in_scene":["Liễu Như Yên","Tiểu Minh Tử"],"image_prompt":"[Liễu Như Yên] dancing gracefully in the garden in a white gown with long sleeves floating like clouds, feet skimming the ground; [Tiểu Minh Tử] watching entranced with an open mouth and forgotten breath. Soft golden light, petals.","video_prompt":"Sleeves flow like clouds as [Liễu Như Yên] spins; slow push-in on [Tiểu Minh Tử]'s dazed face, mouth slightly open."},{"scene_id":106,"original_text":"Đến đoạn tôi phải xuất hiện, tôi hùng hổ nhảy ra, tay bưng bát tỏi, miệng hô to:\n"Thần thú Doraemon đến đây! Yêu nghiệt hôi nách kia mau hiện nguyên hình!"\nVì quá nhập tâm, tôi trượt chân vào vũng nước Tiểu Thúy vừa tưới hoa, ngã chổng vó, cả bát tỏi úp thẳng vào mặt Liễu Như Yên.\nMặt cô ấy từ trắng chuyển sang xanh, rồi vàng khè vì tỏi.\nCô ấy vừa khóc vừa nói: "Minh công công... chàng... chàng định ướp em thành bún đậu luôn sao?"","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Liễu Như Yên"],"image_prompt":"[Tiểu Minh Tử] mid-air slipping on a puddle with legs up, a bowl of green garlic paste flying toward the face of [Liễu Như Yên], her white gown about to be splattered; then her face smeared green and yellow and eyes teary. Garden slapstick.","video_prompt":"[Tiểu Minh Tử] leaps in dramatically, slips on the puddle and tumbles; the bowl flips and splatters onto [Liễu Như Yên]'s face; she blinks tearfully."},{"scene_id":107,"original_text":"Trần Long ngồi trên ghế đá, cười như được mùa: "Hay! Hay lắm! Đoạn này nên giữ lại! Gọi là 'Doraemon ướp tiên nữ'! Thái Hậu chắc chắn sẽ cười!"\nTiểu Thúy thì hốt hải chạy đi lấy nước rửa mặt cho Liễu Như Yên, miệng lẩm bẩm: "Nô tỳ đã bảo rồi, đừng tưới hoa buổi sáng mà..."","emotion":"","emotion_tag":"","characters_in_scene":["Trần Long","Tiểu Thúy","Liễu Như Yên"],"image_prompt":"[Trần Long] on a stone bench laughing with a drumstick raised; [Tiểu Thúy] hurrying with a washbasin toward the messy [Liễu Như Yên]. Garden, comedic aftermath.","video_prompt":"[Trần Long] roars with laughter on the bench; [Tiểu Thúy] scurries with a basin, muttering."},{"scene_id":108,"original_text":"Ngày tập thứ hai.\nChúng tôi chuyển sang tập nhảy "See Tình".\nTôi bật nhạc bằng mồm: "Tình tình tình tang tang tính..."\nLiễu Như Yên thì cố gắng uốn éo theo điệu nhạc mà tôi dạy. Nhưng múa cổ điển quen rồi, bây giờ bắt cô ấy lắc hông, giật vai, đá chân kiểu TikTok, trông cô ấy cứ như một con rối bị đứt dây.\n"Không, không, Như Yên, em phải lắc mạnh hơn nữa! Lắc như kiểu em đang bị kiến cắn vào mông ấy!"\n"Nhưng... nhưng thẹn lắm ạ... Các tiểu thư khuê các không ai nhảy như vậy cả..."\n"Thẹn gì mà thẹn! Em sắp lấy một thằng thái giám rồi, còn gì để mất nữa đâu! Quẩy lên!"","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Liễu Như Yên"],"image_prompt":"[Tiểu Minh Tử] beatboxing with his mouth and coaching, arms waving energetically; [Liễu Như Yên] stiffly attempting shoulder pops like a puppet with cut strings, blushing. Garden lawn, comedic dance lesson.","video_prompt":"[Tiểu Minh Tử] bounces to his own mouth-beats; [Liễu Như Yên] jerks awkwardly like a marionette while blushing."},{"scene_id":109,"original_text":"Liễu Như Yên nghe tôi nói có lý, nhắm mắt, bắt đầu lắc điên cuồng. Kết quả là cô ấy lắc mạnh quá, cái trâm cài tóc văng ra, bay thẳng vào mặt Trần Long đang ngồi hóng.\nLong ôm mặt hét lên: "Á! Ám sát Hoàng Thượng! Có thích khách!"\nCả Ngự Hoa Viên náo loạn.","emotion":"","emotion_tag":"","characters_in_scene":["Liễu Như Yên","Trần Long"],"image_prompt":"[Liễu Như Yên] with eyes shut shaking wildly, a jade hairpin flying off her hair across the air toward [Trần Long], who clutches his face yelling with a chicken leg in hand; guards rushing. Garden uproar.","video_prompt":"[Liễu Như Yên] shakes with eyes closed; the hairpin shoots out and thunks into [Trần Long]'s face; he yelps as guards rush in."},{"scene_id":110,"original_text":"Ngày tập thứ ba, ngày cuối cùng.\nChúng tôi đã tập tành tàm tạm. Liễu Như Yên đã nhảy See Tình khá ổn, tôi thì đã học được cách không ngã khi bưng bát tỏi.\nNhưng vấn đề lớn nhất vẫn còn đó: Thừa Tướng.\nThừa Tướng Liễu Đại Nhân từ hôm ra điều kiện xong thì ngày nào cũng cho người sang do thám. Ông ta không tin một thằng thái giám dỏm như tôi có thể làm nên trò trống gì.\nChiều hôm đó, ông ta đích thân đến xem buổi tổng duyệt.","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Liễu Như Yên","Thừa Tướng"],"image_prompt":"Rehearsal: [Liễu Như Yên] dancing a decent modern step; [Tiểu Minh Tử] carrying the garlic bowl steadily; at the garden gate [Thừa Tướng] arriving with arms folded and a stern frown in the afternoon light. Comedic.","video_prompt":"[Liễu Như Yên] dances smoothly; [Tiểu Minh Tử] balances the bowl proudly; [Thừa Tướng] appears at the gate with folded arms and a slow scowl."},{"scene_id":111,"original_text":"Vừa nhìn thấy tôi mặc quần sịp Doraemon trùm ngoài quần, tay cầm bát tỏi, miệng hát "Tình tình tình tang", ông ta đã ôm ngực, suýt ngất.\n"Trời ơi! Con gái ta... con gái đệ nhất mỹ nhân của ta... lại phải nhảy cái điệu... cái điệu lắc mông như con lăng quăng với một thằng thái giám mặc sịp rách thế này sao? Gia môn bất hạnh! Gia môn bất hạnh!"\nLiễu Như Yên chạy tới ôm tay cha: "Cha! Đây là nghệ thuật đương đại ạ! Là sự kết hợp giữa Đông và Tây, giữa cổ điển và hiện đại! Minh công công nói đây là trend của tương lai ạ!"\n"Trend cái gì? Cha chỉ thấy trend này sẽ làm cha mất hết mặt mũi thôi!"","emotion":"","emotion_tag":"","characters_in_scene":["Thừa Tướng","Tiểu Minh Tử","Liễu Như Yên"],"image_prompt":"[Thừa Tướng] clutching his chest nearly fainting at the sight of [Tiểu Minh Tử] in a blue cat-print costume over his robes holding a garlic bowl; [Liễu Như Yên] running to hug her father's arm and plead. Garden, comedic drama.","video_prompt":"[Thừa Tướng] staggers and clutches his chest; [Liễu Như Yên] rushes to hold his arm and gesture earnestly; [Tiểu Minh Tử] grins nervously."},{"scene_id":112,"original_text":"Ông ta quay sang tôi, gằn giọng: "Tiểu Minh Tử! Ngày mai nếu tiết mục của ngươi mà làm Thái Hậu không vui, ta không cần đợi Thái Hậu ra tay, ta sẽ tự tay... cắt luôn cái phần còn lại của ngươi, cho ngươi thành thái giám thật luôn!"\nTôi theo phản xạ lấy tay che đũng quần, lùi lại 3 bước.\n"Thừa Tướng yên tâm! Nô tài đảm bảo Thái Hậu sẽ cười! Cười không ngậm được mồm luôn ạ!"\n"Được! Ta đợi!"","emotion":"","emotion_tag":"","characters_in_scene":["Thừa Tướng","Tiểu Minh Tử"],"image_prompt":"[Thừa Tướng] leaning forward with a menacing scowl and a pointing finger; [Tiểu Minh Tử] retreating three steps with hands protectively over his lap and a nervous grin. Garden, comedic threat.","video_prompt":"[Thừa Tướng] jabs a threatening finger; [Tiểu Minh Tử] hops back three steps with hands shielding, nodding fast."},{"scene_id":113,"original_text":"Đêm trước đại thọ.\nTôi không ngủ được. Tôi ngồi trong tẩm cung của Long, ôm chiếc khăn tay thêu Doraemon méo xệch của Như Yên, lo lắng.\nLong ngồi bên cạnh, an ủi theo kiểu rất Long:\n"Mày lo cái gì? Cùng lắm là bị cắt thôi mà! Cắt rồi thì mày thành thái giám thật, lấy vợ làm gì nữa, khỏe!"\n"Mày an ủi hay mày trù ẻo tao đấy?"\n"Tao an ủi thật mà! Mày nghĩ xem, nếu mày thành thái giám thật, thì mày sẽ là thái giám duy nhất có vợ là đệ nhất mỹ nhân! Ngầu biết bao nhiêu!"\nTôi ném cái gối vào mặt nó. Thằng bạn khốn nạn.","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Trần Long","Liễu Như Yên"],"image_prompt":"Night before the birthday feast: [Tiểu Minh Tử] hugging a lopsided embroidered Doraemon handkerchief, anxious; [Trần Long] sitting beside him offering absurd comfort; a pillow flying at [Trần Long]'s face. Candlelit bedchamber, comedic.","video_prompt":"[Tiểu Minh Tử] clutches the embroidered handkerchief anxiously; [Trần Long] gestures with mock-serious advice; a pillow smacks his face."},{"scene_id":114,"original_text":"Sáng hôm sau, đại thọ 60 của Thái Hậu.\nTừ Ninh Cung được trang hoàng lộng lẫy. Đèn lồng đỏ treo khắp nơi. Các quan đại thần, các phu nhân, các tiểu thư, ai nấy đều mặc đồ đẹp nhất, mang quà to nhất đến chúc thọ.\nThái Hậu ngồi trên cao, mặc áo bào vàng rực, đeo đầy vàng bạc châu báu, cười toe toét nhận quà.\nHoàng Thượng Trần Long ngồi bên cạnh, mặt mày căng thẳng, thỉnh thoảng lại liếc nhìn tôi ở trong cánh gà, ra hiệu "cố lên".\nĐội của tôi là tiết mục cuối cùng, áp chót, sau 20 tiết mục múa hát, đàn ca sáo nhị chán ngắt.","emotion":"","emotion_tag":"","characters_in_scene":["Thái Hậu","Trần Long","Tiểu Minh Tử"],"image_prompt":"Grand Từ Ninh Cung birthday hall with red lanterns everywhere; ministers, ladies and maidens in finest garb with big gifts; [Thái Hậu] on high in blazing gold robe and jewelry beaming; [Trần Long] tense beside her glancing toward the wings where [Tiểu Minh Tử] waits. Festive.","video_prompt":"Wide sweep across the lantern-lit hall and gift-bearing guests; [Thái Hậu] beams at gifts; [Trần Long] sneaks a thumbs-up glance toward the wings."},{"scene_id":115,"original_text":"Đến lượt chúng tôi, Quế Ma Ma hô to: "Tiết mục cuối cùng! Do Liễu tiểu thư và Minh công công đồng biểu diễn! Tên tiết mục: 'Thần Thú Doraemon và Nàng Tiên Nách Thơm'!"\nCả đại điện im lặng, rồi xôn xao. Tên tiết mục gì mà kỳ quặc vậy?\nTôi và Liễu Như Yên bước ra.\nLiễu Như Yên hôm nay đẹp lộng lẫy. Cô ấy mặc váy trắng, điểm xuyết hoa sen, trông như tiên nữ giáng trần. Còn tôi... tôi mặc bộ đồ thái giám, bên ngoài trùm cái quần sịp Doraemon màu xanh, tay bưng bát tỏi, mặt bôi nhọ nồi cho giống Doraemon.\nVừa nhìn thấy tôi, Thái Hậu đã phun luôn ngụm trà đang uống dở ra ngoài.\n"Phụt! Cái gì thế kia?"","emotion":"","emotion_tag":"","characters_in_scene":["Quế Ma Ma","Liễu Như Yên","Tiểu Minh Tử","Thái Hậu"],"image_prompt":"[Quế Ma Ma] announcing the final act; [Liễu Như Yên] radiant in a white lotus gown entering the hall; [Tiểu Minh Tử] beside her in eunuch clothes with a blue cat-print costume over them, soot-blackened face and garlic bowl; [Thái Hậu] spraying a mouthful of tea in shock. Festive hall, comedic.","video_prompt":"Murmurs ripple; the two step out; [Thái Hậu] spits her tea in a mist; [Tiểu Minh Tử] beams unfazed with his soot-smeared face."},{"scene_id":116,"original_text":"Nhạc nổi lên. À không, Tiểu Thúy đứng trong cánh gà bắt đầu hát bằng mồm: "Tùng cheng cheng cheng..."\nLiễu Như Yên bắt đầu múa. Cô ấy múa Nghê Thường Vũ Y, uyển chuyển, thướt tha. Ai cũng trầm trồ.\nRồi đến đoạn cô ấy ôm nách, mặt nhăn nhó, tỏ vẻ đau khổ vì hôi nách. Diễn xuất cực đạt.\nĐến lượt tôi xuất hiện. Tôi nhảy ra giữa sân, hét to:\n"Đừng lo! Đã có Doraemon ở đây!"","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Thúy","Liễu Như Yên","Tiểu Minh Tử"],"image_prompt":"[Tiểu Thúy] in the wings singing with puffed cheeks as a human orchestra; center stage [Liễu Như Yên] performing an elegant fairy dance then dramatically clutching her underarm in mock anguish; [Tiểu Minh Tử] leaping in from the side with a heroic pose. Festive hall.","video_prompt":"[Tiểu Thúy] sings from the wings; [Liễu Như Yên] whirls elegantly and mimes distress; [Tiểu Minh Tử] jumps in with a heroic pose and shouts."},{"scene_id":117,"original_text":"Rồi tôi bắt đầu nhảy See Tình. Vừa nhảy vừa hát, giọng the thé:\n"Tình tình tình tang tang tính, tang tình tình tang tang tang... Nách thơm thì mới có nhiều anh theo..."\nTôi vừa nhảy vừa lắc mông, vừa xoay vòng, cái quần sịp Doraemon bay phấp phới.\nCả đại điện chết lặng.\nCác quan đại thần há hốc mồm. Các phu nhân lấy quạt che miệng. Thừa Tướng thì ôm tim, sắp ngất đến nơi.","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Thừa Tướng"],"image_prompt":"[Tiểu Minh Tử] mid spin dancing a goofy hip-shaking dance, the blue cat-print costume fluttering; the hall frozen in awe: ministers gaping, ladies hiding behind fans, [Thừa Tướng] clutching his heart on the verge of fainting. Festive hall, comedic.","video_prompt":"[Tiểu Minh Tử] spins and shakes his hips as the costume flaps; the audience freezes; [Thừa Tướng] sways and clutches his heart."},{"scene_id":118,"original_text":"Nhưng rồi, một tiếng cười vang lên.\nLà Thái Hậu!\nThái Hậu ban đầu sững sờ, sau đó ôm bụng cười ngặt nghẽo, cười đến mức chảy cả nước mắt, rơi cả trâm cài đầu:\n"Ha ha ha ha! Hay! Hay quá! Cái điệu nhảy gì mà hay thế! Lắc mông hay quá! Cái quần xanh kia là cái gì mà hay thế! Ha ha ha!"\nThấy Thái Hậu cười, tất cả mọi người, dù không hiểu gì, cũng bắt đầu cười theo. Cả đại điện vang lên tiếng cười như vỡ chợ.\nLiễu Như Yên thấy Thái Hậu cười thì càng hăng, cũng bắt đầu lắc mông theo tôi, hai đứa cùng nhau nhảy See Tình giữa đại điện uy nghiêm.","emotion":"","emotion_tag":"","characters_in_scene":["Thái Hậu","Liễu Như Yên","Tiểu Minh Tử"],"image_prompt":"[Thái Hậu] doubled over laughing with tears streaming and a hairpin flying off; the whole hall bursting into laughter; [Liễu Như Yên] joining [Tiểu Minh Tử] in a goofy hip-shaking duet at center. Festive hall.","video_prompt":"[Thái Hậu] cackles with tears flying and her hairpin falls; laughter spreads across the crowd; the duet dances harder."},{"scene_id":119,"original_text":"Trần Long ngồi trên cao, không nhịn được nữa, cũng chạy xuống, nhảy cùng chúng tôi. Ba đứa, một Hoàng Thượng, một đệ nhất mỹ nhân, một thái giám dỏm mặc sịp Doraemon, cùng nhau lắc mông trước mặt toàn thể triều đình.\nQuế Ma Ma đứng bên cạnh, ban đầu còn nghiêm mặt, sau đó cũng không nhịn được, bắt đầu nhún nhảy theo nhạc.\nBuổi đại thọ 60 của Thái Hậu, trang nghiêm là thế, bỗng nhiên biến thành một sàn nhảy disco.\nThừa Tướng Liễu Đại Nhân, sau khi hết sốc, nhìn thấy con gái mình cười vui vẻ như vậy, nhìn thấy Thái Hậu cười vui vẻ như vậy, cũng bất giác mỉm cười. Ông ta thở dài, lẩm bẩm:\n"Thôi kệ... con gái vui là được... thái giám thì thái giám... dù sao thằng này cũng... cũng vui tính..."","emotion":"","emotion_tag":"","characters_in_scene":["Trần Long","Liễu Như Yên","Tiểu Minh Tử","Quế Ma Ma","Thừa Tướng"],"image_prompt":"The solemn hall transformed into a disco: [Trần Long] running down from the throne to shake his hips with [Liễu Như Yên] and [Tiểu Minh Tử]; [Quế Ma Ma] bobbing stiffly to the beat; [Thừa Tướng] in the audience with a resigned soft smile. Warm festive lighting, comedic.","video_prompt":"Camera circles the dancing trio as [Trần Long] joins in; [Quế Ma Ma] bobs; cut to [Thừa Tướng] sighing with a reluctant smile."},{"scene_id":120,"original_text":"Tiết mục kết thúc, cả ba đứa tôi thở hồng hộc, mồ hôi nhễ nhại, mùi tỏi bốc lên nồng nặc.\nThái Hậu vừa lau nước mắt vì cười quá nhiều, vừa phán:\n"Hay! Quá hay! 哀家 tổ chức 60 cái đại thọ rồi, chưa có cái nào vui như cái này! Thưởng! Thưởng lớn! Liễu Như Yên và Tiểu Minh Tử, 哀家 chuẩn y cho hai đứa thành thân! Cho hai đứa 1000 lượng vàng, một căn nhà ở phía Đông kinh thành! Và phong cho Tiểu Minh Tử làm... làm... 'Tiêu Dao Hầu'! Không cần làm thái giám nữa!"\n"Tiêu Dao Hầu?" Tôi ngơ ngác.\n"Đúng vậy! Hầu gia tự do tự tại, không cần phải hầu hạ ai cả! Chỉ cần lâu lâu vào cung nhảy See Tình cho哀家 xem là được!"","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Minh Tử","Trần Long","Liễu Như Yên","Thái Hậu"],"image_prompt":"Panting sweaty trio ([Tiểu Minh Tử], [Trần Long], [Liễu Như Yên]) bowing before [Thái Hậu], who wipes tears of laughter and makes a grand decree with an outstretched hand; a hovering scroll icon labelled with fictional court calligraphy; [Tiểu Minh Tử] confused. Festive hall.","video_prompt":"The trio pants; [Thái Hậu] wipes her eyes and decrees with an outstretched hand; [Tiểu Minh Tử] tilts his head in confusion."},{"scene_id":121,"original_text":"Tôi quỳ sụp xuống, nước mắt giàn giụa. Không phải vì được phong Hầu, mà vì...\nCuối cùng tôi cũng thoát kiếp thái giám dỏm rồi!\nKhông cần phải lo bị cắt nữa!\nVà quan trọng nhất, tôi sắp có vợ! Vợ là đệ nhất mỹ nhân!\nTrần Long chạy tới ôm chầm lấy tôi: "Chúc mừng mày nhé Minh chó! Thoát kiếp thái giám rồi! Nhớ mời tao đi đám cưới, cho tao ngồi mâm chính nhé!"\nLiễu Như Yên thì e thẹn đứng bên cạnh, dúi vào tay tôi một củ tỏi: "Chàng... chàng cầm lấy làm của hồi môn ạ..."","emotion":"","emotion_tag":"","characters_in_scene":["Tiêu Dao Hầu","Trần Long","Liễu Như Yên"],"image_prompt":"[Tiêu Dao Hầu] kneeling with a face full of tears of joy; [Trần Long] hugging him excitedly; [Liễu Như Yên] shyly pressing a garlic bulb into his hand with rosy cheeks. Festive hall, warm glow, comedic-romantic.","video_prompt":"[Tiêu Dao Hầu] drops to his knees sobbing happily; [Trần Long] tackles him in a hug; [Liễu Như Yên] shyly places the garlic in his palm."},{"scene_id":122,"original_text":"Tôi cầm củ tỏi, dở khóc dở cười.\nĐời tôi, từ một thằng IT chết vì cứu mèo, xuyên không thành thái giám dỏm mặc sịp Doraemon, đi ngửi nách 300 người, nhảy See Tình trước mặt triều đình, cuối cùng lại lấy được vợ là đệ nhất mỹ nhân bằng một củ tỏi.\nĐúng là tấu hài thật sự.\nTôi ngẩng mặt lên nhìn trời, thầm nói:\n"Mỡ ơi, mày thấy chưa? Tao sắp lấy vợ rồi đấy! Đệ nhất mỹ nhân đấy! Còn mày thì vẫn chỉ là một con mèo mập ú thôi!"\nVà ở một góc nào đó của kinh thành, con mèo Mỡ của bà Tư hàng xóm bỗng nhiên hắt xì một cái, làm đổ luôn bát cá kho.","emotion":"","emotion_tag":"","characters_in_scene":["Tiêu Dao Hầu","Mỡ"],"image_prompt":"Split composition: [Tiêu Dao Hầu] holding a garlic bulb, looking up at the night sky with a half-laughing face; in a corner rooftop of the capital [Mỡ] sneezing and knocking over a bowl of braised fish. Moonlit, comedic.","video_prompt":"[Tiêu Dao Hầu] gazes up and boasts to the sky; cut to [Mỡ] scrunching its face, sneezing, and knocking a fish bowl over."},{"scene_id":123,"original_text":"Nếu ai hỏi tôi, Trần Minh, Tiêu Dao Hầu mới nhậm chức, điều gì đáng sợ hơn cả việc bị lôi đi tịnh thân?\nTôi sẽ trả lời ngay không cần suy nghĩ: Đó là đám cưới của chính mình.\nĐặc biệt là đám cưới với đệ nhất mỹ nhân kinh thành, con gái của Thừa Tướng, được Thái Hậu đích thân đứng ra tổ chức, và được Hoàng Thượng - thằng bạn thân chí cốt của tôi - làm chủ hôn.\nNghe thì oai lắm, nhưng thực tế nó là một mớ hỗn độn.","emotion":"","emotion_tag":"","characters_in_scene":["Tiêu Dao Hầu"],"image_prompt":"[Tiêu Dao Hầu] in fresh marquis robes standing in a big red-lantern hall preparation scene, surrounded by tangled red ribbons, boxes and rushing servants, with a worried yet comic look. Festive chaos.","video_prompt":"Servants bustle in fast motion around [Tiêu Dao Hầu], who stands still with a worried expression as red ribbons tangle around his arm."},{"scene_id":124,"original_text":"Thái Hậu sau khi phong tôi làm Tiêu Dao Hầu đã phán một câu xanh rờn: "1000 lượng vàng và một căn nhà phía Đông kinh thành". Tôi tưởng là nói cho vui, ai ngờ bà làm thật.\nSáng hôm sau, một đoàn xe ngựa chở vàng, chở gỗ, chở ngói, chở luôn cả thợ xây ầm ầm kéo đến căn nhà hoang phía Đông mà Thái Hậu ban cho tôi. Căn nhà này vốn là nhà kho cũ của Bộ Hộ, chuột chạy còn vấp ngã, vậy mà chỉ trong 2 ngày, nó đã được tu sửa thành một phủ Hầu gia lộng lẫy, treo đầy chữ Hỷ đỏ chót.\nBiển hiệu trước cổng ghi 4 chữ vàng to tổ bố: "TIÊU DAO HẦU PHỦ".\nBên dưới có thêm một dòng chữ nhỏ hơn do Trần Long - Hoàng Thượng - tự tay viết thêm vào: "Chuyên trị hôi nách, ban nước thánh, nhảy See Tình thuê".\nTôi nhìn cái biển hiệu mà muốn độn thổ.","emotion":"","emotion_tag":"","characters_in_scene":["Tiêu Dao Hầu"],"image_prompt":"A convoy of horse-drawn carts with gold, timber and tiles arriving at an old warehouse being turned into a splendid marquis mansion covered in red double-happiness characters; a big golden signboard above the gate with a smaller comic line beneath; [Tiêu Dao Hầu] beneath it face-palming with embarrassment. Sunny, comedic.","video_prompt":"Carts rumble in and workers swarm; time-lapse transforms the shack into a mansion; [Tiêu Dao Hầu] looks up at the signboard and covers his face."},{"scene_id":125,"original_text":"Liễu Như Yên - vợ sắp cưới của tôi - thì lại cực kỳ háo hức. Cô ấy ngày nào cũng chạy qua phủ của tôi, chỉ đạo thợ thuyền, lúc thì bảo phải trồng thêm hoa sen, lúc thì bảo phải xây thêm một cái bể tắm to để... hai vợ chồng cùng nhau nghiên cứu thần dược khử mùi.\nTiểu Thúy - cung nữ bánh bao - cũng được Thái Hậu điều qua làm nha hoàn thân cận cho tôi. Con bé vừa quét nhà vừa lẩm bẩm: "Hầu gia oai quá, lấy được đệ nhất mỹ nhân, sau này nô tỳ được thơm lây rồi!"\nCòn Trần Long thì sao? Nó ghen tị ra mặt. Tối nào nó cũng lẻn ra khỏi cung, chạy qua nhà tôi ăn chực, vừa ăn vừa than:\n"Mày sướng nhá Minh chó! Tao làm Hoàng Thượng 3 năm, hậu cung 3000 giai lệ mà chưa được nắm tay ai, mày làm thái giám dỏm 7 ngày đã vớ được đệ nhất mỹ nhân! Đời bất công!"\nTôi an ủi nó: "Thôi, mày là Hoàng Thượng mà, thiếu gì gái! Hay mày lấy luôn 20 đứa tú nữ hôm trước đi, đứa nào cũng được tao chứng nhận thơm rồi mà!"\nLong rùng mình: "Thôi xin! 20 đứa đó đứa nào cũng hôi nách bẩm sinh, tao mà lấy về thì cung của tao thành xưởng bún đậu mất!"","emotion":"","emotion_tag":"","characters_in_scene":["Liễu Như Yên","Tiểu Thúy","Trần Long","Tiêu Dao Hầu"],"image_prompt":"Mansion courtyard: [Liễu Như Yên] directing workers and pointing at a lotus pond plan; [Tiểu Thúy] sweeping while murmuring happily; [Trần Long] in plain clothes sneaking in to eat at a table moaning dramatically at [Tiêu Dao Hầu], who consoles him. Warm dusk light, comedic.","video_prompt":"[Liễu Như Yên] points around energetically directing workers; [Tiểu Thúy] sweeps; [Trần Long] wolfs food and wails while [Tiêu Dao Hầu] pats his shoulder."},{"scene_id":126,"original_text":"Cuối cùng, ngày cưới cũng đến.\nĐám cưới của Tiêu Dao Hầu được tổ chức linh đình nhất kinh thành trong vòng 10 năm trở lại đây.\nThái Hậu ngồi kiệu vàng đến dự, mang theo 100 vò rượu ngon. Thừa Tướng Liễu Đại Nhân thì mặt mày vừa vui vừa buồn, vui vì con gái lấy chồng, buồn vì con rể là thằng thái giám dỏm vừa được phong Hầu.\nKhách khứa đến chật ních cả phủ. Ai cũng tò mò muốn xem mặt thằng thái giám dỏm nào mà lại cua được đệ nhất mỹ nhân bằng một củ tỏi và một cái quần sịp Doraemon.","emotion":"","emotion_tag":"","characters_in_scene":["Thái Hậu","Thừa Tướng"],"image_prompt":"Wedding day at the mansion: guests packing the courtyard under red lanterns and double-happiness characters; [Thái Hậu] arriving on a golden palanquin with rows of wine jars behind; [Thừa Tướng] standing with a half-happy half-sad expression. Festive, bright.","video_prompt":"Golden palanquin arrives amid firecracker smoke; guests crowd and whisper; cut to [Thừa Tướng]'s mixed happy-sad expression."},{"scene_id":127,"original_text":"Tôi mặc bộ hỷ phục đỏ chót, đội mũ cánh chuồn, trông cũng ra dáng Hầu gia lắm, nếu không tính đến việc bên trong tôi vẫn mặc cái quần sịp Doraemon thần thánh để lấy may.\nLiễu Như Yên thì đẹp như tiên nữ. Cô ấy mặc áo cưới đỏ, khăn voan che mặt, chỉ để lộ đôi mắt long lanh nhìn tôi.\nNghi thức bái đường diễn ra suôn sẻ, cho đến đoạn...\n"Nhất bái thiên địa!"\nTôi và Như Yên cúi lạy.\n"Nhị bái cao đường!"\nChúng tôi quay lại lạy Thái Hậu và Thừa Tướng đang ngồi trên cao. Thái Hậu cười toe toét, Thừa Tướng thì gật gù, vuốt râu.\n"Phu thê giao bái!"","emotion":"","emotion_tay":"","characters_in_scene":["Tiêu Dao Hầu","Liễu Như Yên","Thái Hậu","Thừa Tướng"],"image_prompt":"Traditional wedding ceremony: [Tiêu Dao Hầu] in red wedding robes with a winged official hat and [Liễu Như Yên] in a red bridal gown with a veil, bowing side by side to Heaven and Earth, then to [Thái Hậu] and [Thừa Tướng] seated above nodding. Red-gold candlelit hall.","video_prompt":"The couple bows in sync toward the altar, turns to bow to the elders; [Thái Hậu] beams and [Thừa Tướng] strokes his beard."},{"scene_id":128,"original_text":"Đây là khoảnh khắc quan trọng nhất. Tôi và Như Yên quay mặt vào nhau, chuẩn bị cúi lạy.\nNhưng vì hồi hộp quá, lại thêm bộ hỷ phục quá dài, tôi dẫm phải vạt áo của chính mình, loạng choạng ngã nhào về phía trước.\nTheo phản xạ, tôi giơ tay ra túm lấy cái gì đó để khỏi ngã.\nVà tôi túm trúng... khăn voan của Như Yên.\n"ROẸT!"\nKhăn voan bị giật phăng ra.\nChưa hết, vì tôi ngã mạnh quá, cái mũ cánh chuồn của tôi cũng văng ra, rơi thẳng vào mâm rượu cúng tổ tiên, làm đổ cả mâm rượu.\nRượu đổ lênh láng, chảy thẳng vào... bát hương đang cháy.\nLửa bùng lên!","emotion":"","emotion_tag":"","characters_in_scene":["Tiêu Dao Hầu","Liễu Như Yên"],"image_prompt":"[Tiêu Dao Hầu] tripping over his own long robe hem and tumbling forward, grabbing [Liễu Như Yên]'s veil and ripping it off; his winged hat flying into a tray of wine on the ancestral altar, spilling into an incense burner that bursts into a bright flame. Dynamic slapstick.","video_prompt":"[Tiêu Dao Hầu] trips and lunges, veil rips away; his hat spins into the wine tray; wine splashes into the incense burner and flames burst up."},{"scene_id":129,"original_text":"Cả đám cưới náo loạn.\n"Cháy! Cháy rồi! Mau dập lửa!"\nQuế Ma Ma nhanh trí nhất, cầm luôn cái phất trần của mình dập lửa, vừa dập vừa hét: "Thần thú Doraemon hiển linh! Lửa thiêng! Lửa thiêng!"\nTrần Long - chủ hôn - thì đứng hình 5 giây, rồi bỗng nhiên vỗ tay bôm bốp:\n"Hay! Hay quá! Màn này hay quá! Gọi là 'Động phòng hoa chúc lửa trại'! Rất có không khí! Rất hợp với Tiêu Dao Hầu!"\nKhách khứa thấy Hoàng Thượng vỗ tay thì cũng vỗ tay theo, ai cũng khen: "Hay! Sáng tạo! Đám cưới độc lạ nhất Đại Ngụy!"\nTôi và Như Yên thì mặt mày đen nhẻm vì khói, nhìn nhau dở khóc dở cười.\nNhư Yên nắm tay tôi, thì thầm: "Chàng... chàng có sao không?"\nTôi lắc đầu: "Không sao... chỉ hơi... hơi khét mùi tỏi thôi..."","emotion":"","emotion_tag":"","characters_in_scene":["Quế Ma Ma","Trần Long","Tiêu Dao Hầu","Liễu Như Yên"],"image_prompt":"Chaos at the altar: [Quế Ma Ma] beating the flames with her whisk shouting; [Trần Long] applauding loudly with a delighted grin while guests clap along; [Tiêu Dao Hầu] and [Liễu Như Yên] soot-blackened, holding hands and looking at each other with half-laugh half-cry. Smoke and warm firelight.","video_prompt":"[Quế Ma Ma] whips out the fire; [Trần Long] claps and the crowd applauds; smoke clears to reveal [Tiêu Dao Hầu] and [Liễu Như Yên] soot-faced, sharing a tender look."},{"scene_id":130,"original_text":"Sau màn bái đường lửa trại, chúng tôi được đưa vào động phòng.\nPhòng tân hôn được trang trí toàn màu đỏ, dán đầy chữ Hỷ, trên giường rải đầy long nhãn, hạt sen.\nTiểu Thúy và mấy nha hoàn đẩy chúng tôi vào phòng rồi đóng sầm cửa lại, còn dặn với vào: "Hầu gia, phu nhân, cố gắng sinh cho Thái Hậu 8 đứa con trai nhé! Nô tỳ ở ngoài canh cửa, không cho ai nghe lén đâu ạ!"","emotion":"","emotion_tag":"","characters_in_scene":["Tiểu Thúy","Tiêu Dao Hầu","Liễu Như Yên"],"image_prompt":"A red bridal chamber with double-happiness characters and longan and lotus seeds scattered on the bed; [Tiểu Thúy] and other maids pushing [Tiêu Dao Hầu] and [Liễu Như Yên] inside and slamming the door with cheeky grins. Warm red light, family-friendly comedic.","video_prompt":"Door swings shut with a slam; [Tiểu Thúy] presses the door from outside with a sly grin; the couple stand awkwardly inside the red room."},{"scene_id":131,"original_text":"Tôi và Như Yên ngồi trên giường, im lặng.\nĐây là lần đầu tiên trong 26 năm FA, tôi ngồi trong phòng tân hôn với một cô gái, mà lại là vợ mình.\nTim tôi đập thình thịch như trống hội.\nNhư Yên thì cúi gằm mặt, hai tay vân vê vạt áo, giọng lí nhí:\n"Minh... Minh lang... thiếp... thiếp hơi hồi hộp..."\nMinh lang? Nghe sến súa quá nhưng mà... thích!\nTôi cũng lắp bắp: "Anh... anh cũng hồi hộp..."\nIm lặng thêm 5 phút nữa. Không ai dám làm gì.","emotion":"","emotion_tag":"","characters_in_scene":["Tiêu Dao Hầu","Liễu Như Yên"],"image_prompt":"[Tiêu Dao Hầu] and [Liễu Như Yên] sitting stiffly side by side on the edge of the bridal bed, staring at their own laps; [Liễu Như Yên] twisting her sleeve, [Tiêu Dao Hầu] with a red face and a thumping heart drawn as a comic cartoon. Candle-lit, warm.","video_prompt":"Candle flicker; the two sit stiffly not looking at each other; [Liễu Như Yên] twists her sleeve; a cartoon heartbeat pulses over [Tiêu Dao Hầu]."},{"scene_id":132,"original_text":"Cuối cùng, Như Yên lấy hết can đảm, ngẩng lên nhìn tôi: "Minh lang, thiếp... thiếp đã chuẩn bị một món quà cho chàng..."\n"Quà gì?"\nCô ấy lôi từ dưới gối ra một cái hộp gỗ. Mở ra, bên trong là... một cái quần sịp mới toanh, màu xanh, thêu hình Doraemon, nhưng lần này Doraemon được thêu đẹp hơn, không còn méo xệch nữa.\n"Thiếp... thiếp tự tay thêu cho chàng đấy! Thiếp thêu suốt 3 đêm mới xong! Để... để chàng thay cái quần rách kia ra... Cái quần kia rách mông rồi, mặc hoài kỳ lắm..."","emotion":"","emotion_tag":"","characters_in_scene":["Liễu Như Yên","Tiêu Dao Hầu"],"image_prompt":"[Liễu Như Yên] shyly lifting a wooden box from under a pillow and opening it toward [Tiêu Dao Hầu]; inside a neatly folded new blue underwear with a nicely embroidered Doraemon; her cheeks rosy. Candlelit bridal chamber, sweet comedic.","video_prompt":"[Liễu Như Yên] slides the box out and opens it with shy eyes; light glints on the embroidered fabric; [Tiêu Dao Hầu] looks moved."},{"scene_id":133,"original_text":"Tôi cảm động suýt khóc. Vợ tôi thêu sịp cho tôi! Đệ nhất mỹ nhân thêu sịp cho tôi!\nTôi vội cởi cái quần sịp rách huyền thoại của mình ra, định thay cái mới.\nNhưng vừa cởi ra, tôi chợt nhớ ra một chuyện kinh khủng.\nTôi... tôi vẫn còn là... trai tân nguyên tem! À không, ý tôi là, tôi vẫn còn... còn nguyên vẹn! Mà Như Yên thì tưởng tôi là thái giám thật!\nNếu cô ấy thấy...\nTôi vội lấy chăn che lại: "Khoan... khoan đã Như Yên! Anh... anh..."\nNhư Yên đỏ mặt, quay đi: "Minh lang... chàng... chàng cứ tự nhiên... thiếp... thiếp không nhìn đâu... Dù chàng có là thái giám... thiếp cũng không chê chàng đâu..."","emotion":"","emotion_tag":"","characters_in_scene":["Tiêu Dao Hầu","Liễu Như Yên"],"image_prompt":"[Tiêu Dao Hầu] wrapped up to the chest in a red blanket with a panicked realization face, holding an old torn blue underwear aside; [Liễu Như Yên] turned away shyly with a hand over her eyes. Candlelit chamber, modest and comedic.","video_prompt":"[Tiêu Dao Hầu] grabs the blanket and clutches it up to his chest with wide eyes; [Liễu Như Yên] turns away, peeking through her fingers."},{"scene_id":134,"original_text":"Cô ấy nói vậy càng làm tôi thêm khó xử. Bây giờ mà lộ ra tôi không phải thái giám, thì tội khi quân là chém đầu cả họ!\nNhưng mà, đã là vợ chồng rồi, giấu nhau mãi sao được?\nTôi hít một hơi thật sâu, quyết định đánh cược một phen. Tôi ghé tai Như Yên, thì thầm toàn bộ sự thật: Từ việc tôi là Trần Minh xuyên không, việc tôi chưa hề tịnh thân, việc cái quần Doraemon, việc tôi và Hoàng Thượng là bạn thân...\nNhư Yên nghe xong, mắt tròn xoe, miệng há hốc, suýt hét lên, nhưng tôi kịp bịt miệng cô ấy lại.\n"Suỵt! Đừng hét! Chém đầu cả hai đứa bây giờ!"","emotion":"","emotion_tag":"","characters_in_scene":["Tiêu Dao Hầu","Liễu Như Yên"],"image_prompt":"[Tiêu Dao Hầu] whispering into [Liễu Như Yên]'s ear with a serious face; her eyes widening round, mouth open; his hand hurriedly covering her mouth with a 'shh' gesture. Candlelit chamber, comedic tension.","video_prompt":"[Tiêu Dao Hầu] whispers earnestly; [Liễu Như Yên]'s eyes grow huge; he claps a hand over her mouth and signals silence."},{"scene_id":135,"original_text":"Như Yên gỡ tay tôi ra, nhìn tôi chằm chằm từ đầu đến chân, rồi nhìn xuống chỗ tôi đang lấy chăn che, rồi bỗng nhiên... cười khúc khích.\n"Thì ra... thì ra chàng không phải thái giám thật! Thảo nào... thảo nào thiếp thấy chàng... chàng khác hẳn mấy vị công công khác! Mấy vị công công khác ai cũng... ai cũng ẻo lả, còn chàng thì... thì nam tính lắm!"\nCô ấy vừa nói vừa lấy tay che mặt, nhưng mắt thì vẫn lén nhìn qua kẽ tay.\nTôi đỏ mặt: "Vậy... vậy em không giận anh vì đã lừa em à?"\n"Giận gì chứ! Thiếp còn mừng là đằng khác! Thiếp lấy được một người chồng nguyên vẹn, chứ không phải thái giám! Vậy là thiếp... thiếp có thể sinh cho Thái Hậu 8 đứa con trai thật rồi!"\nCô ấy nói xong thì chui tọt vào chăn, trùm kín mít, chỉ để lộ đôi mắt long lanh: "Minh lang... tắt đèn đi..."","emotion":"","emotion_tag":"","characters_in_scene":["Liễu Như Yên","Tiêu Dao Hầu"],"image_prompt":"[Liễu Như Yên] giggling behind a hand while peeking through her fingers at a red-faced [Tiêu Dao Hầu]; then she dives under the blanket leaving only her sparkling eyes visible. Candlelit bridal chamber, sweet family-friendly comedy.","video_prompt":"[Liễu Như Yên] giggles and peeks through her fingers; she slides under the blanket with only bright eyes showing; [Tiêu Dao Hầu] blushes."},{"scene_id":136,"original_text":"Tôi với tay tắt đèn. Căn phòng chìm vào bóng tối, chỉ còn ánh nến đỏ lập lòe.\nBên ngoài, Trần Long và Tiểu Thúy đang ngồi canh cửa, vừa ăn hạt dưa vừa hóng.\nLong ghé tai vào cửa, lẩm bẩm: "Sao im re vậy? Không có động tĩnh gì hết? Hay là thằng Minh nó... nó vẫn còn là thái giám thật?"\nTiểu Thúy cũng ghé tai vào: "Nô tỳ cũng không nghe thấy gì ạ! Hay là Hầu gia đang... đang bôi tỏi cho phu nhân ạ?"","emotion":"","emotion_tag":"","characters_in_scene":["Trần Long","Tiểu Thúy"],"image_prompt":"Outside the closed bridal-chamber door under a lantern: [Trần Long] and [Tiểu Thúy] crouching with ears pressed to the door, cracking melon seeds and whispering, mischievous faces; faint red candlelight leaking under the door. Night, comedic.","video_prompt":"[Trần Long] and [Tiểu Thúy] lean their ears to the door, munching seeds, exchanging puzzled shrugs; the candle light under the door flickers."},{"scene_id":137,"original_text":"Bên trong phòng, tôi và Như Yên đang...\nÀ, chuyện đó thì không thể kể chi tiết được, vì kể ra sẽ bị kiểm duyệt mất.\nChỉ biết rằng, đêm đó, phủ Tiêu Dao Hầu vang lên tiếng cười khúc khích, tiếng thì thầm to nhỏ, và thỉnh thoảng là tiếng hét: "Á! Củ tỏi! Củ tỏi rớt đâu rồi!"\nSáng hôm sau, tôi bước ra khỏi phòng tân hôn với hai quầng thâm mắt còn to hơn cả hôm đi ngửi nách 300 người, nhưng mặt mày thì phởn phơ, yêu đời.\nLiễu Như Yên thì e thẹn nép sau lưng tôi, mặt đỏ như gấc.","emotion":"","emotion_tag":"","characters_in_scene":["Tiêu Dao Hầu","Liễu Như Yên"],"image_prompt":"Tasteful time-skip: the mansion at night with a closed lit window, giggles as comic sound-effect text bubbles; then morning: [Tiêu Dao Hầu] stepping out of the chamber with dark eye bags but a beaming carefree face, [Liễu Như Yên] hiding shyly behind his back with red cheeks. Soft dawn, comedic.","video_prompt":"Night shot of the window glowing with soft giggling; cut to dawn: [Tiêu Dao Hầu] strolls out grinning with eye bags, [Liễu Như Yên] tucked shyly behind him."},{"scene_id":138,"original_text":"Trần Long nhìn thấy chúng tôi thì chạy tới, vỗ vai tôi, cười gian xảo:\n"Sao rồi? Đêm qua... có... có dùng hết 1000 lượng vàng không?"\nTôi đấm nó một cái: "Dùng cái đầu mày! Biến về cung đi! Hoàng Thượng mà đi hóng chuyện phòng the của thần tử là sao?"\nThái Hậu cũng vừa tới, nhìn thấy Như Yên thì kéo lại hỏi nhỏ: "Thế nào? Con rể ta... nó... nó có còn... còn dùng được không?"\nNhư Yên đỏ mặt, gật đầu lia lịa: "Dạ... dùng tốt lắm ạ! Tốt hơn cả hàng thật ạ!"\nTôi nghe mà suýt té ngửa. Dùng tốt hơn cả hàng thật là sao?","emotion":"","emotion_tag":"","characters_in_scene":["Trần Long","Tiêu Dao Hầu","Thái Hậu","Liễu Như Yên"],"image_prompt":"Morning courtyard: [Trần Long] slapping [Tiêu Dao Hầu]'s shoulder with a sly smirk while receiving a playful punch; in the background [Thái Hậu] pulling a blushing [Liễu Như Yên] aside to whisper, her nodding vigorously. Comedic.","video_prompt":"[Trần Long] smirks and gets punched playfully; behind them [Thái Hậu] whispers to a blushing [Liễu Như Yên], who nods; [Tiêu Dao Hầu] nearly falls over."},{"scene_id":139,"original_text":"Thái Hậu nghe vậy thì cười ha hả, vỗ đùi: "Tốt! Tốt! Vậy thì 9 tháng nữa 哀家 sẽ có cháu bế! Thưởng! Thưởng thêm cho Tiêu Dao Hầu 500 lượng nữa!"\nTôi ôm đầu. Trời ơi, cái gia đình này, ai cũng mê tiền và mê cháu trai một cách kỳ lạ!\nNhưng thôi kệ, dù sao thì, từ một thằng thái giám dỏm mặc sịp rách, bây giờ tôi đã là Hầu gia có vợ đẹp, có nhà to, có 1500 lượng vàng.\nCuộc đời xuyên không tấu hài của tôi, coi như đã có một cái kết... tạm thời có hậu.\nCòn thằng bạn Trần Long thì sao? Nó vẫn đang FA, vẫn đang phải đối phó với 3000 giai lệ trong hậu cung mà nó không dám đụng vào vì sợ hôi nách.\nTôi nhìn nó, vỗ vai an ủi:\n"Thôi cố lên Long ơi! Rồi mày cũng sẽ tìm được chân ái của đời mình thôi! Như tao này!"\nLong mếu máo: "Chân ái của tao là gà rán và Liên Quân, mà ở đây không có!"","emotion":"","emotion_tag":"","characters_in_scene":["Thái Hậu","Tiêu Dao Hầu","Trần Long"],"image_prompt":"[Thái Hậu] laughing heartily and slapping her thigh with bags of gold in the foreground; [Tiêu Dao Hầu] holding his head, then patting the shoulder of a tearful [Trần Long] who whines with his lower lip out. Sunny courtyard, comedic.","video_prompt":"[Thái Hậu] laughs and gold bags pile up; [Tiêu Dao Hầu] pats [Trần Long]'s shoulder consolingly while he whimpers."},{"scene_id":140,"original_text":"Tôi cười ha hả, khoác vai nó và vợ mình, ba người cùng nhau đi ăn sáng.\nMột buổi sáng bình yên ở Đại Ngụy, với mùi tỏi thoang thoảng khắp kinh thành, và tiếng cười của ba đứa xuyên không dở hơi.\nVà ở một nơi xa xôi nào đó, con mèo Mỡ sau khi ăn vụng xong bát cá kho của bà Tư, bỗng nhiên lăn ra ngủ và mơ thấy mình được phong làm... Ngự Miêu, chuyên đi bắt chuột cho Tiêu Dao Hầu phủ, lương 10 con cá một ngày.\nCuộc đời, đúng là tấu hài thật.","emotion":"","emotion_tag":"","characters_in_scene":["Tiêu Dao Hầu","Trần Long","Liễu Như Yên","Mỡ"],"image_prompt":"[Tiêu Dao Hầu] with arms around the shoulders of [Trần Long] and [Liễu Như Yên] walking together to breakfast in a sunny street; a dream bubble in a corner of [Mỡ] sleeping belly-up with crumbs and a tiny official hat. Warm morning light, cheerful.","video_prompt":"The trio strolls arm in arm through morning sun with a light garlic breeze; cut to [Mỡ] asleep, paws twitching in a dream bubble."},{"scene_id":141,"original_text":"Người ta nói sau đám cưới là tuần trăng mật.\nVợ chồng người ta thì đi du lịch, đi ngắm trăng, đi chèo thuyền.\nVợ chồng tôi, Tiêu Dao Hầu Trần Minh và phu nhân đệ nhất mỹ nhân Liễu Như Yên, thì tuần trăng mật của chúng tôi là... mở một tiệm bún đậu mắm tôm ngay trước cổng phủ.\nChuyện là thế này.","emotion":"","emotion_tag":"","characters_in_scene":["Tiêu Dao Hầu","Liễu Như Yên"],"image_prompt":"Split visual: a romantic boat-and-moon honeymoon fantasy in a bubble versus reality: [Tiêu Dao Hầu] and [Liễu Như Yên] in aprons smiling in front of the mansion gate with a small stall. Cheerful, comedic contrast.","video_prompt":"The romantic moonlit bubble pops; camera reveals the couple in aprons setting up a stall at the gate."},{"scene_id":142,"original_text":"Sau đám cưới lửa trại huyền thoại, tôi được Thái Hậu thưởng tổng cộng 1500 lượng vàng. Một số tiền mà theo lời Tiểu Thúy nói, có thể mua được nửa cái kinh thành.\nTôi hí hửng mang vàng đi cất, định bụng sẽ sống một cuộc đời Tiêu Dao đúng nghĩa, sáng ngủ đến trưa, chiều đi chòng ghẹo Long, tối về ôm vợ.\nNhưng Liễu Như Yên, vợ tôi, thì không nghĩ vậy.","emotion":"","emotion_tag":"","characters_in_scene":["Tiêu Dao Hầu","Tiểu Thúy","Liễu Như Yên"],"image_prompt":"[Tiêu Dao Hầu] happily hauling gold chests into a storeroom with a dreamy lazy-life thought bubble (sleeping in, teasing a friend, hugging a wife); [Tiểu Thúy] wide-eyed at the gold pile; [Liễu Như Yên] in the doorway with folded arms. Sunny, comedic.","video_prompt":"[Tiêu Dao Hầu] carries a gold chest with a dreamy look; [Tiểu Thúy] gasps; [Liễu Như Yên] appears in the doorway with a firm stare."},{"scene_id":143,"original_text":"Cô ấy là con gái Thừa Tướng, từ nhỏ đã được dạy phải "tề gia trị quốc bình thiên hạ". Bây giờ lấy chồng rồi, cô ấy quyết tâm phải "tề gia" cho thật tốt.\nVà cách tề gia của cô ấy là... kiểm tra sổ sách.\n"Chàng ơi, 1500 lượng vàng này, nếu chỉ ăn không ngồi rồi thì 10 năm là hết ạ! Chúng ta phải kinh doanh!"\n"Kinh doanh gì bây giờ? Anh chỉ biết code với ngửi nách thôi, biết buôn bán gì đâu?"\nNhư Yên suy nghĩ một lúc, rồi mắt sáng rực lên: "Chúng ta mở tiệm bún đậu mắm tôm đi!"","emotion":"","emotion_tag":"","characters_in_scene":["Liễu Như Yên","Tiêu Dao Hầu"],"image_prompt":"[Liễu Như Yên] sitting at a desk with an abacus and thick account books, pointing decisively; [Tiêu Dao Hầu] shrugging helplessly; then a lightbulb glow in her eyes. Study room, comedic.","video_prompt":"[Liễu Như Yên] clicks abacus beads and turns pages briskly; [Tiêu Dao Hầu] shrugs; her eyes flash bright with an idea."},{"scene_id":144,"original_text":""Bún đậu mắm tôm? Ở Đại Ngụy có món đó à?"\n"Chưa có! Nhưng sau Đại Hội Ngửi Nách Toàn Quốc, cả kinh thành này ai cũng biết đến mùi tỏi và mắm tôm của chàng rồi! Hôm trước em đi chợ, nghe mấy bà bán cá nói là thèm bún đậu mà không có chỗ nào bán! Chúng ta mở tiệm, chắc chắn sẽ đắt khách!"\nTôi nghe cũng có lý. Món bún đậu mắm tôm ở thế giới hiện đại là món tủ của tôi. Mỗi lần thất tình là tôi lại rủ thằng Long đi ăn bún đậu, ăn xong là hết buồn.\n"Được! Mở thì mở! Nhưng ai làm mắm tôm?"\n"Em làm được! Hồi nhỏ em có học lỏm của bà vú! Với lại, chúng ta còn có bí kíp Thần Dược Khử Mùi Doraemon của chàng mà! Cho thêm tỏi vào mắm tôm thì... bá cháy!"","emotion":"","emotion_tag":"","characters_in_scene":["Tiêu Dao Hầu","Liễu Như Yên"],"image_prompt":"[Liễu Như Yên] enthusiastic and gesturing while [Tiêu Dao Hầu] thoughtfully nods, a memory bubble showing a modern bún đậu plate with tofu, vermicelli and shrimp paste; a busy fish market glimpsed in another bubble. Cozy room, comedic.","video_prompt":"[Liễu Như Yên] speaks brightly; a thought bubble shows a sizzling bún đậu platter; [Tiêu Dao Hầu] nods slowly with a growing smile."},{"scene_id":145,"original_text":"Và thế là, Tiêu Dao Hầu phủ, đáng lẽ phải là nơi ở của một vị Hầu gia oai phong, bỗng nhiên biến thành một quán bún đậu.\nTấm biển "TIÊU DAO HẦU PHỦ" vẫn treo đó, nhưng bên dưới, tôi cho treo thêm một tấm biển nhỏ hơn, do chính tay Trần Long - Hoàng Thượng - viết bằng bút lông: "CHUYÊN BÚN ĐẬU MẮM TÔM GIA TRUYỀN - KHỬ MÙI HÔI NÁCH MIỄN PHÍ - MUA 1 TẶNG 1 CỦ TỎI"","emotion":"","emotion_tag":"","characters_in_scene":["Tiêu Dao Hầu","Trần Long"],"image_prompt":"The mansion gate turned into a bún đậu stall with woks and bamboo trays; the golden signboard above and a smaller brush-calligraphy sign hung beneath it; [Trần Long] proudly finishing the last brush stroke while [Tiêu Dao Hầu] hangs the sign. Sunny, comedic.","video_prompt":"[Tiêu Dao Hầu] hangs the smaller sign; [Trần Long] dips a brush and finishes a stroke with a flourish; steam rises from the stalls."},{"scene_id":146,"original_text":"Ngày khai trương, cả kinh thành kéo đến.\nNgười ta đến không phải vì thèm bún đậu, mà vì tò mò muốn xem Hầu gia và đệ nhất mỹ nhân bán bún đậu trông như thế nào.\nThái Hậu cũng đến. Bà đi kiệu vàng đến, vừa bước xuống đã hét to: "Cho哀家 một suất bún đậu full topping, nhiều mắm tôm, nhiều tỏi! Ăn xong 哀家 mới có sức đi tuyển thêm tú nữ cho Hoàng Thượng!"\nThừa Tướng cha vợ tôi cũng đến, vuốt râu cười khà khà: "Con rể, cho ta một suất mang về cho các quan trong triều nếm thử! Để cho bọn họ biết, con rể ta không chỉ biết ngửi nách mà còn biết làm bún đậu!"","emotion":"","emotion_tag":"","characters_in_scene":["Thái Hậu","Thừa Tướng"],"image_prompt":"Grand-opening crowd packing the street outside the mansion, curious faces craning; [Thái Hậu] stepping down from a golden palanquin shouting her order; [Thừa Tướng] stroking his beard and chuckling. Sunny, festive.","video_prompt":"Crowd swarms the entrance; [Thái Hậu] steps out of the palanquin and bellows; [Thừa Tướng] strokes his beard and laughs."},{"scene_id":147,"original_text":"Đắt khách nhất là Trần Long. Nó dẫn theo cả đội Ngự Lâm Quân đến ăn, vừa ăn vừa la:\n"Ngon! Ngon quá! Món này mà có thêm gà rán nữa thì đúng là mỹ vị nhân gian! Minh chó, cho tao thêm một suất nữa! Ghi sổ nợ cho trẫm!"\nTôi vừa rán đậu, vừa chiên chả cốm, vừa pha mắm tôm, mồ hôi nhễ nhại, trông chẳng khác gì một thằng bán bún đậu thực thụ, chứ không phải Hầu gia gì cả.\nLiễu Như Yên thì nhanh nhẹn bưng bê, miệng cười toe toét, thỉnh thoảng lại lén lút đút cho tôi một miếng đậu rán.\nTiểu Thúy thì đứng ở cửa rao to: "Bún đậu đây! Bún đậu Tiêu Dao Hầu đây! Ăn vào là thơm nách, may mắn, sinh 8 con trai đây!"","emotion":"","emotion_tag":"","characters_in_scene":["Trần Long","Tiêu Dao Hầu","Liễu Như Yên","Tiểu Thúy"],"image_prompt":"Busy stall scene: [Trần Long] with imperial guards eating heartily and waving a bowl for more; [Tiêu Dao Hầu] sweating while frying tofu and mixing shrimp paste; [Liễu Như Yên] serving quickly and secretly feeding him a piece of tofu; [Tiểu Thúy] at the door shouting to passersby. Steam, sunlight.","video_prompt":"Sizzling oil; [Tiêu Dao Hầu] flips tofu sweating; [Liễu Như Yên] darts between tables and sneaks him a bite; [Trần Long] bangs his bowl for more."},{"scene_id":148,"original_text":"Quán bún đậu của chúng tôi nổi tiếng đến mức, chỉ sau 3 ngày, cả kinh thành đều biết đến câu slogan: "Muốn thơm nách, ăn bún đậu Tiêu Dao Hầu".\nThậm chí, có một bà cụ 70 tuổi, hôi nách 50 năm, sau khi ăn bún đậu của chúng tôi xong, đã hết hôi nách và còn... lấy được chồng mới.\nChuyện này đồn ra, quán của tôi càng đắt khách hơn. Người ta đến ăn không phải vì đói, mà vì muốn chữa hôi nách.\nTôi từ Ngửi Nách Đại Tổng Quản, bây giờ kiêm luôn chức danh "Thần Y Bún Đậu".","emotion":"","emotion_tag":"","characters_in_scene":["Tiêu Dao Hầu"],"image_prompt":"Montage of a long queue outside the shop, a slogan banner fluttering, a cheerful old woman in a wedding-red headscarf holding a bowl beside a smiling elderly man; [Tiêu Dao Hầu] in an apron with a 'divine doctor' pose, ladle raised. Sunny, comedic.","video_prompt":"Queue snakes down the street; the elderly woman beams beside a new husband; [Tiêu Dao Hầu] lifts his ladle like a doctor's scepter."},{"scene_id":149,"original_text":"Nhưng cuộc đời tấu hài thì không bao giờ để cho tôi yên ổn quá 3 ngày.\nTối ngày thứ 4 sau khai trương, khi chúng tôi đang ngồi đếm tiền - à nhầm, đếm lượng vàng thu được từ bán bún đậu - thì Quế Ma Ma đột nhiên xuất hiện, mặt mày nghiêm trọng.\n"Tiêu Dao Hầu, Liễu phu nhân, Thái Hậu có懿 chỉ, mời hai vị vào cung gấp! Có chuyện đại sự!"\nTôi và Như Yên nhìn nhau, lo lắng. Chuyện đại sự gì mà phải mời vào cung lúc nửa đêm thế này?","emotion":"","emotion_tag":"","characters_in_scene":["Tiêu Dao Hầu","Liễu Như Yên","Quế Ma Ma"],"image_prompt":"Night in the shop's counting room: [Tiêu Dao Hầu] and [Liễu Như Yên] counting gold at a table by lamplight; [Quế Ma Ma] suddenly standing in the doorway with a grave face and a scroll; the couple looking up in alarm. Dramatic lamp shadows.","video_prompt":"Gold clinks; [Quế Ma Ma]'s shadow falls across the table; the couple look up; she speaks solemnly."},{"scene_id":150,"original_text":"Vào đến Từ Ninh Cung, chúng tôi thấy Thái Hậu đang ngồi trên sập, mặt mày ủ rũ, không còn vẻ vui tươi như mọi khi. Bên cạnh là Trần Long, mặt cũng bí xị như vừa bị tịch thu hết gà rán.\n" Mẫu hậu, có chuyện gì vậy ạ?" Như Yên lo lắng hỏi.\nThái Hậu thở dài thườn thượt: "Như Yên à, con có biết không, từ ngày thằng Long nó lên làm Hoàng Thượng,哀家 đã tuyển cho nó 3000 tú nữ rồi, mà nó không chịu đụng vào đứa nào cả! Nó cứ nói là... là hôi nách!"\nLong cúi gằm mặt, lí nhí: "Mẫu hậu, nhi thần... nhi thần bị ám ảnh mùi tỏi rồi..."","emotion":"","emotion_tag":"","characters_in_scene":["Thái Hậu","Trần Long","Liễu Như Yên","Tiêu Dao Hầu"],"image_prompt":"Từ Ninh Cung at night: [Thái Hậu] slumped on the couch with a gloomy face; [Trần Long] beside her looking down like a scolded child; [Liễu Như Yên] and [Tiêu Dao Hầu] entering worried. Lamplit, comedic-melancholy.","video_prompt":"[Thái Hậu] sighs heavily; [Trần Long] hangs his head with a mumble; [Liễu Như Yên] steps forward with concern."},{"scene_id":151,"original_text":""Thì cũng tại thằng Minh nhà con đấy!" Thái Hậu chỉ tay vào tôi. "Từ ngày nó tổ chức cái Đại Hội Ngửi Nách, cả hậu cung của哀家 ai cũng bốc mùi tỏi! Hoàng Thượng nó ngửi riết nó sợ luôn rồi! Bây giờ 哀家 60 tuổi rồi mà chưa có cháu bế! 哀家 sắp xuống lỗ rồi mà chưa được bế cháu!"\nBà vừa nói vừa lấy khăn chấm nước mắt.\nTôi và Như Yên nhìn nhau. Thì ra đây là chuyện đại sự.","emotion":"","emotion_tag":"","characters_in_scene":["Thái Hậu","Tiêu Dao Hầu","Liễu Như Yên"],"image_prompt":"[Thái Hậu] pointing accusingly at [Tiêu Dao Hầu] then dabbing tears with a handkerchief; [Tiêu Dao Hầu] and [Liễu Như Yên] exchanging bemused glances. Lamplit hall, comedic.","video_prompt":"[Thái Hậu] jabs a finger, then dabs her eyes with a handkerchief; the couple share a bemused glance."},{"scene_id":152,"original_text":"Thái Hậu bỗng nhiên ngẩng lên, nhìn thẳng vào bụng của Như Yên, mắt sáng rực lên:\n"Cho nên,哀家 đã quyết định! Từ nay, hai vợ chồng con phải... phải sinh cho哀家 8 đứa cháu! Mỗi năm một đứa! 8 năm 8 đứa!"\nTôi suýt té ngửa.\n"8 đứa ạ? Thái Hậu, 8 đứa thì... thì nhiều quá ạ! Nô tài... à nhầm, thần... thần làm không nổi ạ!"\n"Không nổi cũng phải nổi! Con là Tiêu Dao Hầu, con có thần thú Doraemon, con có nước thánh! Chuyện sinh con đối với con là dễ như ăn bún đậu thôi!"","emotion":"","emotion_tag":"","characters_in_scene":["Thái Hậu","Tiêu Dao Hầu","Liễu Như Yên"],"image_prompt":"[Thái Hậu] snapping her head up with glittering eyes toward [Liễu Như Yên]; [Tiêu Dao Hầu] staggering back with disbelief and eight cartoon baby silhouettes lined up in a thought bubble. Lamplit hall, comedic.","video_prompt":"[Thái Hậu]'s eyes gleam; [Tiêu Dao Hầu] staggers backward and a bubble of eight babies pops up; [Liễu Như Yên] blushes."},{"scene_id":153,"original_text":"Liễu Như Yên thì đỏ bừng mặt, cúi gằm xuống, tay vân vê vạt áo.\nTrần Long ngồi bên cạnh thì thầm vào tai tôi: "Thấy chưa, tao đã bảo rồi mà! Mẹ tao mê cháu trai lắm! Mày mà không sinh được 8 đứa thì bả sẽ bắt mày... bắt mày mở thêm 8 tiệm bún đậu nữa đấy!"\nTôi rùng mình. Mở một tiệm đã mệt bở hơi tai rồi, mở thêm 8 tiệm nữa thì chắc tôi chết vì ngửi mùi mắm tôm mất!\nThái Hậu thấy tôi im lặng thì tưởng tôi không đồng ý, bèn tung ra chiêu cuối:\n"Nếu hai đứa đồng ý sinh 8 đứa cho哀家,哀家 sẽ ban cho hai đứa... 10000 lượng vàng nữa! Và phong cho Như Yên làm Nhất Phẩm Phu Nhân! Và cho phép hai đứa... không cần phải vào cung nhảy See Tình nữa!"","emotion":"","emotion_tag":"","characters_in_scene":["Liễu Như Yên","Trần Long","Tiêu Dao Hầu","Thái Hậu"],"image_prompt":"[Liễu Như Yên] blushing with head bowed twisting her sleeve; [Trần Long] whispering slyly into [Tiêu Dao Hầu]'s ear who shudders; [Thái Hậu] playing her final card with a triumphant, extended palm. Lamplit hall, comedic.","video_prompt":"[Trần Long] whispers to a shuddering [Tiêu Dao Hầu]; [Thái Hậu] leans forward with a triumphant smile and opens her hand like a merchant."},{"scene_id":154,"original_text":"10000 lượng vàng!\nNhất Phẩm Phu Nhân!\nKhông cần nhảy See Tình!\nBa điều kiện này, điều nào cũng hấp dẫn chết người!\nLiễu Như Yên nghe thấy 10000 lượng vàng thì mắt sáng rực lên. Cô ấy vốn là con gái Thừa Tướng, nhưng từ nhỏ đã thích tự mình kiếm tiền. Bây giờ có 10000 lượng, cô ấy có thể mở thêm 100 tiệm bún đậu nữa!\nCòn tôi, nghe đến "không cần nhảy See Tình nữa" thì mừng như bắt được vàng. Cuối cùng cũng thoát được kiếp làm cây hài cho Thái Hậu!\nHai vợ chồng tôi nhìn nhau, gật đầu lia lịa:\n"Thần... thần đồng ý ạ!"\n"Con dâu... con dâu cũng đồng ý ạ!"","emotion":"","emotion_tag":"","characters_in_scene":["Liễu Như Yên","Tiêu Dao Hầu"],"image_prompt":"Gold coin symbols flashing in [Liễu Như Yên]'s glittering eyes with tiny shop icons popping around her; [Tiêu Dao Hầu] with a joyful face and a crossed-out dancing icon; both nodding eagerly toward the camera. Comedic dual thought bubbles.","video_prompt":"Coin icons whirl in [Liễu Như Yên]'s eyes; [Tiêu Dao Hầu] cheers silently as a dancing icon is crossed out; the couple nod together."},{"scene_id":155,"original_text":"Thái Hậu cười ha hả, vỗ đùi đen đét: "Tốt! Tốt lắm! Vậy thì bắt đầu từ đêm nay đi! Quế Ma Ma, mang rượu hợp cẩn và... và 10 củ tỏi tăng lực vào cho Tiêu Dao Hầu!"\n10 củ tỏi tăng lực?\nTôi và Như Yên nhìn nhau, mặt mày méo xệch.\nĐêm đó, trên đường về phủ, Như Yên nắm tay tôi, thì thầm:\n"Minh lang, 8 đứa... nhiều quá nhỉ? Hay là... mình sinh 2 đứa trước, rồi tính tiếp?"\nTôi ôm cô ấy vào lòng: "Ừ, sinh 2 đứa trước đã! Một đứa giống em, xinh như tiên nữ, một đứa giống anh... à, giống anh thì đừng, giống anh thì lại phải mặc sịp Doraemon rách thì khổ!"\nNhư Yên bật cười khúc khích, đánh yêu vào ngực tôi.","emotion":"","emotion_tag":"","characters_in_scene":["Thái Hậu","Quế Ma Ma","Tiêu Dao Hầu","Liễu Như Yên"],"image_prompt":"[Thái Hậu] slapping her thigh in delight while [Quế Ma Ma] carries a tray of garlic bulbs and wine; then a moonlit lane where [Tiêu Dao Hầu] holds [Liễu Như Yên] in a hug as she playfully taps his chest, giggling. Warm and cozy, comedic.","video_prompt":"[Thái Hậu] cackles; [Quế Ma Ma] presents a tray of garlic; cut to a moonlit lane: the couple hug and [Liễu Như Yên] taps his chest laughing."},{"scene_id":156,"original_text":"Trần Long đi đằng sau, nhìn thấy cảnh đó thì thở dài, ngửa mặt lên trời than:\n"Trời ơi, tại sao thằng bạn thân của con lại có vợ đẹp, có 10000 lượng vàng, còn con là Hoàng Thượng mà vẫn phải FA, tối nào cũng phải ôm gối ngủ một mình vậy trời? Bất công quá!"\nTiểu Thúy đi bên cạnh, an ủi: "Hoàng Thượng đừng buồn ạ! Nô tỳ... nô tỳ sẽ... sẽ bóc tỏi cho người ăn ạ!"\nLong nhìn Tiểu Thúy, rồi nhìn đống tỏi trên tay con bé, bỗng nhiên nảy ra một ý tưởng:\n"Ê Tiểu Thúy, hay là... hay là trẫm phong cho em làm... làm phi tần nhé? Phi tần chuyên bóc tỏi cho trẫm?"\nTiểu Thúy đỏ mặt, làm rơi cả rổ tỏi xuống đất.","emotion":"","emotion_tag":"","characters_in_scene":["Trần Long","Tiểu Thúy"],"image_prompt":"Moonlit lane behind the couple: [Trần Long] gazing up and wailing to the sky; [Tiểu Thúy] beside him holding a basket of garlic and consoling shyly; then [Trần Long] with a lightbulb idea and [Tiểu Thúy] blushing, the basket falling and garlic rolling on the ground.","video_prompt":"[Trần Long] wails at the moon; [Tiểu Thúy] offers comfort; his eyes light up with an idea; she blushes and the garlic basket tumbles."},{"scene_id":157,"original_text":"Đêm đó, kinh thành Đại Ngụy có 3 người không ngủ được.\nMột là tôi, vì đang lo lắng không biết làm sao để sinh được 8 đứa con.\nHai là Liễu Như Yên, vì đang tính toán xem 10000 lượng vàng thì mở được bao nhiêu tiệm bún đậu.\nBa là Trần Long, Hoàng Thượng, vì đang suy nghĩ xem có nên lấy một cung nữ chuyên bóc tỏi làm phi tần hay không.\nVà ở một góc nào đó của Tiêu Dao Hầu phủ, con mèo Mỡ - không biết từ đâu chui ra, có lẽ là do bà Tư hàng xóm cũng xuyên không theo - đang ngồi chễm chệ trên đống vàng 1500 lượng, liếm mông và kêu "meo" một tiếng đầy mãn nguyện.\nCuộc sống tấu hài của Tiêu Dao Hầu Trần Minh, xem ra, mới chỉ bắt đầu.\nCòn 8 đứa con nữa đang đợi ở phía trước!\nTôi ôm đầu, vừa khóc vừa cười.\nĐời đúng là... tấu hài thật sự.","emotion":"","emotion_tag":"","characters_in_scene":["Tiêu Dao Hầu","Liễu Như Yên","Trần Long","Mỡ"],"image_prompt":"Triptych at night: [Tiêu Dao Hầu] staring at the ceiling worried in bed; [Liễu Như Yên] at a desk clicking an abacus with shop icons; [Trần Long] in the palace pondering with a garlic clove; plus [Mỡ] sitting smugly on a pile of gold in the mansion's storeroom. Moonlit, comedic.","video_prompt":"Three quick cuts of sleepless figures; final cut: [Mỡ] licks its rear on the gold pile and gives a satisfied meow; [Tiêu Dao Hầu] holds his head laughing and crying."},{"scene_id":158,"original_text":"Người ta nói, thời gian thấm thoắt thoi đưa.\nĐối với tôi, Trần Minh, Tiêu Dao Hầu, chủ tiệm bún đậu mắm tôm nổi tiếng nhất Đại Ngụy, thời gian 5 năm trôi qua nhanh như một cái chớp mắt, hay chính xác hơn là nhanh như lúc tôi tụt quần cho Quế Ma Ma kiểm tra.\n5 năm trước, tôi chỉ là một thằng thái giám dỏm mặc sịp Doraemon rách, ngày ngày lo giữ tem, lo bị cắt.\n5 năm sau, tôi đã là một người đàn ông thành đạt, có vợ đẹp, có... 4 đứa con.","emotion":"","emotion_tag":"","characters_in_scene":["Tiêu Dao Hầu"],"image_prompt":"Time-lapse style: calendar pages flipping and seasons cycling around the mansion shop gate; in the middle [Tiêu Dao Hầu], now a slightly more mature and confident-looking man in a marquis robe with an apron, smiling. Warm nostalgic tone.","video_prompt":"Calendar pages and seasons spin in fast time-lapse around the gate; [Tiêu Dao Hầu] stands still and smiles; the light warms."},{"scene_id":159,"original_text":"Đúng vậy, 4 đứa, chứ không phải 8 đứa như Thái Hậu yêu cầu.\nChuyện là thế này.\nSau khi Thái Hậu ra chỉ tiêu 8 đứa cháu trong 8 năm, tôi và Như Yên đã rất cố gắng. Cố gắng đến mức Tiểu Thúy phải ngày nào cũng nấu 10 món bổ thận tráng dương cho tôi, nào là ba hầm tỏi, nào là gà tần mắm tôm.\nKết quả của sự cố gắng đó là...","emotion":"","emotion_tag":"","characters_in_scene":["Tiêu Dao Hầu","Liễu Như Yên","Tiểu Thúy","Thái Hậu"],"image_prompt":"[Tiểu Thúy] carrying a large tray of ten tonic dishes with garlic stews to a weary [Tiêu Dao Hầu] at a dining table; [Liễu Như Yên] encouraging him; a small floating quote-icon of [Thái Hậu]'s eight-baby quota. Cozy kitchen, comedic.","video_prompt":"[Tiểu Thúy] sets down dish after dish as [Tiêu Dao Hầu] stares wearily; [Liễu Như Yên] pats his back encouragingly."},{"scene_id":160,"original_text":"Năm thứ nhất, Như Yên sinh đôi. Hai thằng cu sinh đôi, giống hệt nhau, mặt mày lanh lợi, vừa ra đời đã không khóc mà lại... hắt xì một cái rõ to vì ngửi thấy mùi tỏi trên người tôi. Thái Hậu mừng quá, đặt tên luôn là Đại Lang và Nhị Lang, thưởng cho hai vợ chồng tôi thêm 2000 lượng vàng.\nNăm thứ hai, Như Yên lại sinh đôi tiếp. Lần này là hai cô công chúa, xinh như hoa, da trắng như tuyết. Vừa ra đời đã biết nắm lấy cái quần sịp Doraemon của tôi mà giật giật. Thái Hậu lại mừng, đặt tên là Tam Nương và Tứ Nương, thưởng thêm 2000 lượng nữa.\n4 đứa trong 2 năm. Tốc độ này, nếu cứ tiếp tục, thì 8 đứa trong 4 năm là chuyện nhỏ.","emotion":"","emotion_tag":"","characters_in_scene":["Liễu Như Yên","Tiêu Dao Hầu","Đại Lang","Nhị Lang","Tam Nương","Tứ Nương","Thái Hậu"],"image_prompt":"Two-panel family scene: first, newborn identical twin boys ([Đại Lang] and [Nhị Lang]) sneezing at the garlic smell on [Tiêu Dao Hầu], [Liễu Như Yên] resting; second, newborn twin girls ([Tam Nương] and [Tứ Nương]) tugging at a blue underwear held by [Tiêu Dao Hầu]; [Thái Hậu] overjoyed with gold. Warm, cozy, comedic.","video_prompt":"Newborn twins sneeze in unison; cut: the baby girls tug at blue cloth in [Tiêu Dao Hầu]'s hand; [Thái Hậu] pours coins with joy."},{"scene_id":161,"original_text":"Nhưng đến năm thứ 3, Như Yên bỗng nhiên tuyên bố:\n"Em đình công!"\n"Đình công gì?"\n"Đình công sinh đẻ! 2 năm 4 đứa, em mệt chết đi được! Chàng có biết mang nặng đẻ đau nó khổ thế nào không? Chàng chỉ biết ăn bún đậu với ngửi nách thôi!"\nTôi ôm vợ dỗ dành: "Thôi mà, Thái Hậu còn đang đợi 4 đứa nữa mà..."\n"Thái Hậu đợi thì để Thái Hậu tự sinh đi! Em không sinh nữa! Em muốn đi kinh doanh! Tiệm bún đậu của chúng ta bây giờ đã có 10 chi nhánh rồi, em phải đi quản lý!"","emotion":"","emotion_tag":"","characters_in_scene":["Liễu Như Yên","Tiêu Dao Hầu"],"image_prompt":"[Liễu Như Yên] planting her hands on her hips and declaring a strike with a determined face, a small banner reading a strike slogan; [Tiêu Dao Hầu] hugging her from behind coaxingly. Mansion sitting room, comedic.","video_prompt":"[Liễu Như Yên] stomps and raises a fist in protest; [Tiêu Dao Hầu] tries to hug and coax her, but she shrugs him off."},{"scene_id":162,"original_text":"Và thế là, từ một đệ nhất mỹ nhân chỉ biết múa hát, Như Yên đã trở thành một nữ doanh nhân thành đạt, bà chủ của chuỗi cửa hàng "Bún Đậu Tiêu Dao Hầu - Thơm Nách Thơm Cả Đời", nổi tiếng khắp Đại ếp, nơi đang rán đậu, và... gắp luôn một miếng chả cốm to tướng.\nTôi và Như Yên nhìn nhau, tròn mắt.\n"Tiểu Thúy, con mèo này ở đâu ra vậy?"\n"Dạ, nó tự đi vào phủ mình ạ! Nó cứ ngồi trước cổng kêu meo meo mãi, nô tỳ thấy tội nên cho nó vào ạ! Mà lạ lắm Hầu gia, nó cứ nhìn Hầu gia chằm chằm rồi kêu, như là quen biết Hầu gia vậy ạ!"","emotion":"","emotion_tag":"","characters_in_scene":["Mỡ","Tiêu Dao Hầu","Liễu Như Yên","Tiểu Thúy"],"image_prompt":"[Mỡ] leaping off and striding disdainfully into the kitchen, snatching a big piece of fried herb-patty from the pan; [Tiêu Dao Hầu] and [Liễu Như Yên] staring in astonishment; [Tiểu Thúy] explaining with hand gestures. Kitchen with steam, comedic.","video_prompt":"[Mỡ] meows scornfully, jumps down and swipes a fried patty from the pan; the couple watch open-mouthed while [Tiểu Thúy] explains."},{"scene_id":165,"original_text":"Tôi bế con mèo Mỡ lên, nhìn thẳng vào mắt nó. Mắt nó vẫn vênh váo như ngày nào.\n"Mỡ, có phải mày không? Mày còn nhớ tao không? Tao là thằng sen hèn mọn đã cứu mày khỏi cái cống rồi té chết đây!"\nCon mèo Mỡ không trả lời, chỉ lấy chân cào cào vào túi áo của tôi. Trong túi áo tôi có... một củ tỏi.\nNó giật lấy củ tỏi, nhai ngấu nghiến, rồi bỗng nhiên...\nNó nói được!\n"Sen kia! Cuối cùng cũng tìm thấy ngươi rồi!"\nTôi suýt làm rơi luôn hai đứa con đang bế trên tay.","emotion":"","emotion_tag":"","characters_in_scene":["Tiêu Dao Hầu","Mỡ"],"image_prompt":"[Tiêu Dao Hầu] holding [Mỡ] at eye level with an earnest face; [Mỡ] pawing at his pocket, grabbing a garlic bulb and chewing it; a golden shimmer around its mouth as speech-bubble text appears; [Tiêu Dao Hầu] nearly dropping the twin toddlers at his side in shock. Courtyard, comedic-magic.","video_prompt":"[Mỡ] claws at the pocket, snatches the garlic and gnaws; a golden shimmer flashes as it speaks; [Tiêu Dao Hầu] jolts and fumbles."},{"scene_id":166,"original_text":""Mày... mày biết nói?"\n"Tao là Thần Mèo của thế giới này chứ mèo thường à? Chính n."},{"scene_id":168,"original_text":"Tôi chưa kịp trả lời thì ngoài cổng, một tiếng hô vang lên:\n"Hoàng Thượng giá lâm! Thái Hậu giá lâm!"\nTrần Long và Thái Hậu cùng nhau đến. Bây giờ Long đã khác xưa nhiều lắm. Nó không còn là thằng Hoàng Thượng FA nữa, vì 2 năm trước, nó đã... lấy Tiểu Thúy làm Hoàng Hậu.\nĐúng vậy, Hoàng Hậu chuyên bóc tỏi. Sau một thời gian Tiểu Thúy ngày nào cũng bóc tỏi cho Long ăn bún đậu, Long đã phải lòng cô bé bánh bao thật thà đó. Hai người lấy nhau, bây giờ đã có một đứa con trai, đặt tên là Tiểu Tỏi.","emotion":"","emotion_tag":"","characters_in_scene":["Trần Long","Thái Hậu","Tiểu Thúy"],"image_prompt":"Gate herald calling as [Trần Long] and [Thái Hậu] arrive together on foot in splendor; [Tiểu Thúy], now dressed as an empress in a gentle green-gold gown, beside [Trần Long] carrying a garlic basket, both looking content. Sunny, comedic-warm.","video_prompt":"Gate doors open to a herald's call; [Trần Long] and [Thái Hậu] enter; [Tiểu Thúy] smiles proudly beside [Trần Long] with a garlic basket."},{"scene_id":169,"original_text":"Thái Hậu thì đã già hơn một chút, nhưng vẫn còn minh mẫn lắm. Bà vừa vào đã bế luôn hai đứa cháu sinh đôi của tôi lên, hôn lấy hôn để:\n"Cháu yêu của bà! Cháu yêu của bà! Lại đây bà cho kẹo tỏi nào!"\nCả nhà đang vui vẻ sum họp thì con mèo Mỡ bỗng nhiên nhảy lên bàn, kêu to:\n"Meo! Đã đến lúc rồi! Cổng xuyên không sắp đóng rồi! Trần Minh, ngươi có muốn về không? Nếu không về bây giờ thì sẽ phải ở lại đây mãi mãi đấy!"\nCả nhà im lặng, nhìn con mèo biết nói, rồi nhìn tôi.","emotion":"","emotion_tag":"","characters_in_scene":["Thái Hậu","Đại Lang","Nhị Lang","Mỡ","Tiêu Dao Hầu"],"image_prompt":"[Thái Hậu], slightly more aged but still radiant, hugging and kissing the twin boys [Đại Lang] and [Nhị Lang] while holding garlic candy; [Mỡ] leaping onto the table and shouting; everyone's heads turning to [Tiêu Dao Hầu]. Family gathering in mansion hall.","video_prompt":"[Thái Hậu] smooches the twin boys; [Mỡ] leaps o
