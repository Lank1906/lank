<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Satisfying Effect</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #000;
}

canvas {
    width: 100vw;
    height: 100vh;

    display: block;

    cursor: none;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


let W;
let H;


function resize() {

    W =
        canvas.width =
        window.innerWidth *
        devicePixelRatio;

    H =
        canvas.height =
        window.innerHeight *
        devicePixelRatio;


    canvas.style.width =
        window.innerWidth + "px";

    canvas.style.height =
        window.innerHeight + "px";


    ctx.scale(
        devicePixelRatio,
        devicePixelRatio
    );

    W = window.innerWidth;
    H = window.innerHeight;
}


resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   MOUSE
===================================================== */

const mouse = {

    x: W / 2,
    y: H / 2,

    px: W / 2,
    py: H / 2,

    vx: 0,
    vy: 0,

    active: false
};


window.addEventListener(
    "mousemove",
    e => {

        mouse.px =
            mouse.x;

        mouse.py =
            mouse.y;


        mouse.x =
            e.clientX;

        mouse.y =
            e.clientY;


        mouse.vx =
            mouse.x -
            mouse.px;


        mouse.vy =
            mouse.y -
            mouse.py;


        mouse.active = true;
    }
);


/* =====================================================
   PARTICLES
===================================================== */

const particles = [];

const COUNT = 900;


for (
    let i = 0;
    i < COUNT;
    i++
) {

    particles.push({

        x:
            Math.random() * W,

        y:
            Math.random() * H,

        vx: 0,
        vy: 0,

        size:
            .5 +
            Math.random() * 2,

        life:
            Math.random(),

        hue:
            175 +
            Math.random() * 80
    });
}


/* =====================================================
   BURSTS
===================================================== */

const bursts = [];


window.addEventListener(
    "mousedown",
    e => {

        /*
            Click tạo vụ nổ
        */

        for (
            let i = 0;
            i < 160;
            i++
        ) {

            const angle =
                Math.random() *
                Math.PI *
                2;


            const speed =
                2 +
                Math.random() *
                9;


            bursts.push({

                x: e.clientX,

                y: e.clientY,

                vx:
                    Math.cos(angle) *
                    speed,

                vy:
                    Math.sin(angle) *
                    speed,

                life: 1,

                size:
                    1 +
                    Math.random() * 3,

                hue:
                    170 +
                    Math.random() * 100
            });
        }
    }
);


/* =====================================================
   DRAW BACKGROUND
===================================================== */

function background() {

    /*
        Không clear hoàn toàn.

        Tạo motion trail.
    */

    ctx.fillStyle =
        "rgba(0,0,0,.13)";


    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


/* =====================================================
   MAIN PARTICLES
===================================================== */

function updateParticles(time) {

    ctx.save();

    ctx.globalCompositeOperation =
        "lighter";


    for (
        const p of particles
    ) {

        /*
            Khoảng cách tới chuột
        */

        const dx =
            mouse.x -
            p.x;

        const dy =
            mouse.y -
            p.y;


        const dist =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        /*
            VÙNG HÚT
        */

        if (
            mouse.active &&
            dist < 260
        ) {

            const force =
                (
                    1 -
                    dist / 260
                );


            /*
                Attraction
            */

            p.vx +=
                dx *
                force *
                .0009;


            p.vy +=
                dy *
                force *
                .0009;


            /*
                Xoáy

                Đây là phần làm
                chuyển động "liquid".
            */

            p.vx +=
                -dy *
                force *
                .00045;


            p.vy +=
                dx *
                force *
                .00045;
        }


        /*
            Mouse velocity truyền vào
            particle
        */

        if (
            mouse.active &&
            dist < 120
        ) {

            p.vx +=
                mouse.vx *
                .015;

            p.vy +=
                mouse.vy *
                .015;
        }


        /*
            Friction
        */

        p.vx *= .965;
        p.vy *= .965;


        /*
            Move
        */

        p.x +=
            p.vx;

        p.y +=
            p.vy;


        /*
            Wrap
        */

        if (
            p.x < -20
        )
            p.x = W + 20;


        if (
            p.x > W + 20
        )
            p.x = -20;


        if (
            p.y < -20
        )
            p.y = H + 20;


        if (
            p.y > H + 20
        )
            p.y = -20;


        /*
            Twinkle
        */

        const alpha =
            .25 +
            (
                Math.sin(
                    time * .004 +
                    p.x * .01
                ) + 1
            ) *
            .18;


        ctx.fillStyle =
            `hsla(
                ${p.hue},
                100%,
                65%,
                ${alpha}
            )`;


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    ctx.restore();
}


/* =====================================================
   BURST UPDATE
===================================================== */

function updateBursts() {

    ctx.save();

    ctx.globalCompositeOperation =
        "lighter";


    for (
        let i =
        bursts.length - 1;

        i >= 0;

        i--
    ) {

        const p =
            bursts[i];


        /*
            Gravity
        */

        p.vy +=
            .035;


        /*
            Move
        */

        p.x +=
            p.vx;

        p.y +=
            p.vy;


        /*
            Friction
        */

        p.vx *=
            .985;

        p.vy *=
            .985;


        /*
            Fade
        */

        p.life *=
            .965;


        if (
            p.life < .02
        ) {

            bursts.splice(
                i,
                1
            );

            continue;
        }


        /*
            Draw
        */

        ctx.fillStyle =
            `hsla(
                ${p.hue},
                100%,
                70%,
                ${p.life}
            )`;


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    ctx.restore();
}


/* =====================================================
   LIQUID CORE
===================================================== */

function liquidCore(time) {

    if (
        !mouse.active
    )
        return;


    const speed =
        Math.sqrt(
            mouse.vx *
            mouse.vx +
            mouse.vy *
            mouse.vy
        );


    /*
        Core chỉ hiện khi chuột di chuyển
    */

    const radius =
        30 +
        Math.min(
            speed * 1.5,
            35
        );


    const gradient =
        ctx.createRadialGradient(
            mouse.x,
            mouse.y,
            0,
            mouse.x,
            mouse.y,
            radius
        );


    gradient.addColorStop(
        0,
        "rgba(255,255,255,.9)"
    );


    gradient.addColorStop(
        .12,
        "rgba(100,245,255,.8)"
    );


    gradient.addColorStop(
        .35,
        "rgba(0,180,255,.25)"
    );


    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    ctx.save();

    ctx.globalCompositeOperation =
        "lighter";


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        mouse.x - radius,
        mouse.y - radius,
        radius * 2,
        radius * 2
    );


    ctx.restore();
}


/* =====================================================
   CURSOR RING
===================================================== */

function cursor(time) {

    if (
        !mouse.active
    )
        return;


    const pulse =
        1 +
        Math.sin(
            time * .01
        ) * .1;


    ctx.save();

    ctx.globalCompositeOperation =
        "lighter";


    ctx.strokeStyle =
        "rgba(100,240,255,.7)";


    ctx.lineWidth =
        1;


    ctx.beginPath();

    ctx.arc(
        mouse.x,
        mouse.y,
        12 * pulse,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    ctx.restore();
}


/* =====================================================
   ANIMATION
===================================================== */

function animate(time) {

    background();

    updateParticles(time);

    updateBursts();

    liquidCore(time);

    cursor(time);


    requestAnimationFrame(
        animate
    );
}


animate(0);

</script>

</body>
</html>
