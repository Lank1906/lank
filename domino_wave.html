<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #080808;
  display: flex;
  justify-content: center;
  align-items: center;
}

canvas {
  width: min(90vw, 700px);
  height: min(90vw, 700px);
}
</style>
</head>

<body>

<canvas width="700" height="700"></canvas>

<script>

const canvas = document.querySelector("canvas");
const ctx = canvas.getContext("2d");

const width = canvas.width;
const height = canvas.height;


/* =========================
   BASIC
========================= */

const randomRange = (min, max) =>
  Math.random() * (max - min) + min;

const mapRange = (
  value,
  inMin,
  inMax,
  outMin,
  outMax
) => {
  return outMin +
    ((value - inMin) * (outMax - outMin)) /
    (inMax - inMin);
};


/* =========================
   SMOOTH NOISE
========================= */

function noise2D(x, y, frequency = 1) {

  function hash(ix, iy) {

    let h =
      ix * 374761393 +
      iy * 668265263 +
      1337 * 1446649;

    h = (h ^ (h >> 13)) * 1274126177;

    return ((h ^ (h >> 16)) >>> 0) / 4294967295;
  }

  function fade(t) {

    return t * t * t *
      (t * (t * 6 - 15) + 10);
  }

  function lerp(a, b, t) {

    return a + (b - a) * t;
  }

  x *= frequency;
  y *= frequency;

  const x0 = Math.floor(x);
  const y0 = Math.floor(y);

  const x1 = x0 + 1;
  const y1 = y0 + 1;

  const sx = fade(x - x0);
  const sy = fade(y - y0);

  const n00 = hash(x0, y0);
  const n10 = hash(x1, y0);
  const n01 = hash(x0, y1);
  const n11 = hash(x1, y1);

  const ix0 = lerp(n00, n10, sx);
  const ix1 = lerp(n01, n11, sx);

  return lerp(ix0, ix1, sy);
}


/* =========================
   EASING
========================= */

function easeOutCubic(t) {

  t = Math.max(0, Math.min(1, t));

  return 1 - Math.pow(1 - t, 3);
}

function easeInOut(t) {

  t = Math.max(0, Math.min(1, t));

  return t < 0.5
    ? 2 * t * t
    : 1 - Math.pow(-2 * t + 2, 2) / 2;
}


/* =========================
   DOMINO
========================= */

class Domino {

  constructor(x, y, col, row) {

    this.x = x;
    this.y = y;

    this.col = col;
    this.row = row;

    this.baseAngle = 0;

    this.angle = 0;

    this.size = 8;

    /*
      Mỗi domino có delay riêng.
      Noise làm delay hơi biến dạng.
    */

    const n =
      noise2D(
        col,
        row,
        0.12
      );

    this.delay =
      n * 80;

    this.scale =
      randomRange(
        0.8,
        1.25
      );
  }


  update(time, wave) {

    /*
      Khoảng cách từ tâm sóng
    */

    const dx =
      this.col - wave.x;

    const dy =
      this.row - wave.y;

    const distance =
      Math.sqrt(
        dx * dx +
        dy * dy
      );


    /*
      Wave front
    */

    const localTime =
      time -
      wave.start -
      distance * 65 -
      this.delay;


    /*
      Wave gồm 2 phase:

      1. ngã xuống
      2. dựng lại
    */

    const duration = 700;

    let progress =
      localTime / duration;


    if (progress < 0) {

      this.angle = 0;

      return;
    }


    if (progress > 1) {

      this.angle = 0;

      return;
    }


    /*
      0 → 1 → 0

      tạo animation ngã
      rồi dựng lại
    */

    let waveValue;

    if (progress < 0.5) {

      waveValue =
        easeOutCubic(
          progress * 2
        );

    } else {

      waveValue =
        easeInOut(
          (progress - 0.5) * 2
        );

      waveValue =
        1 - waveValue;
    }


    /*
      góc nghiêng
    */

    this.angle =
      waveValue *
      Math.PI *
      0.48;
  }


  draw() {

    ctx.save();

    ctx.translate(
      this.x,
      this.y
    );

    /*
      Domino hơi xoay
      theo vị trí
    */

    const tilt =
      Math.sin(
        this.angle
      );


    ctx.rotate(
      this.angle
    );


    /*
      bóng dưới chân
    */

    ctx.beginPath();

    ctx.ellipse(
      0,
      5,
      this.size * 0.9,
      this.size * 0.35,
      0,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "rgba(255,255,255,0.08)";

    ctx.fill();


    /*
      thân domino
    */

    const h = 24 * this.scale;
    const w = 5 * this.scale;

    ctx.beginPath();

    ctx.roundRect(
      -w / 2,
      -h,
      w,
      h,
      3
    );

    ctx.fillStyle =
      "#eeeeee";

    ctx.fill();


    /*
      viền
    */

    ctx.lineWidth = 1;

    ctx.strokeStyle =
      "#444";

    ctx.stroke();


    ctx.restore();
  }
}


/* =========================
   GRID
========================= */

const dominoes = [];

const cols = 48;
const rows = 48;

const spacing = 13;

const gridWidth =
  (cols - 1) * spacing;

const gridHeight =
  (rows - 1) * spacing;

const offsetX =
  (width - gridWidth) / 2;

const offsetY =
  (height - gridHeight) / 2;


for (let row = 0; row < rows; row++) {

  for (let col = 0; col < cols; col++) {

    const x =
      offsetX +
      col * spacing;

    const y =
      offsetY +
      row * spacing;

    dominoes.push(
      new Domino(
        x,
        y,
        col,
        row
      )
    );
  }
}


/* =========================
   WAVES
========================= */

let waves = [];

function createWave(x, y) {

  /*
    Convert pixel → grid
  */

  const gx =
    (x - offsetX) /
    spacing;

  const gy =
    (y - offsetY) /
    spacing;


  waves.push({
    x: gx,
    y: gy,
    start: performance.now()
  });
}


/*
  Wave đầu tiên
*/

createWave(
  cols * 0.5 * spacing + offsetX,
  rows * 0.5 * spacing + offsetY
);


/* =========================
   AUTO WAVES
========================= */

let lastWave = performance.now();

const waveInterval = 3500;


/* =========================
   CLICK
========================= */

canvas.addEventListener(
  "click",
  e => {

    const rect =
      canvas.getBoundingClientRect();

    const x =
      (e.clientX - rect.left) *
      canvas.width /
      rect.width;

    const y =
      (e.clientY - rect.top) *
      canvas.height /
      rect.height;

    createWave(x, y);
  }
);


/* =========================
   ANIMATION
========================= */

function animate(time) {

  /*
    background
  */

  ctx.fillStyle =
    "#080808";

  ctx.fillRect(
    0,
    0,
    width,
    height
  );


  /*
    tự tạo wave mới
  */

  if (
    time - lastWave >
    waveInterval
  ) {

    const randomX =
      randomRange(
        width * 0.25,
        width * 0.75
      );

    const randomY =
      randomRange(
        height * 0.25,
        height * 0.75
      );

    createWave(
      randomX,
      randomY
    );

    lastWave = time;
  }


  /*
    Chỉ giữ wave gần nhất
  */

  if (waves.length > 4) {

    waves.shift();
  }


  /*
    update + draw
  */

  for (const domino of dominoes) {

    /*
      Nếu nhiều wave,
      lấy wave gần nhất
      đang tác động.
    */

    let activeWave = null;

    for (const wave of waves) {

      const dx =
        domino.col -
        wave.x;

      const dy =
        domino.row -
        wave.y;

      const distance =
        Math.sqrt(
          dx * dx +
          dy * dy
        );

      const localTime =
        time -
        wave.start -
        distance * 65;

      if (
        localTime > 0 &&
        localTime < 900
      ) {

        activeWave = wave;
      }
    }


    if (activeWave) {

      domino.update(
        time,
        activeWave
      );

    } else {

      domino.angle = 0;
    }


    domino.draw();
  }


  requestAnimationFrame(
    animate
  );
}


requestAnimationFrame(
  animate
);

</script>

</body>
</html>
