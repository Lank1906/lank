<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>✦ Lank — Creative Coding</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{

    --bg:#050712;

    --text:#f8fafc;
    --muted:#8b96aa;

    --blue:#60a5fa;
    --purple:#a78bfa;
    --pink:#f472b6;

    --border:rgba(255,255,255,.09);

}


/* =========================================================
   BODY
========================================================= */

html{
    scroll-behavior:smooth;
}

body{

    min-height:100vh;

    overflow-x:hidden;

    color:var(--text);

    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:#050712;

}


/* =========================================================
   STAR CANVAS
========================================================= */

#space{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    z-index:-10;

    pointer-events:none;

}


/* =========================================================
   AMBIENT GLOW
========================================================= */

.ambient{

    position:fixed;

    width:500px;
    height:500px;

    border-radius:50%;

    pointer-events:none;

    filter:blur(100px);

    opacity:.12;

    z-index:-5;

    animation:
        ambientMove 15s ease-in-out infinite alternate;

}

.ambient.one{

    background:#2563eb;

    left:-200px;
    top:-180px;

}

.ambient.two{

    background:#9333ea;

    right:-220px;
    top:25%;

    animation-delay:-5s;

}

.ambient.three{

    background:#ec4899;

    left:30%;
    bottom:-350px;

    animation-delay:-9s;

}


@keyframes ambientMove{

    from{
        transform:translate(0,0) scale(1);
    }

    to{
        transform:translate(80px,40px) scale(1.2);
    }

}


/* =========================================================
   MOUSE GLOW
========================================================= */

#cursorGlow{

    position:fixed;

    width:300px;
    height:300px;

    border-radius:50%;

    pointer-events:none;

    z-index:20;

    transform:
        translate(-50%,-50%);

    background:

        radial-gradient(
            circle,
            rgba(96,165,250,.11),
            transparent 65%
        );

    opacity:0;

    transition:
        opacity .3s;

}


/* =========================================================
   APP
========================================================= */

.app{

    width:
        min(
            1200px,
            calc(100% - 30px)
        );

    margin:auto;

    padding:
        55px 0 80px;

}


/* =========================================================
   HERO
========================================================= */

.hero{

    min-height:390px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    position:relative;

}


/* =========================================================
   ORBIT
========================================================= */

.orbit{

    width:110px;
    height:110px;

    position:absolute;

    border:
        1px solid
        rgba(147,197,253,.15);

    border-radius:50%;

    animation:
        orbitRotate 15s linear infinite;

}


.orbit::before{

    content:"";

    position:absolute;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#60a5fa;

    box-shadow:
        0 0 15px #60a5fa,
        0 0 30px #60a5fa;

    top:-3px;
    left:50%;

}


.orbit::after{

    content:"✦";

    position:absolute;

    inset:0;

    display:grid;

    place-items:center;

    color:white;

    font-size:26px;

    text-shadow:
        0 0 20px #60a5fa;

}


@keyframes orbitRotate{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   BADGE
========================================================= */

.badge{

    margin-top:155px;

    padding:
        7px 13px;

    border:
        1px solid
        var(--border);

    border-radius:999px;

    background:
        rgba(255,255,255,.035);

    backdrop-filter:
        blur(10px);

    color:#c4b5fd;

    font-size:11px;

    letter-spacing:2px;

    text-transform:uppercase;

}


.badge span{

    display:inline-block;

    width:6px;
    height:6px;

    margin-right:7px;

    border-radius:50%;

    background:#34d399;

    box-shadow:
        0 0 10px #34d399;

    animation:
        pulse 1.8s ease-in-out infinite;

}


@keyframes pulse{

    0%,100%{
        opacity:.5;
        transform:scale(.8);
    }

    50%{
        opacity:1;
        transform:scale(1.2);
    }

}


/* =========================================================
   TITLE
========================================================= */

h1{

    margin-top:20px;

    font-size:
        clamp(
            45px,
            8vw,
            82px
        );

    line-height:.95;

    letter-spacing:-5px;

    background:

        linear-gradient(
            110deg,
            #fff 10%,
            #93c5fd 35%,
            #c4b5fd 60%,
            #f9a8d4 90%
        );

    background-size:200% auto;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:
        gradientText 8s linear infinite;

}


@keyframes gradientText{

    to{
        background-position:200% center;
    }

}


.hero p{

    max-width:560px;

    margin-top:20px;

    color:var(--muted);

    font-size:15px;

    line-height:1.7;

}


/* =========================================================
   SCROLL INDICATOR
========================================================= */

.scroll{

    position:absolute;

    bottom:20px;

    color:#475569;

    font-size:11px;

    letter-spacing:2px;

    text-transform:uppercase;

}


.scroll::after{

    content:"";

    display:block;

    width:1px;
    height:35px;

    margin:
        9px auto 0;

    background:
        linear-gradient(
            #64748b,
            transparent
        );

}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{

    display:flex;

    gap:12px;

    margin-bottom:20px;

}


.search{

    flex:1;

    position:relative;

}


.search input{

    width:100%;

    height:50px;

    padding:
        0 80px 0 45px;

    border:
        1px solid
        var(--border);

    outline:none;

    border-radius:15px;

    color:white;

    background:
        rgba(15,23,42,.65);

    backdrop-filter:
        blur(14px);

    transition:.2s;

}


.search input:focus{

    border-color:
        rgba(96,165,250,.5);

    box-shadow:
        0 0 0 4px
        rgba(96,165,250,.07);

}


.search::before{

    content:"⌕";

    position:absolute;

    left:17px;
    top:50%;

    transform:
        translateY(-50%);

    color:#64748b;

    font-size:22px;

}


.shortcut{

    position:absolute;

    right:12px;
    top:50%;

    transform:
        translateY(-50%);

    padding:
        4px 7px;

    border:
        1px solid
        var(--border);

    border-radius:6px;

    color:#64748b;

    font-size:11px;

}


.stats{

    min-width:105px;

    height:50px;

    display:flex;

    align-items:center;

    justify-content:center;

    border:
        1px solid
        var(--border);

    border-radius:15px;

    background:
        rgba(255,255,255,.035);

    color:#64748b;

    font-size:12px;

}


.stats strong{

    color:white;

    margin-right:4px;

    font-size:16px;

}


/* =========================================================
   GRID
========================================================= */

.grid{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(240px,1fr)
        );

    gap:16px;

}


/* =========================================================
   CARD
========================================================= */

.card{

    --mx:50%;
    --my:50%;
    --rx:0deg;
    --ry:0deg;
    --card-color:#60a5fa;

    position:relative;

    min-height:185px;

    padding:20px;

    overflow:hidden;

    isolation:isolate;

    border:
        1px solid
        var(--border);

    border-radius:20px;

    color:white;

    text-decoration:none;

    background:
        linear-gradient(
            145deg,
            rgba(25,32,53,.78),
            rgba(9,13,27,.82)
        );

    backdrop-filter:
        blur(14px);

    transform:

        perspective(900px)

        rotateX(var(--rx))
        rotateY(var(--ry))

        translateY(0);

    transform-style:preserve-3d;

    transition:

        transform .12s ease-out,
        border-color .25s,
        box-shadow .25s;

    animation:
        cardIn .45s ease both;

}


@keyframes cardIn{

    from{

        opacity:0;

        transform:
            perspective(900px)
            translateY(25px)
            scale(.97);

    }

    to{

        opacity:1;

        transform:
            perspective(900px)
            translateY(0)
            scale(1);

    }

}


/* CARD MOUSE LIGHT */

.card::before{

    content:"";

    position:absolute;

    inset:0;

    z-index:-1;

    background:

        radial-gradient(
            circle 150px at
            var(--mx) var(--my),
            color-mix(
                in srgb,
                var(--card-color) 18%,
                transparent
            ),
            transparent 70%
        );

    opacity:.9;

}


/* TOP GLOW */

.card::after{

    content:"";

    position:absolute;

    width:100px;
    height:100px;

    right:-50px;
    top:-50px;

    border-radius:50%;

    background:
        var(--card-color);

    filter:blur(50px);

    opacity:.08;

    z-index:-2;

}


.card:hover{

    border-color:
        color-mix(
            in srgb,
            var(--card-color) 45%,
            transparent
        );

    box-shadow:

        0 25px 60px
        rgba(0,0,0,.4),

        0 0 30px
        color-mix(
            in srgb,
            var(--card-color) 8%,
            transparent
        );

}


/* =========================================================
   CARD CONTENT
========================================================= */

.card-top{

    display:flex;

    justify-content:space-between;

    align-items:center;

}


.icon{

    width:44px;
    height:44px;

    display:grid;

    place-items:center;

    border-radius:13px;

    color:
        var(--card-color);

    font-size:20px;

    background:
        color-mix(
            in srgb,
            var(--card-color) 13%,
            transparent
        );

    border:
        1px solid
        color-mix(
            in srgb,
            var(--card-color) 22%,
            transparent
        );

    transform:
        translateZ(20px);

}


.open{

    color:#475569;

    font-size:20px;

    transform:
        translateZ(20px);

    transition:.2s;

}


.card:hover .open{

    color:
        var(--card-color);

    transform:
        translateZ(20px)
        translate(3px,-3px);

}


.card h2{

    margin-top:20px;

    font-size:17px;

    font-weight:650;

    letter-spacing:-.3px;

    transform:
        translateZ(18px);

}


.card p{

    margin-top:8px;

    color:var(--muted);

    font-size:13px;

    line-height:1.5;

    transform:
        translateZ(12px);

}


/* =========================================================
   BOTTOM LINE
========================================================= */

.card-line{

    position:absolute;

    left:20px;
    right:20px;
    bottom:17px;

    height:1px;

    overflow:hidden;

    background:
        rgba(255,255,255,.05);

}


.card-line::after{

    content:"";

    display:block;

    width:35%;

    height:100%;

    background:
        var(--card-color);

    box-shadow:
        0 0 10px
        var(--card-color);

    transform:
        translateX(-150%);

    transition:
        transform .5s ease;

}


.card:hover .card-line::after{

    transform:
        translateX(300%);

}


/* =========================================================
   MESSAGE
========================================================= */

.message{

    grid-column:1/-1;

    padding:70px 20px;

    text-align:center;

    color:#64748b;

    border:
        1px dashed
        var(--border);

    border-radius:20px;

}


.loader{

    width:28px;
    height:28px;

    margin:
        0 auto 15px;

    border:
        2px solid
        rgba(255,255,255,.08);

    border-top-color:
        var(--blue);

    border-radius:50%;

    animation:
        spin .7s linear infinite;

}


@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    margin-top:55px;

    padding-top:25px;

    border-top:
        1px solid
        rgba(255,255,255,.05);

    display:flex;

    justify-content:space-between;

    color:#475569;

    font-size:11px;

}


.footer b{

    color:#64748b;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .app{

        width:
            calc(100% - 22px);

        padding-top:25px;

    }


    .hero{

        min-height:350px;

    }


    h1{

        font-size:48px;

        letter-spacing:-3px;

    }


    .toolbar{

        flex-direction:column;

    }


    .stats{

        width:100%;

    }


    .grid{

        grid-template-columns:1fr;

    }


    .footer{

        flex-direction:column;

        gap:8px;

        text-align:center;

    }

}


/* =========================================================
   REDUCE MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{

        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;

        transition-duration:.01ms !important;

    }

}

</style>

</head>

<div class="app">

<script>

/* =========================================================
   CONFIG
========================================================= */

const OWNER = "Lank1906";

const REPO = "lank";

const BRANCH = "main";


const IGNORE = new Set([
    "index.html"
]);


/* =========================================================
   ELEMENTS
========================================================= */

const grid =
    document.getElementById("grid");

const search =
    document.getElementById("search");

const count =
    document.getElementById("count");

const cursorGlow =
    document.getElementById("cursorGlow");


let projects = [];


/* =========================================================
   STAR FIELD
========================================================= */

/*
    Chỉ dùng 70 particles.

    Canvas duy nhất.

    Không tạo DOM.

    Rất nhẹ.
*/

const canvas =
    document.getElementById("space");

const ctx =
    canvas.getContext("2d");


let stars = [];

let width;
let height;


function resizeCanvas(){

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    stars = [];


    const amount =
        Math.min(
            80,
            Math.floor(
                width * height / 14000
            )
        );


    for(let i=0;i<amount;i++){

        stars.push({

            x:
                Math.random()*width,

            y:
                Math.random()*height,

            r:
                Math.random()*1.2+.2,

            alpha:
                Math.random()*.6+.15,

            speed:
                Math.random()*.12+.03

        });

    }

}


function drawStars(time){

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    for(const star of stars){

        /*
            Chuyển động cực chậm.
        */

        star.y += star.speed;


        if(star.y > height){

            star.y = -2;

        }


        const twinkle =
            star.alpha +
            Math.sin(
                time*.001 +
                star.x
            )*.12;


        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.r,
            0,
            Math.PI*2
        );


        ctx.fillStyle =
            `rgba(180,210,255,${twinkle})`;

        ctx.fill();

    }


    requestAnimationFrame(drawStars);

}


resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);

requestAnimationFrame(
    drawStars
);


/* =========================================================
   CURSOR GLOW
========================================================= */

window.addEventListener(
    "pointermove",
    event => {

        cursorGlow.style.opacity = "1";

        cursorGlow.style.left =
            event.clientX + "px";

        cursorGlow.style.top =
            event.clientY + "px";

    }
);


/* =========================================================
   ICON
========================================================= */

function getIcon(name){

    const n =
        name.toLowerCase();


    if(
        n.includes("heart") ||
        n.includes("love")
    )
        return "❤️";


    if(
        n.includes("clock") ||
        n.includes("time")
    )
        return "◷";


    if(
        n.includes("game") ||
        n.includes("oan")
    )
        return "🎮";


    if(
        n.includes("slide")
    )
        return "◈";


    if(
        n.includes("todo")
    )
        return "✓";


    if(
        n.includes("noise")
    )
        return "〰";


    if(
        n.includes("draw")
    )
        return "✎";


    if(
        n.includes("text")
    )
        return "Aa";


    if(
        n.includes("form")
    )
        return "⌨";


    if(
        n.includes("3d")
    )
        return "◇";


    return "✦";

}


/* =========================================================
   COLOR
========================================================= */

function getColor(index){

    const colors = [

        "#60a5fa",
        "#a78bfa",
        "#f472b6",
        "#34d399",
        "#fbbf24",
        "#fb7185",
        "#22d3ee"

    ];


    return colors[
        index %
        colors.length
    ];

}


/* =========================================================
   TITLE
========================================================= */

function makeTitle(filename){

    return filename

        .replace(
            /\.html$/i,
            ""
        )

        .replace(
            /[-_]+/g,
            " "
        )

        .replace(
            /\b\w/g,
            char =>
                char.toUpperCase()
        );

}


/* =========================================================
   DESCRIPTION
========================================================= */

function makeDescription(filename){

    const descriptions = {

        "3d_slide_rotate_animation.html":
            "Hiệu ứng slide 3D và chuyển động không gian.",

        "600toeic.html":
            "Flashcard từ vựng TOEIC.",

        "daystreak.html":
            "Theo dõi chuỗi ngày và thử thách.",

        "todo.html":
            "Danh sách công việc.",

        "bezier.html":
            "Thử nghiệm đường cong Bezier.",

        "clock.html":
            "Đồng hồ thời gian thực.",

        "drawing.html":
            "Canvas freestyle và creative coding.",

        "heart.html":
            "Hiệu ứng trái tim và particle.",

        "noise-random.html":
            "Thí nghiệm noise và random.",

        "oan_tu_ti.html":
            "Game oẳn tù tì bằng JavaScript.",

        "text-typing.html":
            "Hiệu ứng text typing."

    };


    return (
        descriptions[
            filename.toLowerCase()
        ]
        ||
        "Creative coding experiment."
    );

}


/* =========================================================
   LOAD PROJECTS
========================================================= */

async function loadProjects(){

    try{

        const api =
            `https://api.github.com/repos/` +
            `${OWNER}/${REPO}/contents/` +
            `?ref=${BRANCH}`;


        const response =
            await fetch(api);


        if(!response.ok){

            throw new Error(
                `GitHub API ${response.status}`
            );

        }


        const files =
            await response.json();


        projects =
            files

            .filter(file =>

                file.type === "file" &&

                /\.html$/i.test(
                    file.name
                ) &&

                !IGNORE.has(
                    file.name.toLowerCase()
                )

            )

            .sort(
                (a,b) =>
                    a.name.localeCompare(
                        b.name
                    )
            );


        render();


    }catch(error){

        console.error(error);


        grid.innerHTML = `

            <div class="message">

                ⚠️ Không thể tải project.

                <br><br>

                <small>
                    ${error.message}
                </small>

            </div>

        `;

    }

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    const keyword =
        search.value
            .trim()
            .toLowerCase();


    const filtered =
        projects.filter(
            project =>
                project.name
                    .toLowerCase()
                    .includes(keyword)
        );


    /*
        Counter.
    */

    animateCounter(
        filtered.length
    );


    if(
        filtered.length === 0
    ){

        grid.innerHTML = `

            <div class="message">

                Không tìm thấy project nào.

            </div>

        `;

        return;

    }


    grid.innerHTML =

        filtered

        .map(
            (project,index) => {

                const color =
                    getColor(index);


                return `

                <a
                    class="card"
                    href="./${encodeURI(project.name)}"
                    style="
                        --card-color:${color};
                        animation-delay:${Math.min(index*35,500)}ms;
                    "
                >

                    <div class="card-top">

                        <div class="icon">

                            ${getIcon(
                                project.name
                            )}

                        </div>

                        <div class="open">
                            ↗
                        </div>

                    </div>


                    <h2>

                        ${makeTitle(
                            project.name
                        )}

                    </h2>


                    <p>

                        ${makeDescription(
                            project.name
                        )}

                    </p>


                    <div class="card-line"></div>

                </a>

                `;

            }
        )

        .join("");


    enableTilt();

}


/* =========================================================
   CARD TILT
========================================================= */

function enableTilt(){

    const cards =
        document.querySelectorAll(
            ".card"
        );


    cards.forEach(card => {

        card.addEventListener(
            "pointermove",
            event => {

                const rect =
                    card.getBoundingClientRect();


                const x =
                    event.clientX -
                    rect.left;


                const y =
                    event.clientY -
                    rect.top;


                const px =
                    x / rect.width;


                const py =
                    y / rect.height;


                /*
                    Chỉ xoay tối đa 5 độ.

                    Nhẹ hơn rất nhiều
                    so với tilt mạnh.
                */

                const ry =
                    (px-.5)*8;


                const rx =
                    -(py-.5)*8;


                card.style.setProperty(
                    "--mx",
                    `${px*100}%`
                );


                card.style.setProperty(
                    "--my",
                    `${py*100}%`
                );


                card.style.setProperty(
                    "--rx",
                    `${rx}deg`
                );


                card.style.setProperty(
                    "--ry",
                    `${ry}deg`
                );

            }
        );


        card.addEventListener(
            "pointerleave",
            () => {

                card.style.setProperty(
                    "--rx",
                    "0deg"
                );

                card.style.setProperty(
                    "--ry",
                    "0deg"
                );

                card.style.setProperty(
                    "--mx",
                    "50%"
                );

                card.style.setProperty(
                    "--my",
                    "50%"
                );

            }
        );

    });

}


/* =========================================================
   COUNTER
========================================================= */

let counterAnimation = null;


function animateCounter(target){

    if(counterAnimation)
        cancelAnimationFrame(
            counterAnimation
        );


    const start =
        Number(
            count.textContent
        ) || 0;


    const duration = 400;

    const startTime =
        performance.now();


    function update(now){

        const progress =
            Math.min(
                (now-startTime) /
                duration,
                1
            );


        const eased =
            1 -
            Math.pow(
                1-progress,
                3
            );


        count.textContent =
            Math.round(
                start +
                (target-start)*eased
            );


        if(progress < 1){

            counterAnimation =
                requestAnimationFrame(
                    update
                );

        }

    }


    counterAnimation =
        requestAnimationFrame(
            update
        );

}

search.addEventListener(

);


/* =========================================================
   CTRL + K
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            (event.ctrlKey ||
             event.metaKey) &&

            event.key.toLowerCase() === "k"
        ){

            event.preventDefault();

            search.focus();

            search.select();

        }

    }
);
